">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">Ἐν ἀρχῇ <span class=\"verb greek-click\" data-word=\"ἦν\" data-meaning=\"was\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Imperfect active indicative, 3rd singular\">ἦν</span> ὁ <span class=\"noun greek-click\" data-word=\"λόγος\" data-meaning=\"Word\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">λόγος</span>, καὶ ὁ λόγος <span class=\"verb greek-click\" data-word=\"ἦν\" data-meaning=\"was\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Imperfect active indicative, 3rd singular\">ἦν</span> πρὸς τὸν <span class=\"noun greek-click\" data-word=\"θεόν\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">θεόν</span>, καὶ <span class=\"noun greek-click\" data-word=\"θεὸς\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">θεὸς</span> <span class=\"verb greek-click\" data-word=\"ἦν\" data-meaning=\"was\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Imperfect active indicative, 3rd singular\">ἦν</span> ὁ λόγος... καὶ ὁ λόγος <span class=\"noun greek-click\" data-word=\"σὰρξ\" data-meaning=\"flesh\" data-lemma=\"σάρξ\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">σὰρξ</span> <span class=\"verb greek-click\" data-word=\"ἐγένετο\" data-meaning=\"became\" data-lemma=\"γίνομαι\" data-pos=\"Verb\" data-form=\"Aorist middle indicative, 3rd singular\">ἐγένετο</span> καὶ <span class=\"verb greek-click\" data-word=\"ἐσκήνωσεν\" data-meaning=\"dwelt, tabernacled\" data-lemma=\"σκηνόω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">ἐσκήνωσεν</span> ἐν ἡμῖν.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">25. 이사야 55:11</div>\n  <div class=\"verse\">내 입에서 나가는 <span class='blue'>나의 말도 헛되이 내게 돌아오지 않고</span>, 내가 기뻐하는 것을 이루며 내가 보낸 일에서 성공할 것입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">내 입에서 나가는 말도 헛되이 내게로 돌아오지 아니하고 나의 뜻을 이루며 나의 명하여 보낸 일에 형통하리라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“so shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall do that which I please, and it shall accomplish that for which I send it.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('so shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall do that which I please, and it shall accomplish that for which I send it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“so My word that proceeds from My mouth will not return to Me empty, but it will accomplish what I please, and it will prosper where I send it.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('so My word that proceeds from My mouth will not return to Me empty, but it will accomplish what I please, and it will prosper where I send it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's word always accomplishes the purpose for which He sends it.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s word always accomplishes the purpose for which He sends it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">כֵּן יִהְיֶה דְבָרִי אֲשֶׁר יֵצֵא מִפִּי לֹא־יָשׁוּב אֵלַי רֵיקָם כִּי אִם־עָשָׂה אֶת־אֲשֶׁר חָפַצְתִּי</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">26. 이사야 11:9 하반절</div>\n  <div class=\"verse\"><span class='blue'>물이 바다를 덮음같이 여호와를 아는 지식이 땅에 충만할 것</span>입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">물이 바다를 덮음 같이 여호와를 아는 지식이 세상에 충만할 것임이니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“They shall not hurt nor destroy in all my holy mountain; for the earth shall be full of the knowledge of Jehovah, as the waters cover the sea.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('They shall not hurt nor destroy in all my holy mountain; for the earth shall be full of the knowledge of Jehovah, as the waters cover the sea.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“They will neither harm nor destroy on all My holy mountain, for the earth will be full of the knowledge of the LORD as the sea is full of water.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('They will neither harm nor destroy on all My holy mountain, for the earth will be full of the knowledge of the LORD as the sea is full of water.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">One day the whole earth will be filled with the knowledge of the Lord.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('One day the whole earth will be filled with the knowledge of the Lord.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">כִּי־מָלְאָה הָאָרֶץ דֵּעָה אֶת־יְהוָה כַּמַּיִם לַיָּם מְכַסִּים</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div>\n  </div>\n</div>", "study": "<div class=\"card study\">\n<h3>STUDY — 성경 1–26</h3>\n<p>각 성구를 <strong>원어 → DARBY/BSB 비교 → 문맥 → 본문이 분명히 말하는 것 → 해석적 주의</strong> 순서로 살펴봅니다.</p>\n<p class=\"guide-note\">번역본의 표현과 해석적 설명을 성경 본문 자체의 직접 진술과 구분하여 표시했습니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>1. 딤후 3:16–17</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>θεόπνευστος (theopneustos)는 ‘하나님께서 숨을 내쉬신, God-breathed’이라는 뜻입니다. 문장의 초점은 성경의 신적 기원과 그 유익에 있습니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>문맥은 말세의 어려움과 거짓 가르침 속에서 디모데가 ‘배우고 확신한 것’과 ‘거룩한 글들’에 머물라는 권면입니다(3:14–15).</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>본문은 성경이 하나님에게서 왔으며 가르침·책망·바로잡음·의의 훈련에 유익하고 하나님의 사람을 선한 일을 위해 갖추게 한다고 분명히 말합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절만으로 영감의 세부 방식이나 특정 영감 이론 전체를 확정하기보다, 본문이 직접 강조하는 신적 기원과 실제적 기능을 먼저 붙드는 것이 안전합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>theopneustos means “God-breathed.” The focus is the divine source of Scripture and its usefulness.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The context urges Timothy, amid difficult times and false teaching, to remain in what he learned and in the sacred writings.</p>\n<p><strong>4. What the text clearly says</strong><br>The text clearly says Scripture comes from God and is useful for teaching, correction, training, and equipping God's person for every good work.</p>\n<p><strong>5. Interpretive caution</strong><br>The verse should not be made to settle every later theory of inspiration by itself. Its explicit claims about divine source and practical function should come first.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>2. 벧후 1:21</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>φερόμενοι (pheromenoi)는 ‘운반되다, 이끌려 가다’입니다. 성경 저자들이 성령에 의해 ‘carried along’ 되었다는 그림을 줍니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>1:19–21은 예언의 말씀을 개인적 기원이나 인간의 뜻에서 나온 것으로 보지 않고 하나님께서 주신 것으로 설명합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>예언은 인간의 뜻에서 발생한 것이 아니며 사람들이 성령께 이끌려 하나님께 받아 말했습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>성령의 역사와 인간 저자의 역할이 어떤 방식으로 결합되는지에 대한 세부 모델은 이 한 절이 설명하지 않습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>pheromenoi means “being carried along.” It pictures the human speakers as moved by the Holy Spirit.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Verses 19–21 explain the prophetic word as having its source in God rather than merely in human initiative.</p>\n<p><strong>4. What the text clearly says</strong><br>Prophecy did not originate in human will; people spoke from God while carried by the Holy Spirit.</p>\n<p><strong>5. Interpretive caution</strong><br>The verse does not by itself explain every detail of how divine action and human authorship relate.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>3. 마 4:4</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ῥῆμα (rhēma)는 여기서 ‘말씀, 발화된 말’을 뜻합니다. 예수님은 신 8:3을 인용하여 하나님의 입에서 나오는 모든 말씀으로 사람이 산다고 하십니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>예수님의 광야 시험에서 사탄의 떡 시험에 대한 답변입니다. 육체적 필요를 부정하는 것이 아니라 하나님께 대한 의존이 더 근본적임을 보여 줍니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>사람의 생명은 물질적 양식만으로 유지되는 것이 아니라 하나님의 말씀과 그분께 대한 의존에 달려 있습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>λόγος와 ῥῆμα를 언제나 서로 완전히 다른 두 종류의 ‘말씀’으로 체계화하는 것은 문맥과 실제 용례를 함께 검토해야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>rhēma means a word or utterance. Jesus quotes Deuteronomy 8:3: human life depends on every word coming from God's mouth.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>This occurs in Jesus' wilderness temptation. He does not deny physical need but places dependence on God at the deeper level.</p>\n<p><strong>4. What the text clearly says</strong><br>Human beings do not live by material food alone but depend on God's word.</p>\n<p><strong>5. Interpretive caution</strong><br>One should be cautious about turning logos and rhēma into two rigid technical categories in every passage.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>4. 시 119:105</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>히브리어 דָּבָר (dābār)는 ‘말씀, 말, 일’을 뜻합니다. ‘등’과 ‘빛’은 하나님의 말씀이 삶의 방향을 비춘다는 시적 비유입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>시편 119편 전체는 하나님의 말씀·법·증거·규례를 사랑하고 따르는 삶을 노래합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님의 말씀은 시편 기자가 걸어갈 길을 밝히고 방향을 제시합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절은 모든 개인적 결정에 즉각적인 세부 답을 준다는 약속이라기보다 말씀의 지속적인 도덕적·영적 인도를 노래합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>Hebrew dābār means word, speech, or matter. Lamp and light are poetic images of God's word guiding one's path.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Psalm 119 celebrates loving, learning, and obeying God's instruction.</p>\n<p><strong>4. What the text clearly says</strong><br>God's word gives the psalmist light and direction for the path of life.</p>\n<p><strong>5. Interpretive caution</strong><br>This is not necessarily a promise of an instant detailed answer to every personal decision; it celebrates the enduring guidance of God's word.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>5. 엡 3:3,5</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ἀποκάλυψις는 ‘계시’, μυστήριον은 이전에 감추어졌다가 하나님께서 드러내신 ‘비밀’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>3장 문맥에서 그 비밀은 특히 이방인들이 그리스도 안에서 공동 상속자·한 몸·약속의 공동 참여자가 된다는 것입니다(3:6).</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>바울이 전하는 비밀은 인간적 추론이 아니라 하나님의 계시로 알려졌으며 이제 사도들과 신언자들에게 드러났습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘비밀’을 성경 본문이 정의하는 내용보다 더 넓은 특정 신학 체계와 자동으로 동일시하지 않는 것이 중요합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>apokalypsis means revelation; mystērion is a divine mystery once hidden and now disclosed.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>In Ephesians 3 the mystery especially concerns Gentiles becoming fellow heirs, fellow members of the body, and fellow partakers in Christ.</p>\n<p><strong>4. What the text clearly says</strong><br>The mystery was made known by divine revelation rather than merely human reasoning.</p>\n<p><strong>5. Interpretive caution</strong><br>The biblical definition of the mystery should control interpretation before it is identified with a larger theological system.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>6. 히 1:1–2</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ἐλάλησεν은 ‘말씀하셨다’이고 ἐν υἱῷ는 문자적으로 ‘아들 안에서/in Son’입니다. 관사가 없는 표현은 아들을 통한 하나님의 최종적 계시를 강하게 부각합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>히브리서는 옛 시대의 신언자들을 통한 말씀과 마지막 날들에 아들을 통한 말씀을 대조하면서 시작합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님은 역사 속에서 말씀하셨고, 마지막 날들에는 아들을 통해 결정적으로 말씀하셨습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘in Son’이라는 문구에서 본문이 말하지 않는 존재론적 세부를 과도하게 끌어내기보다 1:2–4가 설명하는 아들의 탁월성을 함께 읽어야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>elalēsen means “spoke,” and en huiō is literally “in Son.” The expression strongly highlights God's climactic revelation in the Son.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Hebrews opens by contrasting God's former speech through the prophets with His climactic speech in the Son.</p>\n<p><strong>4. What the text clearly says</strong><br>God has spoken throughout history and has now spoken decisively in the Son.</p>\n<p><strong>5. Interpretive caution</strong><br>The phrase should be read with verses 2–4 rather than made to carry more ontological detail than the immediate text states.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>7. 시 119:140</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>צְרוּפָה (tserufah)는 ‘정련된, 시험되어 순수한’이라는 뜻입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>시편 기자는 박해와 어려움 가운데서도 하나님의 말씀을 신뢰하고 사랑합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님의 말씀은 신뢰할 만하고 순수하며, 그 때문에 시편 기자가 그것을 사랑합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘pure’와 ‘well tried’ 중 하나만 옳다고 보기보다 히브리어의 정련된 금속 이미지를 함께 보는 것이 좋습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>Hebrew tserufah means refined, tested, or purified.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The psalmist trusts and loves God's word even amid trouble.</p>\n<p><strong>4. What the text clearly says</strong><br>God's word is reliable and pure, and therefore the servant loves it.</p>\n<p><strong>5. Interpretive caution</strong><br>Rather than forcing a choice between “pure” and “well tried,” the underlying refining image explains both.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>8. 벧전 1:24–25</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ῥῆμα κυρίου는 ‘주님의 말씀’입니다. μένει는 ‘머문다, 지속한다’라는 뜻입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>이 구절은 사 40:6–8을 인용하며 1:23의 ‘살아 있고 항상 있는 하나님의 말씀’과 연결됩니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>인간의 육체와 영광은 사라지지만 주님의 말씀은 영원히 지속되며, 베드로는 이것을 그들에게 전해진 복음과 연결합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>여기서 ‘말씀’은 단순히 인쇄된 책이라는 물질적 형태보다 하나님께서 선포하신 지속적인 복음의 말씀이라는 문맥을 먼저 고려해야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>rhēma kyriou means “the word of the Lord,” and menei means remains or abides.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Peter quotes Isaiah 40:6–8 and connects it with the living and abiding word in verse 23.</p>\n<p><strong>4. What the text clearly says</strong><br>Human life and glory fade, but the Lord's word remains forever; Peter identifies this with the good news preached to them.</p>\n<p><strong>5. Interpretive caution</strong><br>The immediate context emphasizes God's enduring proclaimed gospel, not merely the physical form of a printed book.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>9. 마 24:35</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>λόγοι는 예수님의 ‘말들/말씀들’입니다. οὐ μὴ + 접속법은 매우 강한 부정을 나타내어 ‘결코 지나가지 않을 것’을 강조합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>감람산 강화에서 예수님은 성전 파괴와 종말에 관한 말씀을 하시며 자신의 말씀의 확실성을 선언하십니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>창조 세계가 지나갈지라도 예수님의 말씀은 실패하거나 사라지지 않습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절을 성경 전체의 보존 교리와 연결할 수 있지만, 직접적인 주어는 우선 예수님의 ‘나의 말들’입니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>logoi means Jesus' words. The construction ou mē with the subjunctive gives an emphatic negation: they will certainly never pass away.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>In the Olivet discourse Jesus declares the certainty of His teaching concerning coming events.</p>\n<p><strong>4. What the text clearly says</strong><br>Creation may pass away, but Jesus' words will not fail.</p>\n<p><strong>5. Interpretive caution</strong><br>The verse can contribute to a doctrine of Scripture, but its direct reference is first to Jesus' own words.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>10. 마 5:18</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ἰῶτα는 가장 작은 헬라어 글자 이름으로 히브리어 요드(yod)를 가리키는 표현이고 κεραία는 작은 획·돌기입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>산상수훈에서 예수님은 자신이 율법이나 신언서를 폐하러 온 것이 아니라 성취하러 왔다고 말씀하신 직후입니다(5:17).</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님의 율법은 그 목적이 성취될 때까지 가볍게 폐기될 수 없습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>구약 율법이 신약 신자에게 어떤 방식으로 적용되는지는 5:17–20과 신약 전체의 성취 개념을 함께 보아야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>iōta points to the smallest letter, and keraia to a tiny stroke or projection.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Jesus has just said He came not to abolish the Law or Prophets but to fulfill them.</p>\n<p><strong>4. What the text clearly says</strong><br>God's law cannot simply be discarded before its purpose is fulfilled.</p>\n<p><strong>5. Interpretive caution</strong><br>How Old Testament law applies under the new covenant must be considered from the wider New Testament teaching on fulfillment.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>11. 사 40:22</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>חוּג (ḥûg)는 ‘원, 둥근 둘레, 지평선의 원’을 뜻합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>이사야 40장은 포로 상황에 있는 백성에게 창조주 하나님의 위대하심과 비교할 수 없는 주권을 선포합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님은 땅과 그 거민 위에 높이 계신 창조주이십니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절을 현대 과학의 ‘구형 지구’에 대한 기술적 진술로 사용하는 것은 히브리 시의 목적을 넘어갈 수 있습니다. 핵심은 하나님의 창조주적 위엄입니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>Hebrew ḥûg means circle, circuit, or the circle of the horizon.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Isaiah 40 comforts God's people by proclaiming the incomparable greatness of the Creator.</p>\n<p><strong>4. What the text clearly says</strong><br>God is exalted above the earth and its inhabitants.</p>\n<p><strong>5. Interpretive caution</strong><br>Using this poetic text as a technical modern scientific statement about a spherical earth can go beyond its purpose; its main point is God's majesty as Creator.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>12. 눅 24:27</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>διερμήνευσεν은 ‘자세히 해석하다, 설명하다’이며 γραφαῖς는 ‘성경들/기록들’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>엠마오로 가는 두 제자에게 부활하신 예수님이 모세와 모든 신언자들에서 자신에 관한 것을 설명하시는 장면입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>예수님은 구약 성경을 자신의 고난과 영광을 이해하는 틀로 사용하셨습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>구약의 모든 개별 구절이 직접적으로 예수님을 예언한다는 뜻으로 확대하기보다, 성경 전체의 이야기와 약속이 그리스도 안에서 어떻게 성취되는지를 보는 것이 적절합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>diērmēneusen means explained or interpreted, and graphais means Scriptures or writings.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The risen Jesus explains Himself from Moses and all the Prophets to the two disciples on the Emmaus road.</p>\n<p><strong>4. What the text clearly says</strong><br>Jesus reads the Old Testament as the framework for understanding His suffering and glory.</p>\n<p><strong>5. Interpretive caution</strong><br>This need not mean that every individual Old Testament sentence is a direct prediction of Jesus; the whole scriptural story and promise reaches fulfillment in Him.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>13. 눅 24:44</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>πληρωθῆναι는 ‘성취되다’이고, 율법·신언서·시편은 구약 성경 전체를 가리키는 포괄적 방식입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>부활하신 예수님이 제자들에게 자신의 죽음과 부활을 성경의 성취로 설명하시는 문맥입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>예수님의 사역은 구약 성경과 단절된 사건이 아니라 그 기록의 성취로 제시됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘시편’이 정확히 히브리 정경의 제3부 전체를 기술적으로 의미하는지 여부는 논의가 있으므로 단정할 필요는 없습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>plērōthēnai means “to be fulfilled.” Law, Prophets, and Psalms function as a broad reference to Israel's Scriptures.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The risen Jesus explains His death and resurrection as fulfillment of Scripture.</p>\n<p><strong>4. What the text clearly says</strong><br>Jesus' mission is presented not as detached from the Old Testament but as its fulfillment.</p>\n<p><strong>5. Interpretive caution</strong><br>Whether “Psalms” is a technical label for the entire third division of the Hebrew canon is debated and need not be overclaimed.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>14. 롬 10:8</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ῥῆμα τῆς πίστεως는 ‘믿음의 말씀/메시지’이며, 바울은 신 30장의 언어를 복음 선포에 적용합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>롬 10장은 그리스도 안에 나타난 하나님의 의와 믿음으로 받는 구원을 설명합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>복음의 말씀은 멀리 있어 인간이 올라가거나 내려가 가져와야 하는 것이 아니라 가까이 선포되어 믿고 고백할 수 있습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘입과 마음에 있는 말씀’을 단순한 긍정적 자기고백의 공식으로 바꾸기보다 10:9–10의 예수님의 주되심과 부활에 대한 믿음의 문맥을 유지해야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>rhēma tēs pisteōs is “the word/message of faith.” Paul applies Deuteronomy 30 language to the proclaimed gospel.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Romans 10 explains God's righteousness and salvation received through faith in Christ.</p>\n<p><strong>4. What the text clearly says</strong><br>The gospel is not impossibly distant; it has been brought near in proclamation so it can be believed and confessed.</p>\n<p><strong>5. Interpretive caution</strong><br>The phrase should not be reduced to a formula of positive verbal confession; verses 9–10 define the context as faith in Jesus as Lord and in His resurrection.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>15. 롬 10:17</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>πίστις는 ‘믿음’, ἀκοή는 ‘들음/들은 소식’, ῥήματος Χριστοῦ는 ‘그리스도의 말씀’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>문맥은 복음이 선포되고, 사람들이 듣고, 믿고, 주님의 이름을 부르는 과정입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>믿음은 복음의 소식을 들음과 연결되고, 그 들음은 그리스도의 말씀/메시지를 통해 옵니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절을 ‘성경을 소리 내어 들으면 자동으로 믿음의 양이 증가한다’는 기계적 공식으로 읽는 것은 문맥보다 좁습니다. 여기서는 복음 선포와 믿음의 반응이 중심입니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>pistis is faith, akoē hearing/report, and rhēmatos Christou “the word/message of Christ.”</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The context traces proclamation, hearing, believing, and calling on the Lord.</p>\n<p><strong>4. What the text clearly says</strong><br>Faith is connected with hearing the gospel, and that hearing comes through the message concerning Christ.</p>\n<p><strong>5. Interpretive caution</strong><br>The verse is not best reduced to a mechanical formula that merely hearing Scripture aloud automatically increases a quantity of faith; gospel proclamation and response are central.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>16. 벧전 1:23</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ἀναγεγεννημένοι는 ‘거듭난/새로 태어난’이고, λόγου θεοῦ는 ‘하나님의 말씀’입니다. ζῶντος와 μένοντος는 ‘살아 있고 지속하는’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>1:22의 진리에 대한 순종과 형제 사랑에서 1:23–25의 거듭남과 영원한 말씀으로 이어집니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>새 생명의 근원은 썩는 씨가 아니라 하나님의 살아 있고 지속하는 말씀과 연결됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>23절의 ‘살아 있고 항상 있는’이 문법적으로 하나님을 수식하는지 말씀을 수식하는지 논의가 있지만, 25절의 ‘주님의 말씀은 영원히 거한다’가 지속성의 주제를 분명히 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>anagegennēmenoi means having been born again; logos theou is God's word; zōntos and menontos express living and abiding.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Peter moves from obedience to truth and brotherly love to new birth through the enduring word.</p>\n<p><strong>4. What the text clearly says</strong><br>New birth is associated with imperishable seed and God's living, enduring word.</p>\n<p><strong>5. Interpretive caution</strong><br>There is grammatical discussion over the exact attachment of “living and abiding,” but verse 25 clearly emphasizes the enduring word of the Lord.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>17. 요 6:63</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ζῳοποιοῦν은 ‘생명을 주는’, ῥήματα는 ‘말씀들/발화들’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>생명의 떡 담화 후반부이며, 예수님의 말씀을 문자적·육적인 방식으로 받아들여 걸려 넘어진 사람들의 반응과 연결됩니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>생명을 주시는 분은 그 영이며, 예수님의 말씀은 영과 생명이라고 선언됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘육체는 무익하다’를 예수님의 실제 성육신이나 육체 자체가 악하다는 뜻으로 읽으면 요 1:14와 충돌합니다. 문맥에서 ‘육체’의 의미를 보아야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>zōopoioun means giving life; rhēmata means words or utterances.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>This comes near the end of the Bread of Life discourse, where many stumble over Jesus' words.</p>\n<p><strong>4. What the text clearly says</strong><br>The Spirit gives life, and Jesus declares His words to be spirit and life.</p>\n<p><strong>5. Interpretive caution</strong><br>“The flesh profits nothing” should not be taken to deny the real incarnation or to teach that physical flesh is inherently evil; John 1:14 and the immediate context must govern the meaning.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>18. 히 4:12</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ζῶν은 ‘살아 있는’, ἐνεργής는 ‘활동적인, 효과적인’, κριτικός는 ‘판단하고 분별하는’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>3–4장의 광야 세대와 하나님의 안식에 들어가라는 권면, 그리고 하나님의 음성을 ‘오늘’ 들으라는 경고의 결론 부분입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님의 말씀은 살아 있고 효력이 있어 인간의 가장 깊은 내면을 드러내고 판단합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>여기 ‘하나님의 말씀’을 곧바로 ‘성경책’이라는 물체에만 한정하기보다 문맥에서 현재 말씀하시고 심판하시는 하나님의 말씀을 보아야 합니다. 물론 성경은 그 말씀을 우리에게 증언합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>zōn means living, energēs active/effective, and kritikos able to judge or discern.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>This concludes the warning drawn from the wilderness generation and the call to hear God's voice “today.”</p>\n<p><strong>4. What the text clearly says</strong><br>God's word is living and effective, exposing and judging the deepest human interior.</p>\n<p><strong>5. Interpretive caution</strong><br>In context, “word of God” should not be reduced merely to a physical Bible as an object; it is God's living, judging speech, to which Scripture bears authoritative witness.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>19. 약 1:21</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>ἔμφυτος는 ‘심어진, 안에 심겨진’이고 δέξασθε는 ‘받아들이라’는 명령입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>1:18의 ‘진리의 말씀으로 우리를 낳으심’과 1:22의 ‘말씀을 실행하는 사람이 되라’ 사이에 있습니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>믿는 이는 악을 버리고 심어진 말씀을 온유하게 받아야 하며, 그 말씀은 혼을 구원할 능력이 있습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘혼을 구원한다’의 정확한 범위를 단 한 가지 신학적 단계로 고정하기보다 야고보서의 지속적 순종과 종말론적 구원 문맥을 함께 살피는 것이 좋습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>emphytos means implanted or planted within; dexasthe is the command “receive.”</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>It stands between verse 18, where God brings us forth by the word of truth, and verse 22, which commands doing the word.</p>\n<p><strong>4. What the text clearly says</strong><br>Believers are to put away evil and humbly receive the implanted word, which is able to save their souls.</p>\n<p><strong>5. Interpretive caution</strong><br>The exact scope of “save your souls” should be read within James's larger themes of persevering obedience and final salvation rather than forced into one isolated theological stage.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>20. 시 119:103</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>נִּמְלְצוּ는 ‘달다, 즐겁다’는 감각적 표현이며, 꿀은 당시 가장 강한 단맛의 대표적 이미지입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>시편 기자는 말씀을 단순한 의무가 아니라 사랑하고 즐기는 대상으로 묘사합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님의 말씀은 지성과 의무의 대상일 뿐 아니라 맛보고 즐거워할 만큼 귀한 것으로 체험됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘달다’는 표현을 감정적 황홀감만으로 제한하지 말고, 119편 전체의 배우고 순종하고 묵상하는 삶과 연결해야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>The Hebrew verb expresses sweetness or pleasantness; honey was a natural image of intense sweetness.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The psalmist treats God's word not merely as duty but as something loved and enjoyed.</p>\n<p><strong>4. What the text clearly says</strong><br>God's word is not only to be understood and obeyed; it is experienced as deeply delightful.</p>\n<p><strong>5. Interpretive caution</strong><br>“Sweetness” should not be reduced to emotional excitement; Psalm 119 joins delight with learning, meditation, and obedience.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>21. 벧전 2:2</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>λογικὸν은 번역이 중요한 단어입니다. ‘합리적인/말씀에 속한/영적인’의 의미 범위를 가지며, γάλα는 ‘젖’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>1:23–25의 하나님의 영원한 말씀 바로 뒤에서 갓난아기처럼 순수한 젖을 사모하라고 권합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>믿는 이들은 영적 성장을 위해 순수한 양식을 간절히 사모해야 합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>헬라어 본문에 ‘word’라는 명사 λόγος가 직접 들어 있지는 않습니다. 따라서 RV의 ‘milk of the word’는 문맥을 반영한 해석적 번역이라는 점을 STUDY에서 분명히 구분하는 것이 중요합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>logikon is a key translation issue. It can carry senses such as rational, spiritual, or related to reason/word; gala means milk.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>The exhortation immediately follows 1:23–25 about God's enduring word.</p>\n<p><strong>4. What the text clearly says</strong><br>Believers are to crave pure nourishment so that they may grow.</p>\n<p><strong>5. Interpretive caution</strong><br>The Greek text does not contain the noun logos (“word”) here. RV's “milk of the word” is therefore an interpretive rendering informed by context, an important distinction between text and interpretation.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>22. 행 20:32</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>λόγος τῆς χάριτος는 ‘은혜의 말씀/메시지’, οἰκοδομῆσαι는 ‘건축하다, 세우다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>바울이 에베소 장로들에게 마지막으로 권면하며 자신의 부재 이후의 위험을 경고한 뒤 하는 말입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님과 그분의 은혜의 말씀은 믿는 이들을 세우고 유업을 주실 능력이 있습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘건축’을 특정 조직이나 사역 체계의 확장과 자동으로 동일시하지 말고, 본문이 하나님과 은혜의 말씀에 사람들을 맡기는 데 초점을 둔다는 점을 보아야 합니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>logos tēs charitos means “the word/message of grace”; oikodomēsai means to build up.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Paul gives his farewell charge to the Ephesian elders after warning of future dangers.</p>\n<p><strong>4. What the text clearly says</strong><br>God and the word of His grace are able to build believers up and give the inheritance.</p>\n<p><strong>5. Interpretive caution</strong><br>“Building up” should not automatically be equated with expanding a particular organization or ministry system; Paul's focus is entrusting people to God and His gracious word.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>23. 엡 5:26</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>λουτρόν은 ‘씻음/목욕’, ὕδωρ는 ‘물’, ἐν ῥήματι는 문자적으로 ‘말씀 안에서/말씀으로’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>그리스도께서 교회를 사랑하시고 자신을 내어주신 목적을 설명하는 5:25–27 안에 있습니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>그리스도의 사랑과 자기희생은 교회를 거룩하고 깨끗하게 하여 영광스럽게 세우는 것을 목표로 합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘물=성령’ 또는 특정한 말씀 실천을 이 구절 하나로 확정하는 것은 해석 단계입니다. 본문은 ‘물의 씻음’과 ‘말씀’을 밀접하게 연결하지만 그 모든 상징적 세부를 설명하지는 않습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>loutron means washing/bath, hydōr water, and en rhēmati literally “in/with a word.”</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>This is part of verses 25–27 describing Christ's love and self-giving for the church.</p>\n<p><strong>4. What the text clearly says</strong><br>Christ's self-giving aims at sanctifying and cleansing the church and presenting her in glory.</p>\n<p><strong>5. Interpretive caution</strong><br>Equating the water with the Spirit or with one specific devotional practice is an interpretive step. The text closely joins washing and word but does not explain every symbolic detail.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>24. 요 1:1,14</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>λόγος는 ‘말씀/Word’, σὰρξ ἐγένετο는 ‘육체가 되셨다’, ἐσκήνωσεν은 ‘장막을 치셨다, 거하셨다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>요한복음 서문은 말씀의 영원한 존재, 하나님과의 관계, 신성, 창조 사역, 그리고 성육신을 선언합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>말씀은 태초에 계셨고 하나님과 함께 계셨으며 하나님이셨고, 실제로 육체가 되어 우리 가운데 거하셨습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘말씀’을 단순히 성경책과 동일시하면 요한의 의미를 놓칩니다. 여기서 λόγος는 인격적인 말씀, 곧 1:17–18에서 예수 그리스도로 명확히 드러나는 분입니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>logos is Word; sarx egeneto means “became flesh”; eskēnōsen means dwelt or tabernacled.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>John's prologue declares the Word's eternal existence, relation to God, deity, role in creation, and incarnation.</p>\n<p><strong>4. What the text clearly says</strong><br>The Word existed in the beginning, was with God, was God, and truly became flesh and lived among us.</p>\n<p><strong>5. Interpretive caution</strong><br>Logos here should not simply be equated with the Bible as a book. It is the personal Word, identified in the prologue with Jesus Christ.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>25. 사 55:11</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>דְבָרִי (devarî)는 ‘나의 말’, רֵיקָם은 ‘헛되이, 빈손으로’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>사 55장은 목마른 자들을 하나님의 풍성한 은혜로 초청하고, 하나님의 생각과 길이 인간보다 높음을 선언한 뒤 말씀의 효력을 설명합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님께서 보내시는 말씀은 헛되이 끝나지 않고 그분이 뜻하신 목적을 성취합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 약속을 내가 선택한 아무 성구나 말하면 내가 원하는 결과가 반드시 생긴다는 개인적 공식으로 바꾸어서는 안 됩니다. 성취되는 것은 하나님이 기뻐하시고 보내신 목적입니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>Hebrew devarî means “my word,” and reqam means empty or without result.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Isaiah 55 invites the thirsty to God's grace, contrasts God's thoughts with human thoughts, and then describes the effectiveness of His word.</p>\n<p><strong>4. What the text clearly says</strong><br>The word God sends does not fail; it accomplishes the purpose for which He sends it.</p>\n<p><strong>5. Interpretive caution</strong><br>This is not a formula that any verse we choose and speak must produce whatever result we desire. The purpose accomplished is God's own purpose.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>\n\n<div class=\"card study-item\">\n<h3>26. 사 11:9 하반절</h3>\n<div class=\"study-ko-detail\">\n<p><strong>① 핵심 원어</strong><br>דֵּעָה (de‘ah)는 ‘지식’, יְהוָה는 여호와/YHWH이며, 물이 바다를 덮는다는 표현은 충만함을 묘사합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>이사야 11장은 이새의 줄기에서 나오는 메시아적 왕과 그의 의로운 통치, 평화로운 창조 질서를 묘사합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>여호와를 아는 지식이 온 땅에 충만하게 되는 것이 메시아적 평화의 핵심 특징으로 제시됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절은 성경 자체의 보급량을 직접 말하는 것이 아니라 ‘여호와를 아는 지식’의 보편적 충만을 말합니다. 성경 주제에 포함할 수 있지만 이 차이는 보존하는 것이 좋습니다.</p>\n</div>\n<div class=\"study-en-detail\" style=\"margin-top:18px;padding-top:16px;border-top:1px solid var(--line)\">\n<div class=\"engtitle\">ENGLISH STUDY</div>\n<p><strong>1. Key original-language point</strong><br>Hebrew de‘ah means knowledge; YHWH is the divine name, and waters covering the sea picture fullness.</p>\n<p><strong>2. DARBY ↔ BSB</strong><br>Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.</p>\n<p><strong>3. Context</strong><br>Isaiah 11 describes the messianic ruler from Jesse, righteous rule, and a transformed peace.</p>\n<p><strong>4. What the text clearly says</strong><br>The earth being full of the knowledge of YHWH is presented as a central feature of that messianic peace.</p>\n<p><strong>5. Interpretive caution</strong><br>The verse does not directly predict the quantity of Bible distribution; it speaks of universal knowledge of the LORD. It can belong in a Scripture theme, but that distinction should remain clear.</p>\n<div class=\"audio-row\"><button class=\"listen\" onclick=\"speakCardStudy(this)\">🔊 Listen to English Study</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n</div>\n</div>"}};
