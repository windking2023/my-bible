<script>
const META={

const counts={"1Jn":[10,29,24,21,21],"2Jn":[13],"3Jn":[15]};
const MYKO={"1Jn": {"1": ["태초부터 있어 온 것, 우리가 들은 것, 우리가 우리의 눈으로 본 것, 우리가 바라보았고 우리의 손으로 만져 본 것, 곧 생명의 말씀에 관한 것입니다.", "그 생명이 나타났으며, 우리는 보았고 증언하며 여러분에게 영원한 생명을 전합니다. 이 생명은 아버지와 함께 있었으며 우리에게 나타났습니다.", "우리가 보고 들은 것을 여러분에게도 전하는 것은 여러분도 우리와 교제를 갖게 하려는 것입니다. 참으로 우리의 교제는 아버지와 그분의 아들 예수 그리스도와 함께하는 것입니다.", "우리가 이것들을 쓰는 것은 우리의 기쁨이 충만하게 되도록 하려는 것입니다.", "우리가 그분에게서 듣고 여러분에게 전하는 소식은 이것입니다. 하나님은 빛이시며, 그분 안에는 어떤 어둠도 전혀 없습니다.", "만일 우리가 그분과 교제를 갖고 있다고 말하면서 어둠 가운데 행한다면, 우리는 거짓말하는 것이며 진리를 행하지 않는 것입니다.", "그러나 그분께서 빛 가운데 계신 것처럼 우리가 빛 가운데 행한다면, 우리는 서로 교제를 가지며, 그분의 아들 예수의 피가 우리를 모든 죄에서 깨끗하게 합니다.", "만일 우리가 죄가 없다고 말한다면, 우리는 자신을 속이는 것이며 진리가 우리 안에 있지 않습니다.", "만일 우리가 우리의 죄들을 자백한다면, 그분은 신실하시고 의로우셔서 우리의 죄들을 용서하시고 우리를 모든 불의에서 깨끗하게 하십니다.", "만일 우리가 죄를 짓지 않았다고 말한다면, 우리는 그분을 거짓말하는 분으로 만드는 것이며 그분의 말씀이 우리 안에 있지 않습니다."], "2": ["나의 어린 자녀들이여, 내가 이것들을 여러분에게 쓰는 것은 여러분이 죄를 짓지 않게 하려는 것입니다. 그러나 누가 죄를 짓더라도 우리에게 아버지와 함께 계신 변호자가 있으니, 곧 의로우신 예수 그리스도이십니다.", "그분은 우리의 죄들을 위한 화목제물이시며, 우리의 죄들만이 아니라 온 세상의 죄들을 위한 것이기도 합니다.", "우리가 그분의 계명들을 지킨다면, 이것으로 우리가 그분을 알고 있음을 압니다.", "‘나는 그분을 안다’고 말하면서 그분의 계명들을 지키지 않는 사람은 거짓말하는 사람이며, 진리가 그 사람 안에 있지 않습니다.", "그러나 누구든지 그분의 말씀을 지키는 사람 안에서는 참으로 하나님의 사랑이 온전하게 되었습니다. 이것으로 우리가 그분 안에 있음을 압니다.", "그분 안에 거한다고 말하는 사람은 그분께서 걸으신 것처럼 자신도 그렇게 걸어야 합니다.", "사랑하는 이들이여, 내가 여러분에게 쓰는 것은 새 계명이 아니라 여러분이 처음부터 가지고 있던 옛 계명입니다. 이 옛 계명은 여러분이 들은 말씀입니다.", "그러나 다시 내가 여러분에게 새 계명을 씁니다. 이것은 그분 안에서와 여러분 안에서 참된 것입니다. 어둠이 지나가고 참빛이 이미 비치고 있기 때문입니다.", "빛 가운데 있다고 말하면서 자기 형제를 미워하는 사람은 지금까지도 어둠 가운데 있습니다.", "자기 형제를 사랑하는 사람은 빛 가운데 거하며, 그 사람 안에는 걸려 넘어지게 하는 것이 없습니다.", "그러나 자기 형제를 미워하는 사람은 어둠 가운데 있고 어둠 가운데 걸으며 어디로 가는지 알지 못합니다. 어둠이 그의 눈을 멀게 하였기 때문입니다.", "어린 자녀들이여, 내가 여러분에게 쓰는 것은 그분의 이름 때문에 여러분의 죄들이 용서받았기 때문입니다.", "아버지들이여, 내가 여러분에게 쓰는 것은 여러분이 태초부터 계신 분을 알았기 때문입니다. 젊은이들이여, 내가 여러분에게 쓰는 것은 여러분이 악한 자를 이겼기 때문입니다.", "어린아이들이여, 내가 여러분에게 쓴 것은 여러분이 아버지를 알았기 때문입니다. 아버지들이여, 내가 여러분에게 쓴 것은 여러분이 태초부터 계신 분을 알았기 때문입니다. 젊은이들이여, 내가 여러분에게 쓴 것은 여러분이 강하고 하나님의 말씀이 여러분 안에 거하며 여러분이 악한 자를 이겼기 때문입니다.", "세상이나 세상에 있는 것들을 사랑하지 마십시오. 누구든지 세상을 사랑하면 아버지의 사랑이 그 사람 안에 있지 않습니다.", "세상에 있는 모든 것, 곧 육체의 욕망과 눈의 욕망과 생활의 자랑은 아버지에게서 나온 것이 아니라 세상에서 나온 것입니다.", "세상과 그 욕망은 지나가지만, 하나님의 뜻을 행하는 사람은 영원히 거합니다.", "어린아이들이여, 지금은 마지막 때입니다. 적그리스도가 온다는 말을 여러분이 들은 것처럼 지금 많은 적그리스도들이 나타났습니다. 이것으로 우리는 지금이 마지막 때임을 압니다.", "그들은 우리에게서 나갔지만 우리에게 속한 사람들이 아니었습니다. 그들이 우리에게 속하였다면 우리와 함께 머물렀을 것입니다. 그러나 그들이 나간 것은 그들 모두가 우리에게 속한 것이 아님이 드러나게 하려는 것이었습니다.", "여러분은 거룩하신 분에게서 기름부음을 받았고, 여러분 모두가 압니다.", "내가 여러분에게 쓴 것은 여러분이 진리를 알지 못하기 때문이 아니라 진리를 알고 있으며 어떤 거짓도 진리에서 나오지 않음을 알기 때문입니다.", "거짓말하는 자가 누구입니까? 예수께서 그리스도이심을 부인하는 사람이 아닙니까? 아버지와 아들을 부인하는 그 사람이 적그리스도입니다.", "아들을 부인하는 사람에게는 아버지도 없습니다. 아들을 시인하는 사람에게는 아버지도 있습니다.", "여러분은 처음부터 들은 것이 여러분 안에 거하게 하십시오. 처음부터 들은 것이 여러분 안에 거하면 여러분도 아들과 아버지 안에 거할 것입니다.", "그분께서 우리에게 약속하신 약속은 이것이니, 곧 영원한 생명입니다.", "여러분을 미혹하는 사람들에 관하여 내가 이것들을 여러분에게 썼습니다.", "여러분은 그분에게서 받은 기름부음이 여러분 안에 거하므로 아무도 여러분을 가르칠 필요가 없습니다. 그분의 기름부음이 모든 것에 관하여 여러분을 가르치며, 그것은 참되고 거짓이 아닙니다. 그 기름부음이 여러분을 가르친 대로 그분 안에 거하십시오.", "그러므로 이제 어린 자녀들이여, 그분 안에 거하십시오. 그분께서 나타나실 때 우리가 담대함을 가지고 그분의 오심 앞에서 부끄러워 물러나지 않게 하려는 것입니다.", "그분께서 의로우심을 여러분이 안다면, 의를 행하는 사람마다 그분에게서 태어났다는 것도 아십시오."], "3": ["보십시오. 아버지께서 우리에게 어떠한 사랑을 주셨기에 우리가 하나님의 자녀들이라 불리게 되었습니까! 그리고 우리는 실제로 그러합니다. 세상이 우리를 알지 못하는 것은 그분을 알지 못했기 때문입니다.", "사랑하는 이들이여, 지금 우리는 하나님의 자녀들입니다. 우리가 장차 무엇이 될지는 아직 나타나지 않았습니다. 그러나 그분께서 나타나시면 우리가 그분과 같아질 것을 압니다. 우리가 그분을 그분 그대로 볼 것이기 때문입니다.", "그분께 이러한 소망을 두는 사람마다 그분께서 순결하신 것처럼 자신을 순결하게 합니다.", "죄를 짓는 사람마다 불법도 행합니다. 죄는 불법입니다.", "여러분은 그분께서 죄들을 없애시려고 나타나신 것을 압니다. 그분 안에는 죄가 없습니다.", "그분 안에 거하는 사람마다 죄 가운데 계속 살지 않습니다. 죄 가운데 계속 사는 사람마다 그분을 보지도 못했고 알지도 못했습니다.", "어린 자녀들이여, 아무도 여러분을 미혹하지 못하게 하십시오. 의를 행하는 사람은 그분께서 의로우신 것처럼 의롭습니다.", "죄를 행하는 사람은 마귀에게 속합니다. 마귀는 처음부터 죄를 짓고 있기 때문입니다. 하나님의 아들이 나타나신 것은 마귀의 일들을 멸하시기 위한 것입니다.", "하나님에게서 태어난 사람마다 죄를 삶의 방식으로 행하지 않습니다. 하나님의 씨가 그 사람 안에 거하기 때문입니다. 그는 하나님에게서 태어났으므로 죄 가운데 계속 살 수 없습니다.", "이것으로 하나님의 자녀들과 마귀의 자녀들이 드러납니다. 의를 행하지 않는 사람은 누구든지 하나님에게 속하지 않으며, 자기 형제를 사랑하지 않는 사람도 그러합니다.", "우리가 서로 사랑해야 한다는 것은 여러분이 처음부터 들은 소식입니다.", "악한 자에게 속하여 자기 형제를 죽인 가인과 같이 하지 마십시오. 그가 무엇 때문에 형제를 죽였습니까? 자기 행위들은 악하고 형제의 행위들은 의로웠기 때문입니다.", "형제들이여, 세상이 여러분을 미워하더라도 놀라지 마십시오.", "우리는 형제들을 사랑하기 때문에 죽음에서 생명으로 옮겨갔음을 압니다. 사랑하지 않는 사람은 죽음 안에 거합니다.", "자기 형제를 미워하는 사람마다 살인자입니다. 그리고 여러분은 살인자 안에 영원한 생명이 거하지 않는다는 것을 압니다.", "그분께서 우리를 위하여 자신의 생명을 내놓으신 것으로 우리가 사랑을 알았습니다. 그러므로 우리도 형제들을 위하여 우리의 생명을 내놓아야 합니다.", "누구든지 세상의 재물을 가지고 있으면서 자기 형제가 궁핍한 것을 보고도 그에게서 마음을 닫는다면, 어떻게 하나님의 사랑이 그 사람 안에 거하겠습니까?", "어린 자녀들이여, 말이나 혀로만 사랑하지 말고 행함과 진리로 사랑합시다.", "이것으로 우리가 진리에 속해 있음을 알 것이며, 그분 앞에서 우리의 마음을 확신시킬 것입니다.", "우리의 마음이 우리를 정죄하더라도 하나님은 우리의 마음보다 크시며 모든 것을 아십니다.", "사랑하는 이들이여, 우리의 마음이 우리를 정죄하지 않는다면 우리는 하나님을 향하여 담대함을 가집니다.", "그리고 우리가 무엇을 구하든지 그분에게서 받습니다. 우리가 그분의 계명들을 지키고 그분 앞에서 기뻐하시는 것들을 행하기 때문입니다.", "그분의 계명은 이것입니다. 곧 그분의 아들 예수 그리스도의 이름을 믿고, 그분께서 우리에게 계명을 주신 대로 서로 사랑하는 것입니다.", "그분의 계명들을 지키는 사람은 그분 안에 거하고 그분도 그 사람 안에 거하십니다. 그리고 그분께서 우리에게 주신 그 영으로 우리는 그분께서 우리 안에 거하심을 압니다."], "4": ["사랑하는 이들이여, 모든 영을 믿지 말고 그 영들이 하나님에게서 나온 것인지 시험하십시오. 많은 거짓 신언자들이 세상에 나왔기 때문입니다.", "이것으로 여러분은 하나님의 영을 압니다. 예수 그리스도께서 육체로 오셨음을 시인하는 영마다 하나님에게서 나온 것입니다.", "예수를 시인하지 않는 영마다 하나님에게서 나온 것이 아닙니다. 이것이 적그리스도의 영입니다. 여러분은 그것이 온다는 말을 들었고 지금 이미 세상에 있습니다.", "어린 자녀들이여, 여러분은 하나님에게서 났으며 그들을 이겼습니다. 여러분 안에 계신 분이 세상에 있는 자보다 크시기 때문입니다.", "그들은 세상에 속합니다. 그러므로 세상에 속한 것을 말하고 세상은 그들의 말을 듣습니다.", "우리는 하나님에게 속합니다. 하나님을 아는 사람은 우리의 말을 듣고, 하나님에게 속하지 않은 사람은 우리의 말을 듣지 않습니다. 이것으로 우리는 진리의 영과 미혹의 영을 압니다.", "사랑하는 이들이여, 우리가 서로 사랑합시다. 사랑은 하나님에게서 나오며, 사랑하는 사람마다 하나님에게서 태어났고 하나님을 압니다.", "사랑하지 않는 사람은 하나님을 알지 못합니다. 하나님은 사랑이시기 때문입니다.", "하나님의 사랑이 우리 가운데 이렇게 나타났습니다. 하나님께서 자신의 독생자를 세상에 보내셔서 우리가 그분을 통하여 살게 하셨습니다.", "사랑은 여기에 있습니다. 우리가 하나님을 사랑한 것이 아니라 그분께서 우리를 사랑하시고 자신의 아들을 우리 죄들을 위한 화목제물로 보내신 것입니다.", "사랑하는 이들이여, 하나님께서 이처럼 우리를 사랑하셨으니 우리도 서로 사랑해야 합니다.", "아무도 어느 때에도 하나님을 본 적이 없습니다. 우리가 서로 사랑하면 하나님께서 우리 안에 거하시고 그분의 사랑이 우리 안에서 온전하게 됩니다.", "그분께서 자신의 영을 우리에게 주셨으므로, 이것으로 우리가 그분 안에 거하고 그분께서 우리 안에 거하심을 압니다.", "우리는 아버지께서 아들을 세상의 구주로 보내신 것을 보았고 증언합니다.", "누구든지 예수께서 하나님의 아들이심을 시인하면 하나님께서 그 사람 안에 거하시고 그 사람도 하나님 안에 거합니다.", "우리는 하나님께서 우리를 향해 가지신 사랑을 알고 믿었습니다. 하나님은 사랑이십니다. 사랑 안에 거하는 사람은 하나님 안에 거하고 하나님도 그 사람 안에 거하십니다.", "이것으로 사랑이 우리와 함께 온전하게 되어 심판의 날에 우리가 담대함을 갖게 됩니다. 그분께서 그러하신 것처럼 우리도 이 세상에서 그러하기 때문입니다.", "사랑 안에는 두려움이 없습니다. 오히려 온전한 사랑은 두려움을 밖으로 내쫓습니다. 두려움에는 형벌이 따르기 때문입니다. 두려워하는 사람은 사랑 안에서 온전하게 되지 못했습니다.", "우리가 사랑하는 것은 그분께서 먼저 우리를 사랑하셨기 때문입니다.", "누가 ‘나는 하나님을 사랑한다’고 말하면서 자기 형제를 미워한다면 그는 거짓말하는 사람입니다. 보이는 자기 형제를 사랑하지 않는 사람이 보이지 않는 하나님을 사랑할 수 없기 때문입니다.", "우리가 그분에게서 받은 계명은 이것입니다. 하나님을 사랑하는 사람은 자기 형제도 사랑해야 합니다."], "5": ["예수께서 그리스도이심을 믿는 사람마다 하나님에게서 태어났습니다. 낳으신 분을 사랑하는 사람마다 그분에게서 태어난 사람도 사랑합니다.", "우리가 하나님을 사랑하고 그분의 계명들을 행할 때, 이것으로 우리가 하나님의 자녀들을 사랑한다는 것을 압니다.", "하나님을 사랑하는 것은 이것이니, 곧 그분의 계명들을 지키는 것입니다. 그분의 계명들은 무거운 짐이 아닙니다.", "하나님에게서 태어난 것은 무엇이든지 세상을 이깁니다. 세상을 이긴 승리는 이것이니, 곧 우리의 믿음입니다.", "세상을 이기는 사람이 누구입니까? 예수께서 하나님의 아들이심을 믿는 사람이 아닙니까?", "이분은 물과 피를 통하여 오신 분, 곧 예수 그리스도이십니다. 물로만이 아니라 물과 피로 오셨습니다. 그리고 증언하시는 분은 그 영이십니다. 그 영은 진리이시기 때문입니다.", "증언하는 이들이 셋입니다.", "곧 그 영과 물과 피이며, 이 셋은 하나의 증언에 일치합니다.", "우리가 사람들의 증언을 받아들인다면 하나님의 증언은 더 큽니다. 이것이 하나님의 증언이니, 곧 그분께서 자신의 아들에 관하여 증언하신 것입니다.", "하나님의 아들을 믿는 사람은 자기 안에 그 증언을 가지고 있습니다. 하나님을 믿지 않는 사람은 그분을 거짓말하는 분으로 만들었습니다. 하나님께서 자신의 아들에 관하여 하신 증언을 믿지 않았기 때문입니다.", "그 증언은 이것입니다. 하나님께서 우리에게 영원한 생명을 주셨으며 이 생명은 그분의 아들 안에 있습니다.", "아들을 가진 사람에게는 생명이 있고, 하나님의 아들을 가지지 않은 사람에게는 생명이 없습니다.", "내가 하나님의 아들의 이름을 믿는 여러분에게 이것들을 쓴 것은 여러분이 영원한 생명을 가지고 있음을 알게 하려는 것입니다.", "우리가 그분을 향하여 가지는 담대함은 이것입니다. 우리가 그분의 뜻에 따라 무엇을 구하면 그분께서 우리를 들으십니다.", "우리가 무엇을 구하든지 그분께서 우리를 들으신다는 것을 안다면, 우리가 그분께 구한 것들을 가지고 있다는 것도 압니다.", "누구든지 자기 형제가 죽음에 이르지 않는 죄를 짓는 것을 보면 구하십시오. 그러면 하나님께서 그에게 생명을 주실 것입니다. 이것은 죽음에 이르지 않는 죄를 짓는 사람들에 관한 것입니다. 죽음에 이르는 죄가 있습니다. 그것에 관해서는 구하라고 내가 말하지 않습니다.", "모든 불의는 죄입니다. 그러나 죽음에 이르지 않는 죄가 있습니다.", "하나님에게서 태어난 사람마다 죄 가운데 계속 살지 않는다는 것을 우리는 압니다. 하나님에게서 태어나신 분께서 그를 지키시며 악한 자가 그를 붙잡지 못합니다.", "우리는 하나님에게 속해 있으며 온 세상은 악한 자 안에 놓여 있다는 것을 압니다.", "또한 하나님의 아들이 오셔서 우리에게 이해력을 주시어 참되신 분을 알게 하셨음을 압니다. 우리는 참되신 분 안에, 곧 그분의 아들 예수 그리스도 안에 있습니다. 이분은 참 하나님이시며 영원한 생명이십니다.", "어린 자녀들이여, 우상들로부터 자신을 지키십시오."]}, "2Jn": {"1": ["장로는 택함 받은 부인과 그 자녀들에게 편지합니다. 나는 그들을 진리 안에서 사랑하며, 나뿐 아니라 진리를 아는 모든 사람도 사랑합니다.", "이는 우리 안에 거하며 영원히 우리와 함께할 진리 때문입니다.", "하나님 아버지와 아버지의 아들 예수 그리스도에게서 오는 은혜와 긍휼과 평안이 진리와 사랑 안에서 우리와 함께할 것입니다.", "아버지께 우리가 받은 계명대로 당신의 자녀들 가운데 진리 안에서 걷는 이들을 발견하고 나는 크게 기뻐했습니다.", "이제 부인이여, 내가 당신에게 간청합니다. 이것은 내가 새 계명을 써 보내는 것이 아니라 우리가 처음부터 가지고 있던 것입니다. 곧 우리가 서로 사랑하자는 것입니다.", "사랑은 이것입니다. 우리가 그분의 계명들을 따라 걷는 것입니다. 여러분이 처음부터 들은 것처럼 그 계명은 이것이니, 곧 여러분이 사랑 안에서 걸어야 한다는 것입니다.", "많은 미혹하는 자들이 세상에 나왔습니다. 그들은 예수 그리스도께서 육체로 오심을 시인하지 않습니다. 이런 사람이 미혹하는 자이며 적그리스도입니다.", "여러분 자신을 살펴 우리가 이루어 온 것을 잃지 말고 온전한 보상을 받으십시오.", "그리스도의 가르침 안에 거하지 않고 앞서 나가는 사람마다 하나님을 가지고 있지 않습니다. 그 가르침 안에 거하는 사람은 아버지와 아들을 모두 가지고 있습니다.", "누가 여러분에게 와서 이 가르침을 가져오지 않는다면 그를 집에 받아들이지도 말고 그에게 인사하지도 마십시오.", "그에게 인사하는 사람은 그의 악한 일들에 참여하는 것입니다.", "내가 여러분에게 쓸 것이 많지만 종이와 먹으로 하기를 원하지 않았습니다. 오히려 여러분에게 가서 얼굴과 얼굴을 마주하여 말하기를 바랍니다. 우리의 기쁨이 충만하게 되도록 하려는 것입니다.", "당신의 택함 받은 자매의 자녀들이 당신에게 문안합니다."]}, "3Jn": {"1": ["장로는 사랑하는 가이오에게 편지합니다. 나는 그를 진리 안에서 사랑합니다.", "사랑하는 이여, 당신의 혼이 잘되는 것처럼 모든 일에서 잘되고 건강하기를 기도합니다.", "형제들이 와서 당신의 진리, 곧 당신이 진리 안에서 걷고 있음을 증언했을 때 나는 매우 기뻤습니다.", "내 자녀들이 진리 안에서 걷고 있다는 말을 듣는 것보다 더 큰 기쁨이 내게는 없습니다.", "사랑하는 이여, 당신이 형제들에게, 그것도 낯선 이들에게 행하는 일은 무엇이든 신실하게 행하는 것입니다.", "그들은 교회 앞에서 당신의 사랑을 증언했습니다. 당신이 하나님께 합당한 방식으로 그들을 길에 보내 준다면 잘하는 것입니다.", "그들이 그 이름을 위하여 나갔으며 이방인들에게서 아무것도 받지 않았기 때문입니다.", "그러므로 우리는 이런 사람들을 맞아들여 진리를 위한 동역자들이 되어야 합니다.", "내가 교회에 무언가를 썼으나 그들 가운데 으뜸 되기를 좋아하는 디오드레베가 우리를 받아들이지 않습니다.", "그러므로 내가 가면 그가 하는 일들을 기억나게 할 것입니다. 그는 악한 말로 우리를 헐뜯습니다. 그것으로 만족하지 않고 형제들을 받아들이지도 않으며, 받아들이려는 사람들을 막고 교회에서 내쫓습니다.", "사랑하는 이여, 악한 것을 본받지 말고 선한 것을 본받으십시오. 선을 행하는 사람은 하나님에게서 났고, 악을 행하는 사람은 하나님을 보지 못했습니다.", "데메드리오는 모든 사람에게서, 그리고 진리 자체에게서 좋은 증언을 받았습니다. 우리도 증언하며 당신은 우리의 증언이 참되다는 것을 압니다.", "내가 당신에게 쓸 것이 많지만 먹과 펜으로 쓰기를 원하지 않습니다.", "그러나 곧 당신을 보게 되기를 바라며, 그때 우리는 얼굴과 얼굴을 마주하여 말할 것입니다.", "평안이 당신에게 있기를 바랍니다. 친구들이 당신에게 문안합니다. 친구들에게 한 사람씩 이름을 불러 문안해 주십시오."]}};

 let s=cleanGreekToken(w).normalize("NFD").toLowerCase();

 const map={"α":"a","β":"b","γ":"g","δ":"d","ε":"e","ζ":"z","η":"ē","θ":"th","ι":"i","κ":"k","λ":"l","μ":"m","ν":"n","ξ":"x","ο":"o","π":"p","ρ":"r","σ":"s","ς":"s","τ":"t","υ":"y","φ":"ph","χ":"ch","ψ":"ps","ω":"ō"};

 const available=wk.filter(k=>positions[k]?.length);
 if(!available.length)return [];

 const anchorKey=available.slice().sort((a,b)=>positions[a].length-positions[b].length)[0];
 let bestSet=null, bestScore=Infinity;

 for(const anchor of positions[anchorKey]){
   const chosen=[anchor];
   let score=0;
   for(const k of available){
     if(k===anchorKey)continue;
     const cand=positions[k];
     let nearest=cand[0],dist=Math.abs(cand[0]-anchor);
     for(const p of cand){
       const d=Math.abs(p-anchor);
       if(d<dist){dist=d;nearest=p}
     }
     chosen.push(nearest); score+=dist;
   }
   const uniq=[...new Set(chosen)].sort((a,b)=>a-b);
   const width=uniq.length?uniq[uniq.length-1]-uniq[0]:999;
   score+=width*2;
   if(score<bestScore){bestScore=score;bestSet=uniq}
 }
 return (bestSet||[]).map(i=>gs[i]);
}

function connectTranslationWords(){
 if(reader.dataset.wordLinkBound==="1")return;
 reader.dataset.wordLinkBound="1";
 reader.addEventListener("click",ev=>{
   const el=ev.target.closest(".transword.verified");
   if(!el||!reader.contains(el))return;
   ev.preventDefault();ev.stopPropagation();

   const article=el.closest(".verse");if(!article)return;
   clearGreekMatches(article);

   const wanted=(el.dataset.lems||"").split(",").filter(Boolean);
   const hits=pickLocalGreekPhrase(article,wanted);

   hits.forEach(g=>{
     g.classList.add("gmatch");
     g.closest(".gpair")?.classList.add("gmatch");
   });

   if(hits.length){
     hits[0].closest(".gpair")?.scrollIntoView({behavior:"smooth",block:"center"});
   }
 });
}
