, and filled the whole earth.","bsb":"But the stone that had struck the statue became a great mountain and filled the whole earth."},"딤전 1:4":{"darby":"nor to turn their minds to fables and interminable genealogies, which bring questionings rather than [further] God's dispensation, which [is] in faith.","bsb":"or devote themselves to myths and endless genealogies, which promote speculation rather than the stewardship of God’s work, which is by faith."},"딤전 2:5":{"darby":"For God is one, and [the] mediator of God and men one, [the] man Christ Jesus,","bsb":"For there is one God, and there is one mediator between God and men, the man Christ Jesus,"},"딤전 3:16":{"darby":"And confessedly the mystery of piety is great. God has been manifested in flesh, has been justified in [the] Spirit, has appeared to angels, has been preached among [the] nations, has been believed on in [the] world, has been received up in glory.","bsb":"By common confession, the mystery of godliness is great: He appeared in the flesh, was vindicated by the Spirit, was seen by angels, was proclaimed among the nations, was believed in throughout the world, was taken up in glory."},"딤전 6:16":{"darby":"who only has immortality, dwelling in unapproachable light; whom no man has seen, nor is able to see; to whom [be] honour and eternal might. Amen.","bsb":"He alone is immortal and dwells in unapproachable light. No one has ever seen Him, nor can anyone see Him. To Him be honor and eternal dominion! Amen."},"딤전 6:17":{"darby":"Enjoin on those rich in the present age not to be high-minded, nor to trust on the uncertainty of riches; but in the God who affords us all things richly for [our] enjoyment;","bsb":"Instruct those who are rich in the present age not to be conceited and not to put their hope in the uncertainty of wealth, but in God, who richly provides all things for us to enjoy."},"딤후 1:10":{"darby":"but has been made manifest now by the appearing of our Saviour Jesus Christ, who has annulled death, and brought to light life and incorruptibility by the glad tidings;","bsb":"And now He has revealed this grace through the appearing of our Savior, Christ Jesus, who has abolished death and illuminated the way to life and immortality through the gospel,"},"딤후 4:8":{"darby":"Henceforth the crown of righteousness is laid up for me, which the Lord, the righteous Judge, will render to me in that day; but not only to me, but also to all who love his appearing.","bsb":"From now on there is laid up for me the crown of righteousness, which the Lord, the righteous Judge, will award to me on that day—and not only to me, but to all who crave His appearing."},"롬 1:20":{"darby":"for from [the] world's creation the invisible things of him are perceived, being apprehended by the mind through the things that are made, both his eternal power and divinity, so as to render them inexcusable.","bsb":"For since the creation of the world God’s invisible qualities, His eternal power and divine nature, have been clearly seen, being understood from His workmanship, so that men are without excuse."},"롬 1:3–4":{"darby":"concerning his Son (come of David's seed according to flesh, marked out Son of God in power, according to [the] Spirit of holiness, by resurrection of [the] dead) Jesus Christ our Lord;","bsb":"regarding His Son, who was a descendant of David according to the flesh, and who through the Spirit of holiness was declared with power to be the Son of God by His resurrection from the dead: Jesus Christ our Lord."},"롬 4:17":{"darby":"(according as it is written, I have made thee father of many nations,) before the God whom he believed, who quickens the dead, and calls the things which be not as being;","bsb":"As it is written: “I have made you a father of many nations.” He is our father in the presence of God, in whom he believed, the God who gives life to the dead and calls into being what does not yet exist."},"롬 6:6":{"darby":"knowing this, that our old man has been crucified with [him], that the body of sin might be annulled, that we should no longer serve sin.","bsb":"We know that our old self was crucified with Him so that the body of sin might be rendered powerless, that we should no longer be slaves to sin."},"롬 8:10":{"darby":"but if Christ be in you, the body is dead on account of sin, but the Spirit life on account of righteousness.","bsb":"But if Christ is in you, your body is dead because of sin, yet your spirit is alive because of righteousness."},"롬 8:11":{"darby":"But if the Spirit of him that has raised up Jesus from among [the] dead dwell in you, he that has raised up Christ from among [the] dead shall quicken your mortal bodies also on account of his Spirit which dwells in you.","bsb":"And if the Spirit of Him who raised Jesus from the dead is living in you, He who raised Christ Jesus from the dead will also give life to your mortal bodies through His Spirit, who lives in you."},"롬 8:3":{"darby":"For what the law could not do, in that it was weak through the flesh, God, having sent his own Son, in likeness of flesh of sin, and for sin, has condemned sin in the flesh,","bsb":"For what the law was powerless to do in that it was weakened by the flesh, God did by sending His own Son in the likeness of sinful man, as an offering for sin. He thus condemned sin in the flesh,"},"롬 8:6":{"darby":"For the mind of the flesh [is] death; but the mind of the Spirit life and peace.","bsb":"The mind of the flesh is death, but the mind of the Spirit is life and peace,"},"롬 9:5":{"darby":"whose [are] the fathers; and of whom, as according to flesh, [is] the Christ, who is over all, God blessed for ever. Amen.","bsb":"Theirs are the patriarchs, and from them proceeds the human descent of Christ, who is God over all, forever worthy of praise! Amen."},"마 17:5":{"darby":"While he was still speaking, behold, a bright cloud overshadowed them, and lo, a voice out of the cloud, saying, *This* is my beloved Son, in whom I have found my delight: hear him.","bsb":"While Peter was still speaking, a bright cloud enveloped them, and a voice from the cloud said, “This is My beloved Son, in whom I am well pleased. Listen to Him!”"},"마 1:21":{"darby":"And she shall bring forth a son, and thou shalt call his name Jesus, for *he* shall save his people from their sins.","bsb":"She will give birth to a Son, and you are to give Him the name Jesus, because He will save His people from their sins.”"},"마 1:23":{"darby":"Behold, the virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which is, being interpreted, 'God with us.'","bsb":"“Behold, the virgin will be with child and will give birth to a son, and they will call Him Immanuel” (which means, “God with us”)."},"마 28:19":{"darby":"Go [therefore] and make disciples of all the nations, baptising them to the name of the Father, and of the Son, and of the Holy Spirit;","bsb":"Therefore go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,"},"마 3:16–17":{"darby":"And Jesus, having been baptised, went up straightway from the water, and lo, the heavens were opened to him, and he saw the Spirit of God descending as a dove, and coming upon him: and behold, a voice out of the heavens saying, This is my beloved Son, in whom I have found my delight.","bsb":"As soon as Jesus was baptized, He went up out of the water. Suddenly the heavens were opened, and He saw the Spirit of God descending like a dove and resting on Him. And a voice from heaven said, “This is My beloved Son, in whom I am well pleased!”"},"미 5:2":{"darby":"(And thou, Bethlehem Ephratah, little to be among the thousands of Judah, out of thee shall he come forth unto me [who is] to be Ruler in Israel: whose goings forth are from of old, from the days of eternity.)","bsb":"But you, Bethlehem Ephrathah, who are small among the clans of Judah, out of you will come forth for Me One to be ruler over Israel—One whose origins are of old, from the days of eternity."},"민 6:24–26":{"darby":"Jehovah bless thee, and keep thee; Jehovah make his face shine upon thee, and be gracious unto thee; Jehovah lift up his countenance upon thee, and give thee peace.","bsb":"‘May the LORD bless you and keep you; may the LORD cause His face to shine upon you and be gracious to you; may the LORD lift up His countenance toward you and give you peace.’"},"벧전 1:16":{"darby":"because it is written, Be ye holy, for *I* am holy.","bsb":"for it is written: “Be holy, because I am holy.”"},"벧전 1:3":{"darby":"Blessed [be] the God and Father of our Lord Jesus Christ, who, according to his great mercy, has begotten us again to a living hope through [the] resurrection of Jesus Christ from among [the] dead,","bsb":"Blessed be the God and Father of our Lord Jesus Christ! By His great mercy He has given us new birth into a living hope through the resurrection of Jesus Christ from the dead,"},"벧전 2:24":{"darby":"who himself bore our sins in his body on the tree, in order that, being dead to sins, we may live to righteousness: by whose stripes ye have been healed.","bsb":"He Himself bore our sins in His body on the tree, so that we might die to sin and live to righteousness. “By His stripes you are healed.”"},"벧전 2:4":{"darby":"To whom coming, a living stone, cast away indeed as worthless by men, but with God chosen, precious,","bsb":"As you come to Him, the living stone, rejected by men but chosen and precious in God’s sight,"},"빌 2:6–8":{"darby":"who, subsisting in the form of God, did not esteem it an object of rapine to be on an equality with God; but emptied himself, taking a bondman's form, taking his place in [the] likeness of men; and having been found in figure as a man, humbled himself, becoming obedient even unto death, and [that the] death of [the] cross.","bsb":"Who, existing in the form of God, did not consider equality with God something to be grasped, but emptied Himself, taking the form of a servant, being made in human likeness. And being found in appearance as a man, He humbled Himself and became obedient to death—even death on a cross."},"사 28:16":{"darby":"Therefore thus saith the Lord Jehovah: Behold, I lay for foundation in Zion a stone, a tried stone, a precious corner-stone, a sure foundation: he that trusteth shall not make haste.","bsb":"So this is what the Lord GOD says: “See, I lay a stone in Zion, a tested stone, a precious cornerstone, a sure foundation; the one who believes will never be shaken."},"사 45:5":{"darby":"I [am] Jehovah, and there is none else; there is no God beside me: I girded thee, and thou hast not known me;","bsb":"I am the LORD, and there is no other; there is no God but Me. I will equip you for battle, though you have not known Me,"},"사 53:5–6":{"darby":"But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him, and with his stripes we are healed. All we like sheep have gone astray, we have turned every one to his own way; and Jehovah hath laid upon him the iniquity of us all.","bsb":"But He was pierced for our transgressions, He was crushed for our iniquities; the punishment that brought us peace was upon Him, and by His stripes we are healed. We all like sheep have gone astray, each one has turned to his own way; and the LORD has laid upon Him the iniquity of us all."},"사 6:8":{"darby":"And I heard the voice of the Lord saying, Whom shall I send, and who will go for us? And I said, Here am I; send me.","bsb":"Then I heard the voice of the Lord saying: “Whom shall I send? Who will go for Us?” And I said: “Here am I. Send me!”"},"사 8:14":{"darby":"And he will be for a sanctuary; and for a stone of stumbling, and for a rock of offence to both the houses of Israel, for a gin and for a snare to the inhabitants of Jerusalem.","bsb":"And He will be a sanctuary—but to both houses of Israel a stone of stumbling and a rock of offense, to the dwellers of Jerusalem a trap and a snare."},"사 9:6":{"darby":"For unto us a child is born, unto us a son is given; and the government shall be upon his shoulder; and his name is called Wonderful, Counsellor, Mighty God, Father of Eternity, Prince of Peace.","bsb":"For unto us a child is born, unto us a son is given, and the government will be upon His shoulders. And He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace."},"살전 1:9":{"darby":"for they themselves relate concerning us what entering in we had to you, and how ye turned to God from idols to serve a living and true God,","bsb":"For they themselves report what kind of welcome you gave us, and how you turned to God from idols to serve the living and true God"},"시 33:9":{"darby":"For *he* spoke, and it was [done]; *he* commanded, and it stood fast.","bsb":"For He spoke, and it came to be; He commanded, and it stood firm."},"시 89:14":{"darby":"Righteousness and judgment are the foundation of thy throne; loving-kindness and truth go before thy face.","bsb":"Righteousness and justice are the foundation of Your throne; loving devotion and faithfulness go before You."},"시 90:2":{"darby":"Before the mountains were brought forth, and thou hadst formed the earth and the world, even from eternity to eternity thou art God.","bsb":"Before the mountains were born or You brought forth the earth and the world, from everlasting to everlasting You are God."},"신 6:4":{"darby":"Hear, Israel: Jehovah our God is one Jehovah;","bsb":"Hear, O Israel: The LORD our God, the LORD is One."},"엡 1:1":{"darby":"Paul, apostle of Jesus Christ by God's will, to the saints and faithful in Christ Jesus who are at Ephesus.","bsb":"Paul, an apostle of Christ Jesus by the will of God, To the saints in Ephesus, the faithful in Christ Jesus:"},"엡 1:10":{"darby":"for [the] administration of the fulness of times; to head up all things in the Christ, the things in the heavens and the things upon the earth; in him,","bsb":"as a plan for the fullness of time, to bring all things in heaven and on earth together in Christ."},"엡 1:20–22":{"darby":"[in] which he wrought in the Christ [in] raising him from among [the] dead, and he set him down at his right hand in the heavenlies, above every principality, and authority, and power, and dominion, and every name named, not only in this age, but also in that to come; and has put all things under his feet, and gave him [to be] head over all things to the assembly,","bsb":"which He exerted in Christ when He raised Him from the dead and seated Him at His right hand in the heavenly realms, far above all rule and authority, power and dominion, and every name that is named, not only in the present age but also in the one to come. And God put everything under His feet and made Him head over everything for the church,"},"엡 1:9":{"darby":"having made known to us the mystery of his will, according to his good pleasure which he purposed in himself","bsb":"And He has made known to us the mystery of His will according to His good pleasure, which He purposed in Christ"},"엡 2:15":{"darby":"having annulled the enmity in his flesh, the law of commandments in ordinances, that he might form the two in himself into one new man, making peace;","bsb":"by abolishing in His flesh the law of commandments and decrees. He did this to create in Himself one new man out of the two, thus making peace"},"엡 2:18":{"darby":"For through him we have both access by one Spirit to the Father.","bsb":"For through Him we both have access to the Father by one Spirit."},"엡 3:11":{"darby":"according to [the] purpose of the ages, which he purposed in Christ Jesus our Lord,","bsb":"according to the eternal purpose that He accomplished in Christ Jesus our Lord."},"엡 3:17–19":{"darby":"that the Christ may dwell, through faith, in your hearts, being rooted and founded in love, in order that ye may be fully able to apprehend with all the saints what [is] the breadth and length and depth and height; and to know the love of the Christ which surpasses knowledge; that ye may be filled [even] to all the fulness of God.","bsb":"so that Christ may dwell in your hearts through faith. Then you, being rooted and grounded in love, will have power, together with all the saints, to comprehend the length and width and height and depth of the love of Christ, and to know this love that surpasses knowledge, that you may be filled with all the fullness of God."},"엡 3:2":{"darby":"(if indeed ye have heard of the administration of the grace of God which has been given to me towards you,","bsb":"Surely you have heard about the stewardship of God’s grace that was given to me for you,"},"엡 3:7–8":{"darby":"of which I am become minister according to the gift of the grace of God given to me, according to the working of his power. To me, less than the least of all saints, has this grace been given, to announce among the nations the glad tidings of the unsearchable riches of the Christ,","bsb":"I became a servant of this gospel by the gift of God’s grace, given me through the working of His power. Though I am less than the least of all the saints, this grace was given me: to preach to the Gentiles the unsearchable riches of Christ,"},"엡 3:9":{"darby":"and to enlighten all [with the knowledge of] what is the administration of the mystery hidden throughout the ages in God, who has created all things,","bsb":"and to illuminate for everyone the stewardship of this mystery, which for ages past was kept hidden in God, who created all things."},"엡 4:18":{"darby":"being darkened in understanding, estranged from the life of God by reason of the ignorance which is in them, by reason of the hardness of their hearts,","bsb":"They are darkened in their understanding and alienated from the life of God because of the ignorance that is in them due to the hardness of their hearts."},"엡 4:8":{"darby":"Wherefore he says, Having ascended up on high, he has led captivity captive, and has given gifts to men.","bsb":"This is why it says: “When He ascended on high, He led captives away, and gave gifts to men.”"},"요 10:30":{"darby":"I and the Father are one.","bsb":"I and the Father are one.”"},"요 12:24":{"darby":"Verily, verily, I say unto you, Except the grain of wheat falling into the ground die, it abides alone; but if it die, it bears much fruit.","bsb":"Truly, truly, I tell you, unless a kernel of wheat falls to the ground and dies, it remains only a seed. But if it dies, it bears much fruit."},"요 14:10":{"darby":"Believest thou not that I [am] in the Father, and that the Father is in me? The words which I speak to you I do not speak from myself; but the Father who abides in me, he does the works.","bsb":"Do you not believe that I am in the Father and the Father is in Me? The words I say to you, I do not speak on My own. Instead, it is the Father dwelling in Me, performing His works."},"요 14:11":{"darby":"Believe *me* that I [am] in the Father and the Father in me; but if not, believe me for the works' sake themselves.","bsb":"Believe Me that I am in the Father and the Father is in Me—or at least believe on account of the works themselves."},"요 14:26":{"darby":"but the Comforter, the Holy Spirit, whom the Father will send in my name, *he* shall teach you all things, and will bring to your remembrance all the things which I have said to you.","bsb":"But the Advocate, the Holy Spirit, whom the Father will send in My name, will teach you all things and will remind you of everything I have told you."},"요 15:26":{"darby":"But when the Comforter is come, whom I will send to you from the Father, the Spirit of truth who goes forth from with the Father, *he* shall bear witness concerning me;","bsb":"When the Advocate comes, whom I will send to you from the Father—the Spirit of truth who proceeds from the Father—He will testify about Me."},"요 16:15":{"darby":"All things that the Father has are mine; on account of this I have said that he receives of mine and shall announce [it] to you.","bsb":"Everything that belongs to the Father is Mine. That is why I said that the Spirit will take from what is Mine and disclose it to you."},"요 17:22":{"darby":"And the glory which thou hast given me I have given them, that they may be one, as we are one;","bsb":"I have given them the glory You gave Me, so that they may be one as We are one—"},"요 17:3":{"darby":"And this is the eternal life, that they should know thee, the only true God, and Jesus Christ whom thou hast sent.","bsb":"Now this is eternal life, that they may know You, the only true God, and Jesus Christ, whom You have sent."},"요 19:34":{"darby":"but one of the soldiers pierced his side with a spear, and immediately there came out blood and water.","bsb":"Instead, one of the soldiers pierced His side with a spear, and immediately blood and water flowed out."},"요 1:1":{"darby":"In [the] beginning was the Word, and the Word was with God, and the Word was God.","bsb":"In the beginning was the Word, and the Word was with God, and the Word was God."},"요 1:14":{"darby":"And the Word became flesh, and dwelt among us (and we have contemplated his glory, a glory as of an only-begotten with a father), full of grace and truth;","bsb":"The Word became flesh and made His dwelling among us. We have seen His glory, the glory of the one and only Son from the Father, full of grace and truth."},"요 1:16":{"darby":"for of his fulness we all have received, and grace upon grace.","bsb":"From His fullness we have all received grace upon grace."},"요 1:18":{"darby":"No one has seen God at any time; the only-begotten Son, who is in the bosom of the Father, *he* hath declared [him].","bsb":"No one has ever seen God, but the one and only Son, who is Himself God and is at the Father’s side, has made Him known."},"요 1:29":{"darby":"On the morrow he sees Jesus coming to him, and says, Behold the Lamb of God, who takes away the sin of the world.","bsb":"The next day John saw Jesus coming toward him and said, “Look, the Lamb of God, who takes away the sin of the world!"},"요 20:31":{"darby":"but these are written that ye may believe that Jesus is the Christ, the Son of God, and that believing ye might have life in his name.","bsb":"But these are written so that you may believe that Jesus is the Christ, the Son of God, and that by believing you may have life in His name."},"요 3:14":{"darby":"And as Moses lifted up the serpent in the wilderness, thus must the Son of man be lifted up,","bsb":"Just as Moses lifted up the snake in the wilderness, so the Son of Man must be lifted up,"},"요 4:14":{"darby":"but whosoever drinks of the water which I shall give him shall never thirst for ever, but the water which I shall give him shall become in him a fountain of water, springing up into eternal life.","bsb":"But whoever drinks the water I give him will never thirst. Indeed, the water I give him will become in him a fount of water springing up to eternal life.”"},"요 4:24":{"darby":"God [is] a spirit; and they who worship him must worship [him] in spirit and truth.","bsb":"God is Spirit, and His worshipers must worship Him in spirit and in truth.”"},"요 8:29":{"darby":"And he that has sent me is with me; he has not left me alone, because I do always the things that are pleasing to him.","bsb":"He who sent Me is with Me. He has not left Me alone, because I always do what pleases Him.”"},"요일 1:5":{"darby":"And this is the message which we have heard from him, and declare to you, that God is light, and in him is no darkness at all.","bsb":"And this is the message we have heard from Him and announce to you: God is light, and in Him there is no darkness at all."},"요일 3:2":{"darby":"Beloved, now are we children of God, and what we shall be has not yet been manifested; we know that if it is manifested we shall be like him, for we shall see him as he is.","bsb":"Beloved, we are now children of God, and what we will be has not yet been revealed. We know that when Christ appears, we will be like Him, for we will see Him as He is."},"요일 4:13":{"darby":"Hereby we know that we abide in him and he in us, that he has given to us of his Spirit.","bsb":"By this we know that we remain in Him, and He in us: He has given us of His Spirit."},"요일 4:16":{"darby":"And *we* have known and have believed the love which God has to us. God is love, and he that abides in love abides in God, and God in him.","bsb":"And we have come to know and believe the love that God has for us. God is love; whoever abides in love abides in God, and God in him."},"창 1:1":{"darby":"In the beginning God created the heavens and the earth.","bsb":"In the beginning God created the heavens and the earth."},"창 1:26":{"darby":"And God said, Let us make man in our image, after our likeness; and let them have dominion over the fish of the sea, and over the fowl of the heavens, and over the cattle, and over the whole earth, and over every creeping thing that creepeth on the earth.","bsb":"Then God said, “Let Us make man in Our image, after Our likeness, to rule over the fish of the sea and the birds of the air, over the livestock, and over all the earth itself and every creature that crawls upon it.”"},"창 2:9":{"darby":"And out of the ground Jehovah Elohim made every tree grow that is pleasant to the sight, and good for food; and the tree of life, in the midst of the garden, and the tree of the knowledge of good and evil.","bsb":"Out of the ground the LORD God gave growth to every tree that is pleasing to the eye and good for food. And in the middle of the garden were the tree of life and the tree of the knowledge of good and evil."},"창 3:15":{"darby":"And I will put enmity between thee and the woman, and between thy seed and her seed; he shall crush thy head, and thou shalt crush his heel.","bsb":"And I will put enmity between you and the woman, and between your seed and her seed. He will crush your head, and you will strike his heel.”"},"출 3:14":{"darby":"And God said to Moses, I AM THAT I AM. And he said, Thus shalt thou say unto the children of Israel: I AM hath sent me unto you.","bsb":"God said to Moses, “I AM WHO I AM. This is what you are to say to the Israelites: ‘I AM has sent me to you.’”"},"출 3:16":{"darby":"Go and gather the elders of Israel together, and say unto them, Jehovah the God of your fathers, the God of Abraham, Isaac, and Jacob, hath appeared to me, saying, I have indeed visited you, and [seen] that which is done unto you in Egypt;","bsb":"Go, assemble the elders of Israel and say to them, ‘The LORD, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me and said: I have surely attended to you and have seen what has been done to you in Egypt."},"행 13:33":{"darby":"that God has fulfilled this to us their children, having raised up Jesus; as it is also written in the second psalm, *Thou* art my Son: this day have *I* begotten thee.","bsb":"He has fulfilled for us, their children, by raising up Jesus. As it is written in the second Psalm: ‘You are My Son; today I have become Your Father.’"},"행 2:23":{"darby":"him, given up by the determinate counsel and foreknowledge of God, ye, by [the] hand of lawless [men], have crucified and slain.","bsb":"He was delivered up by God’s set plan and foreknowledge, and you, by the hands of the lawless, put Him to death by nailing Him to the cross."},"행 2:36":{"darby":"Let the whole house of Israel therefore know assuredly that God has made him, this Jesus whom *ye* have crucified, both Lord and Christ.","bsb":"Therefore let all Israel know with certainty that God has made this Jesus, whom you crucified, both Lord and Christ!”"},"행 3:15":{"darby":"but the originator of life ye slew, whom God raised from among [the] dead, whereof *we* are witnesses.","bsb":"You killed the Author of life, but God raised Him from the dead, and we are witnesses of this fact."},"행 5:3–4":{"darby":"But Peter said, Ananias, why has Satan filled thy heart that thou shouldest lie to the Holy Spirit, and put aside for thyself a part of the price of the estate? While it remained did it not remain to *thee*? and sold, was [it not] in thine own power? Why is it that thou hast purposed this thing in thine heart? Thou hast not lied to men, but to God.","bsb":"Then Peter said, “Ananias, how is it that Satan has filled your heart to lie to the Holy Spirit and withhold some of the proceeds from the land? Did it not belong to you before it was sold? And after it was sold, was it not at your disposal? How could you conceive such a deed in your heart? You have not lied to men, but to God!”"},"히 12:24":{"darby":"and to Jesus, mediator of a new covenant; and to [the] blood of sprinkling, speaking better than Abel.","bsb":"to Jesus the mediator of a new covenant, and to the sprinkled blood that speaks a better word than the blood of Abel."},"히 1:3":{"darby":"who being [the] effulgence of his glory and [the] expression of his substance, and upholding all things by the word of his power, having made [by himself] the purification of sins, set himself down on the right hand of the greatness on high,","bsb":"The Son is the radiance of God’s glory and the exact representation of His nature, upholding all things by His powerful word. After He had provided purification for sins, He sat down at the right hand of the Majesty on high."},"히 1:8":{"darby":"but as to the Son, Thy throne, O God, [is] to the age of the age, and a sceptre of uprightness [is] the sceptre of thy kingdom.","bsb":"But about the Son He says: “Your throne, O God, endures forever and ever, and justice is the scepter of Your kingdom."},"히 2:14":{"darby":"Since therefore the children partake of blood and flesh, he also, in like manner, took part in the same, that through death he might annul him who has the might of death, that is, the devil;","bsb":"Now since the children have flesh and blood, He too shared in their humanity, so that by His death He might destroy him who holds the power of death, that is, the devil,"},"히 2:17":{"darby":"Wherefore it behoved him in all things to be made like to [his] brethren, that he might be a merciful and faithful high priest in things relating to God, to make propitiation for the sins of the people;","bsb":"For this reason He had to be made like His brothers in every way, so that He might become a merciful and faithful high priest in service to God, in order to make atonement for the sins of the people."},"히 4:15":{"darby":"For we have not a high priest not able to sympathise with our infirmities, but tempted in all things in like manner, sin apart.","bsb":"For we do not have a high priest who is unable to sympathize with our weaknesses, but we have one who was tempted in every way that we are, yet was without sin."},"히 6:20":{"darby":"where Jesus is entered as forerunner for us, become for ever a high priest according to the order of Melchisedec.","bsb":"where Jesus our forerunner has entered on our behalf. He has become a high priest forever in the order of Melchizedek."},"히 7:22":{"darby":"by so much Jesus became surety of a better covenant.","bsb":"Because of this oath, Jesus has become the guarantee of a better covenant."},"히 7:25":{"darby":"Whence also he is able to save completely those who approach by him to God, always living to intercede for them.","bsb":"Therefore He is able to save completely those who draw near to God through Him, since He always lives to intercede for them."},"히 7:3":{"darby":"without father, without mother, without genealogy; having neither beginning of days nor end of life, but assimilated to the Son of God, abides a priest continually.","bsb":"Without father or mother or genealogy, without beginning of days or end of life, like the Son of God, he remains a priest for all time."},"히 9:14":{"darby":"how much rather shall the blood of the Christ, who by the eternal Spirit offered himself spotless to God, purify your conscience from dead works to worship [the] living God?","bsb":"how much more will the blood of Christ, who through the eternal Spirit offered Himself unblemished to God, purify our consciences from works of death, so that we may serve the living God!"}};
const GOD_PASSAGES = [
['고전 8:4','오직 한 하나님만 계십니다. 우상은 참 신이 아닙니다.','There is no God but one. An idol has no real divine existence.','οὐδεὶς θεὸς εἰ μὴ εἷς','θεός (테오스) — 하나님','바울은 우상의 실재성을 부정하면서 유일하신 하나님을 고백합니다.','Paul denies the divinity of idols and confesses the one God.'],
['신 6:4','이스라엘아 들으십시오. 여호와는 우리 하나님이시며 여호와는 한 분이십니다.','Hear, O Israel: the LORD is our God; the LORD is one.','יְהוָה אֶחָד','יְהוָה (아도나이/여호와) — 주님 · אֶחָד (에하드) — 하나','쉐마는 이스라엘 신앙의 중심 고백이며, 유일하신 여호와께 전인적 사랑과 충성을 요구합니다.','The Shema is Israel’s central confession and calls for whole-person love and loyalty to the one LORD.'],
['사 45:5','나는 여호와이며 다른 이는 없습니다. 나 외에는 하나님이 없습니다.','I am the LORD, and there is no other; besides Me there is no God.','אֲנִי יְהוָה וְאֵין עוֹד','אֵין עוֹד (엔 오드) — 그 밖에는 없다','바벨론의 신들과 대조하여 여호와의 절대적 유일성과 주권을 선언합니다.','Against Babylon’s gods, the text declares the LORD’s unique sovereignty.'],
['출 3:14','하나님께서 모세에게 “나는 스스로 있는 이다”라고 말씀하셨습니다.','God said to Moses, “I AM WHO I AM.”','אֶהְיֶה אֲשֶׁר אֶהְיֶה','אֶהְיֶה (에흐예) — 나는 있다/있을 것이다','이 이름은 하나님의 자존성과 변함없는 임재를 함께 드러냅니다.','The name points to God’s self-existence and faithful presence.'],
['출 3:16','여호와, 곧 아브라함과 이삭과 야곱의 하나님께서 나타나셨다고 장로들에게 전하라고 하셨습니다.','Moses must tell the elders that the LORD, the God of their fathers, has appeared.','יְהוָה אֱלֹהֵי אֲבֹתֵיכֶם','אֱלֹהֵי אֲבֹתֵיכֶם — 너희 조상들의 하나님','스스로 계신 하나님은 동시에 언약 안에서 자기 백성을 찾아오시는 하나님이십니다.','The self-existing God is also the covenant God who visits His people.'],
['계 1:8','주 하나님은 알파와 오메가이며, 지금도 계시고 전에도 계셨고 장차 오실 전능자이십니다.','The Lord God is the Alpha and Omega, the One who is, was, and is coming, the Almighty.','ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος','παντοκράτωρ (판토크라토르) — 전능자','하나님은 역사의 시작과 완성을 주관하시는 영원하고 전능하신 분입니다.','God is eternal and almighty, sovereign over history’s beginning and completion.'],
['요 17:3','영원한 생명은 유일하신 참 하나님과 그분이 보내신 예수 그리스도를 아는 것입니다.','Eternal life is knowing the only true God and Jesus Christ whom He sent.','μόνον ἀληθινὸν θεόν','γινώσκω (기노스코) — 관계적으로 알다','영생은 단순한 무한한 존속이 아니라 아버지와 아들을 아는 관계적 생명입니다.','Eternal life is relational knowledge of the Father and the Son, not mere endless existence.'],
['살전 1:9','그들은 우상에서 하나님께로 돌아와 살아 계시고 참되신 하나님을 섬겼습니다.','They turned from idols to serve the living and true God.','θεῷ ζῶντι καὶ ἀληθινῷ','ζῶντι (존티) — 살아 계신 · ἀληθινῷ (알레시노) — 참되신','회심은 거짓 신들을 버리고 살아 계신 하나님께 방향을 돌리는 사건입니다.','Conversion is a decisive turning from idols to the living God.'],
['딤전 6:16','하나님만 죽지 않으심을 가지시고 가까이 갈 수 없는 빛 가운데 거하십니다.','God alone possesses immortality and dwells in unapproachable light.','ὁ μόνος ἔχων ἀθανασίαν','ἀθανασία (아타나시아) — 죽지 않음','하나님의 생명은 피조물에게서 받은 것이 아닌 본래적이며 불멸합니다.','God’s life is underived and inherently immortal.'],
['딤전 6:17','재물에 소망을 두지 말고 우리에게 모든 것을 풍성히 주시는 하나님께 소망을 두십시오.','Do not set hope on riches, but on God who richly supplies all things.','θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως','παρέχω (파레코) — 공급하다','하나님의 풍성한 공급은 탐욕이 아니라 감사와 나눔을 낳아야 합니다.','God’s generous provision should produce gratitude and generosity, not greed.'],
['시 90:2','산들이 생기기 전부터 영원부터 영원까지 주님은 하나님이십니다.','Before the mountains were born, from eternity to eternity, You are God.','מֵעוֹלָם עַד־עוֹלָם אַתָּה אֵל','עוֹלָם (올람) — 영원','피조 세계보다 먼저 계신 하나님의 영원성을 인간 생명의 덧없음과 대조합니다.','God’s eternity before creation contrasts with human frailty.'],
['창 1:1','태초에 하나님께서 하늘들과 땅을 창조하셨습니다.','In the beginning God created the heavens and the earth.','בְּרֵאשִׁית בָּרָא אֱלֹהִים','בָּרָא (바라) — 창조하셨다','성경은 하나님을 논증하기보다 만물의 선재하는 창조주로 선포하며 시작합니다.','Scripture begins by proclaiming God as the preexistent Creator of all.'],
['계 4:11','주 하나님은 만물을 창조하셨으므로 영광과 존귀와 능력을 받기에 합당하십니다.','The Lord God is worthy because He created all things by His will.','σὺ ἔκτισας τὰ πάντα','κτίζω (크티조) — 창조하다','창조는 하나님께 예배드릴 근거이며 만물은 그분의 뜻 때문에 존재합니다.','Creation grounds worship: all things exist because of God’s will.'],
['시 33:9','그분께서 말씀하시니 이루어졌고 명령하시니 굳게 섰습니다.','He spoke, and it came to be; He commanded, and it stood firm.','הוּא אָמַר וַיֶּהִי','אָמַר (아마르) — 말씀하셨다','창조주의 말씀은 정보를 전달할 뿐 아니라 뜻하신 일을 이루는 능력 있는 말씀입니다.','The Creator’s word does not merely inform; it accomplishes His purpose.'],
['롬 4:17','하나님은 죽은 사람들을 살리시며 없는 것들을 있는 것처럼 부르십니다.','God gives life to the dead and calls into being things that do not exist.','ζῳοποιοῦντος τοὺς νεκρούς','ζῳοποιέω (조오포이에오) — 생명을 주다','문맥의 초점은 인간의 긍정적 선언이 아니라 약속을 성취하시는 하나님의 능력입니다.','The focus is God’s promise-fulfilling power, not human positive confession.'],
['롬 1:20','하나님의 보이지 않는 속성, 영원한 능력과 신성이 창조된 것들을 통해 분명히 보입니다.','God’s invisible attributes—His eternal power and divine nature—are perceived in creation.','ἀΐδιος αὐτοῦ δύναμις καὶ θειότης','θειότης (테이오테스) — 신성/신적 본질','창조는 하나님에 관한 참된 지식을 증언하지만 복음의 구원 내용을 모두 제시하지는 않습니다.','Creation truly witnesses to God, though it does not disclose the whole gospel.'],
['요 4:24','하나님은 영이시므로 그분께 경배하는 사람들은 영과 진실함으로 경배해야 합니다.','God is Spirit, and His worshipers must worship in spirit and truth.','πνεῦμα ὁ θεός','πνεῦμα (프뉴마) — 영','하나님의 본성에 맞는 예배는 장소에 제한되지 않고 성령과 진리에 의해 이루어집니다.','Worship fitting God’s nature is not confined to a place but is shaped by Spirit and truth.'],
['요일 4:16','하나님은 사랑이십니다. 사랑 안에 거하는 사람은 하나님 안에 거하고 하나님도 그 안에 거하십니다.','God is love; whoever abides in love abides in God, and God in him.','ὁ θεὸς ἀγάπη ἐστίν','ἀγάπη (아가페) — 사랑','“하나님은 사랑”은 사랑이 하나님보다 높은 기준이라는 뜻이 아니라 하나님의 성품이 그리스도 안에서 나타났다는 뜻입니다.','“God is love” means His character is revealed in Christ, not that love is a standard above God.'],
['요일 1:5','하나님은 빛이시며 그분 안에는 어둠이 전혀 없습니다.','God is light, and in Him there is no darkness at all.','ὁ θεὸς φῶς ἐστιν','φῶς (포스) — 빛','빛은 하나님의 거룩함과 진실을 나타내며 그분과의 교통은 정직한 삶을 요구합니다.','Light expresses God’s holiness and truth and calls for honest fellowship.'],
['엡 4:18','이방인들은 무지와 마음의 완고함 때문에 하나님의 생명에서 떠나 있습니다.','They are alienated from the life of God because of ignorance and hardness of heart.','ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ','ζωὴ τοῦ θεοῦ — 하나님의 생명','죄는 지적 문제만이 아니라 마음의 완고함과 하나님 생명으로부터의 소외를 포함합니다.','Sin involves not only ignorance but hardness and alienation from God’s life.'],
['요 17:22','아버지께서 아들에게 주신 영광을 아들은 믿는 이들에게 주어 그들이 하나 되게 하셨습니다.','The Son gives believers the glory received from the Father so that they may be one.','τὴν δόξαν ἣν δέδωκάς μοι','δόξα (독사) — 영광','이 영광은 제자들의 하나 됨을 섬기며, 독립적인 신격이나 숭배받을 권리를 주는 것이 아닙니다.','This glory serves believers’ unity; it does not grant independent deity.'],
['벧전 1:16','“내가 거룩하니 너희도 거룩하여라”라고 기록되어 있습니다.','It is written, “You shall be holy, for I am holy.”','ἅγιοι ἔσεσθε ὅτι ἐγὼ ἅγιος','ἅγιος (하기오스) — 거룩한','그리스도인의 거룩은 하나님의 거룩한 성품에 응답하는 구별된 삶입니다.','Christian holiness is a consecrated life responding to God’s holiness.'],
['딤후 4:8','의로우신 재판장이 그날에 의의 면류관을 주실 것입니다.','The righteous Judge will award the crown of righteousness on that day.','ὁ δίκαιος κριτής','δίκαιος (디카이오스) — 의로운','하나님의 의로운 심판은 바울의 소망이며, 그 보상은 주님의 나타나심을 사랑하는 모든 이에게 열려 있습니다.','God’s righteous judgment is Paul’s hope, and the reward extends to all who love Christ’s appearing.'],
['시 89:14','의와 정의가 주님의 보좌의 기초이며 인자와 진실이 주님 앞에 나아갑니다.','Righteousness and justice are the foundation of Your throne; steadfast love and faithfulness go before You.','צֶדֶק וּמִשְׁפָּט מְכוֹן כִּסְאֶךָ','צֶדֶק (체데크) — 의 · מִשְׁפָּט (미쉬파트) — 정의','하나님의 통치는 의와 정의뿐 아니라 언약적 사랑과 신실함으로 특징지어집니다.','God’s reign is marked by justice and righteousness together with covenant love and faithfulness.'],
['고전 1:9','여러분을 그분의 아들 예수 그리스도와의 교통 안으로 부르신 하나님은 신실하십니다.','God is faithful, by whom you were called into fellowship with His Son.','πιστὸς ὁ θεός','πιστός (피스토스) — 신실한','교회의 보존은 인간의 완전함보다 신실하신 하나님의 부르심에 근거합니다.','The church’s security rests in God’s faithful calling rather than human perfection.'],
['사 6:8','주님께서 “내가 누구를 보내며 누가 우리를 위하여 갈까?”라고 말씀하셨습니다.','The Lord asks, “Whom shall I send, and who will go for us?”','מִי־יֵלֶךְ־לָנוּ','לָנוּ (라누) — 우리를 위하여','“나”와 “우리”의 병치는 하나님의 회의를 암시하지만, 이 한 절만으로 삼위일체 교리를 완성해서는 안 됩니다.','The shift from “I” to “us” suggests divine deliberation, but this verse alone does not establish the full Trinity doctrine.'],
['마 28:19','모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름 안으로 침례 주십시오.','Make disciples of all nations, baptizing them into the name of the Father, Son, and Holy Spirit.','εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος','ὄνομα (오노마) — 이름','단수 “이름” 아래 아버지·아들·성령이 함께 놓이는 대표적인 삼위일체 본문입니다.','The singular “name” joining Father, Son, and Spirit makes this a major Trinitarian text.'],
['고전 8:6','우리에게는 한 하나님 아버지가 계시고 한 주 예수 그리스도가 계십니다.','For us there is one God, the Father, and one Lord, Jesus Christ.','εἷς θεὸς ὁ πατὴρ … εἷς κύριος Ἰησοῦς Χριστός','εἷς (헤이스) — 하나','바울은 쉐마의 유일신 고백 안에 아버지와 예수 그리스도를 함께 포함합니다.','Paul includes the Father and Jesus Christ within the confession of the one God.'],
['히 1:8','아들에 관하여 하나님은 “오 하나님, 주님의 보좌는 영원무궁합니다”라고 말씀하십니다.','Of the Son He says, “Your throne, O God, is forever and ever.”','ὁ θρόνος σου ὁ θεὸς','ὁ θεός (호 테오스) — 오 하나님','시편 45편을 아들에게 적용하여 아들의 왕권과 신적 신분을 높이 선언합니다.','Psalm 45 is applied to the Son, strongly affirming His royal and divine status.'],
['행 5:3–4','베드로는 아나니아가 성령께 거짓말한 것을 하나님께 거짓말한 것이라고 말합니다.','Peter says that lying to the Holy Spirit is lying to God.','ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον … τῷ θεῷ','πνεῦμα τὸ ἅγιον — 성령','두 문장의 병행은 성령의 인격성과 신성을 보여 주는 중요한 근거입니다.','The parallel statements are important evidence for the Spirit’s personhood and deity.'],
['사 9:6','태어날 아들은 놀라우신 조언자, 전능하신 하나님, 영원하신 아버지, 평화의 통치자라 불립니다.','The promised child is called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.','אֵל גִּבּוֹר אֲבִי־עַד','אֵל גִּבּוֹר (엘 깁보르) — 전능하신 하나님','메시아의 신적 칭호를 강하게 증언하지만 “영원한 아버지”를 성부와 성자의 위격적 동일시로 단순화해서는 안 됩니다.','The divine titles exalt the Messiah, but “Everlasting Father” should not erase the distinction between Father and Son.'],
['히 7:3','멜기세덱은 계보 기록상 시작이나 끝이 없이 하나님의 아들과 같게 되어 계속 제사장으로 있습니다.','Melchizedek, without recorded genealogy or end, is made like the Son of God and remains a priest.','ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ','ἀφομοιόω (아포모이오오) — 닮게 하다','본문은 멜기세덱이 아들과 동일하다고 하지 않고 “아들과 같게 되었다”고 말합니다.','The text says Melchizedek is made like the Son, not that he is the Son.'],
['미 5:2','베들레헴에서 이스라엘을 다스릴 분이 나오며 그분의 기원은 옛날, 영원의 날들로부터입니다.','From Bethlehem will come the ruler whose origins are from ancient days.','מוֹצָאֹתָיו מִקֶּדֶם מִימֵי עוֹלָם','מוֹצָאוֹת (모차오트) — 기원/나아옴','마태복음은 이 구절을 메시아의 베들레헴 출생에 적용하며, “영원의 날들”의 정확한 범위는 해석상 논의됩니다.','Matthew applies this to Messiah’s Bethlehem birth; the precise force of “days of eternity” is debated.'],
['히 9:14','그리스도께서 영원하신 영을 통하여 자신을 흠 없이 하나님께 드리셨습니다.','Christ offered Himself without blemish to God through the eternal Spirit.','διὰ πνεύματος αἰωνίου','αἰώνιος (아이오니오스) — 영원한','아들·성령·하나님이 구속 사건 안에서 함께 나타나는 삼위일체적 구조입니다.','Son, Spirit, and God appear together in the saving act in a Trinitarian pattern.'],
['마 3:16–17','예수님께서 침례받으실 때 성령께서 내려오시고 하늘에서 아버지의 음성이 들렸습니다.','At Jesus’ baptism the Spirit descends and the Father’s voice speaks from heaven.','πνεῦμα θεοῦ … φωνὴ ἐκ τῶν οὐρανῶν','καταβαῖνον (카타바이논) — 내려오는','아버지와 아들과 성령이 동시에 구별되어 나타나므로 양태론과 양립하기 어려운 본문입니다.','Father, Son, and Spirit appear distinctly and simultaneously, challenging modalism.'],
['요 14:11','예수님은 자신이 아버지 안에 있고 아버지께서 자신 안에 계신다는 것을 믿으라고 하십니다.','Jesus says, “I am in the Father and the Father is in Me.”','ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί','ἐν (엔) — 안에','상호 내재는 아버지와 아들의 깊은 연합을 말하지만 두 위격의 구별을 없애지 않습니다.','Mutual indwelling expresses profound unity without erasing personal distinction.'],
['요 14:10','아들 안에 거하시는 아버지께서 자신의 일을 하시며, 아들의 말은 독립적으로 나온 것이 아닙니다.','The Father dwelling in the Son does His works; the Son does not speak independently.','ὁ πατὴρ ἐν ἐμοὶ μένων ποιεῖ τὰ ἔργα','μένω (메노) — 거하다','예수님의 말씀과 일은 아버지와의 완전한 연합과 순종 안에서 이루어집니다.','Jesus’ words and works flow from perfect union and obedience to the Father.'],
['요 10:30','예수님은 “나와 아버지는 하나입니다”라고 말씀하십니다.','Jesus says, “I and the Father are one.”','ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν','ἕν (헨) — 하나, 중성','“하나”는 중성이고 동사는 복수이므로 본질과 사역의 하나 됨을 나타내면서 인격의 구별도 보존합니다.','The neuter “one” with a plural verb expresses unity while preserving personal distinction.'],
['요 8:29','예수님을 보내신 분이 함께 계시며, 예수님은 언제나 그분을 기쁘시게 하는 일을 하십니다.','The One who sent Jesus is with Him; Jesus always does what pleases Him.','ὁ πέμψας με μετ᾽ ἐμοῦ ἐστιν','πέμπω (펨포) — 보내다','아들의 사명은 아버지에게서 오며 그분과의 끊임없는 교통과 순종 속에서 수행됩니다.','The Son’s mission comes from the Father and is carried out in constant fellowship and obedience.'],
['요 14:26','아버지께서 아들의 이름으로 보내실 보혜사 성령께서 제자들을 가르치고 기억나게 하십니다.','The Father sends the Holy Spirit in the Son’s name to teach and remind the disciples.','ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου','παράκλητος (파라클레토스) — 보혜사','성령은 단순한 힘이 아니라 보내심을 받고 가르치시는 인격적 주체로 묘사됩니다.','The Spirit is portrayed not as an impersonal force but as One who is sent and teaches.'],
['요 15:26','아들이 아버지에게서 보내실 진리의 영은 아들에 관하여 증언하십니다.','The Spirit of truth, sent by the Son from the Father, bears witness about the Son.','τὸ πνεῦμα τῆς ἀληθείας … ἐκεῖνος μαρτυρήσει','ἐκπορεύεται (에크포류에타이) — 나오다','성령의 영원한 나오심과 역사적 보내심을 구분하는 것이 동서방 논쟁을 이해하는 데 중요합니다.','Distinguishing the Spirit’s procession from His historical mission is important in East–West theology.'],
['요 16:15','아버지께 있는 모든 것이 아들의 것이며 성령께서 아들의 것을 받아 제자들에게 알려 주십니다.','All that the Father has belongs to the Son; the Spirit takes what is the Son’s and declares it.','πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν','ἀναγγέλλω (아낭겔로) — 알려 주다','아버지·아들·성령의 구별과 신적 소유 및 계시의 연합이 함께 나타납니다.','The verse joins personal distinction with unity in divine possession and revelation.'],
['엡 2:18','그리스도를 통하여 유대인과 이방인 모두 한 성령 안에서 아버지께 나아갑니다.','Through Christ, both Jews and Gentiles have access in one Spirit to the Father.','δι᾽ αὐτοῦ … ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα','προσαγωγή (프로사고게) — 나아감','기독교적 하나님 체험의 방향을 “아들을 통하여, 성령 안에서, 아버지께”로 보여 줍니다.','Christian access to God is portrayed as through the Son, in the Spirit, to the Father.'],
['고후 13:14','주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통이 모든 이와 함께하기를 빕니다.','The grace of Christ, the love of God, and the fellowship of the Holy Spirit be with all.','ἡ χάρις … ἡ ἀγάπη … ἡ κοινωνία','κοινωνία (코이노니아) — 교통/참여','삼위 하나님의 구원적 은혜·사랑·교통을 교회가 함께 누리도록 비는 축복입니다.','This blessing invokes the saving grace, love, and fellowship of the Triune God.'],
['민 6:24–26','여호와께서 복을 주고 지키시며, 얼굴을 비추어 은혜 베푸시고, 얼굴을 들어 평안을 주시기를 빕니다.','May the LORD bless and keep you, shine upon you with grace, and give you peace.','יְבָרֶכְךָ יְהוָה … יָאֵר יְהוָה … יִשָּׂא יְהוָה','יְבָרֶכְךָ (예바레케카) — 복 주시다','세 번 반복되는 여호와의 이름은 풍성한 축복의 삼중 리듬을 이루지만 그 자체만으로 삼위일체의 직접 증명은 아닙니다.','The threefold repetition of the LORD’s name gives a rich triadic pattern, though it is not by itself a direct proof of the Trinity.']

function godVerseCard(p,i){
 const [ref,ko,en,orig,words]=p;
 const lang=/[가-힣]/.test(ref)&&(/^(신|사|출|시|창|미|민)/.test(ref))?'HEBREW':'GREEK';
 const koMarked=highlightGodKorean(ko,GOD_INLINE_TARGETS[i],GOD_INLINE_ORIGINAL[i],GOD_INLINE_PRON[i],GOD_INLINE_ROMAN[i]);
 const enMarked=highlightGodEnglish(en);
 const versions=PUBLIC_ENGLISH[ref];
 const darbyMarked=highlightGodEnglish(versions.darby);
 const bsbMarked=highlightGodEnglish(versions.bsb);
 return `<div class="card"><div class="numref">${i+1}. ${ref}</div><div class="verse">${koMarked}</div><div class="korean-easy"><div class="korean-easy-title">개역한글</div><div class="engtext">${KRV_TEXT[ref]}</div></div><div class="english-grid"><div class="engbox"><div class="engtitle">DARBY</div><div class="engtext">“${darbyMarked}”</div><div class="audio-row"><button class="listen" onclick="speakText('${versions.darby.replaceAll("'","&apos;")}', this)">🔊 Listen</button><select class="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div></div><div class="engbox"><div class="engtitle">BSB</div><div class="engtext">“${bsbMarked}”</div><div class="audio-row"><button class="listen" onclick="speakText('${versions.bsb.replaceAll("'","&apos;")}', this)">🔊 Listen</button><select class="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div></div><div class="engbox"><div class="engtitle">EASY ENGLISH — MEANING</div><div class="engtext">${en}</div><div class="easy-note">Plain-English meaning guide — not a Bible translation.</div><div class="audio-row"><button class="listen" onclick="speakText('${en.replaceAll("'","&apos;")}', this)">🔊 Listen</button><select class="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div></div><div class="engbox"><div class="greek-title">${lang} — 동사 🔴 · 명사 🟢</div><div class="greek-full">${GOD_FULL_ORIGINALS[i]}</div><div class="guide-note">핵심 어휘: ${words} · 단어를 누르면 lemma와 문법 정보가 표시됩니다.</div></div></div></div>`;
}

function highlightGodKorean(text,target,original,pron,roman){
 const terms=/(삼위일체|성령|아버지|아들|예수 그리스도|그리스도|예수님|하나님|여호와|주 하나님|전능자|창조주|영원한 생명|하나님의 생명|영광|거룩|사랑|빛|의와 정의|은혜|교통|평안|한 분|하나)/g;
 const token='___GOD_INLINE_ORIGINAL___';
 const held=text.includes(target)?text.replace(target,token):text;
 const colored=held.replace(terms,'<span class="blue">$1</span>');
 const inline=`<span class="blue">${target}</span><span class="paren">(</span><span class="greek">${original}</span>, <span class="roman">${roman}</span><span class="paren">)</span>`;
 return colored.replace(token,inline);
}

function highlightGodEnglish(text){
 const terms=/(Holy Spirit|Spirit of truth|Spirit|Father|Son|Jesus Christ|Jesus|Christ|Lord God|LORD|God|Almighty|Creator|eternal life|glory|holy|holiness|love|light|grace|fellowship|peace|one)/gi;
 return text.replace(terms,'<strong class="blue">$1</strong>');
}
const GOD_STUDY_DETAIL=[["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","바울은 우상이 물질적으로 존재하지 않는다고 말하는 것이 아니라 그것이 참 하나님이 아님을 말합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Paul does not deny that idol objects exist; he denies their status as true deity."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","אֶחָד 하나만으로 하나님의 내적 위격 관계까지 직접 설명하려 해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The word “one” alone does not spell out God’s inner personal relations."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 선언을 다른 신들의 제한적 신성을 인정하는 말로 약화시키면 이사야 40–48장의 논지를 놓칩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not weaken Isaiah’s claim into recognition of lesser true gods."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 표현의 철학적 의미만 강조하여 출애굽 문맥의 “내가 너와 함께하겠다”는 언약적 임재를 놓치지 않아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not let philosophical readings eclipse the covenant promise of God’s presence."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","3:14의 하나님의 이름과 3:16의 역사적 언약 관계를 분리해서 읽지 않는 것이 중요합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Read the divine name together with God’s historical covenant faithfulness."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","ὁ ὢν…은 “지금도 계시고…”에, παντοκράτωρ는 “전능자”에 각각 연결해야 하며 서로 바꾸어 붙이면 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Keep the “who is…” formula distinct from pantokratōr, “Almighty.”"],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","영생을 정보 지식으로 축소하거나, 반대로 예수 그리스도를 아는 명시적 내용을 생략해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not reduce eternal life to information or omit the explicit knowledge of Christ."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“섬기다”는 단순한 내적 믿음이 아니라 삶의 방향이 실제로 바뀐 회심을 포함합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Serving describes a changed allegiance, not merely an inward opinion."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","인간이 하나님과 똑같이 본래적 불멸을 소유한다는 근거로 사용해서는 안 됩니다. 본문은 하나님만 그것을 가지신다고 말합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The verse attributes underived immortality uniquely to God."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","풍성히 주신다는 말을 부의 축적을 보장하는 번영 신학으로 바꾸지 않아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","God’s provision is not a promise of unlimited material wealth."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","시편의 시적 표현을 시간에 관한 모든 철학적 질문의 세부 답변으로 과도하게 사용하지 않아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The poetic confession should not be forced to answer every philosophical question about time."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 한 절만으로 창조의 모든 과정과 시간 길이를 결정하기보다 창조주가 하나님이라는 중심 선언을 먼저 보아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The verse identifies the Creator; it does not by itself settle every question about process or duration."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“하나님의 뜻 때문에 존재한다”는 말을 피조물의 고통과 악을 하나님이 직접 기뻐하신다는 뜻으로 단순화해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Existence by God’s will should not be simplified into divine delight in every evil event."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","말씀의 능력을 인간이 원하는 것을 선언하여 실현하는 기술로 옮겨서는 안 됩니다. 주어는 하나님입니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The subject is God; this is not a technique of human verbal manifestation."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“없는 것을 있는 것으로 부르신다”의 주체는 하나님이며 인간의 긍정적 고백 능력을 가르치는 구절이 아닙니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The caller is God, not a believer exercising creative speech."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","일반계시는 하나님의 능력과 신성을 증언하지만 그리스도의 복음 내용을 모두 전달한다고 말하지는 않습니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","General revelation does not by itself communicate the whole gospel."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“영”을 비인격적 에너지로 축소하거나, 예배의 육체적·공동체적 차원을 무가치하게 보아서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not reduce Spirit to impersonal energy or despise embodied, communal worship."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“사랑은 하나님”이라고 뒤집어 인간이 정의한 사랑을 하나님보다 높은 기준으로 삼아서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The statement cannot be reversed so that any human definition of love becomes God."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","빛을 지적 계시만으로 제한하지 말고 이어지는 죄의 고백과 거룩한 행실의 문맥을 함께 보아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Light includes moral holiness, as the following discussion of sin makes clear."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 표현을 인간이 신격에 편입된다는 뜻으로 확대하지 말고, 하나님에게서 오는 생명과의 단절이라는 문맥에서 읽어야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not turn participation in God’s life into absorption into the Godhead."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","제자들이 영광을 받는다는 사실을 그들이 예배받을 신이 된다는 의미로 해석해서는 안 됩니다. 목적은 하나 됨입니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The gift serves unity; it does not make disciples objects of worship."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","하나님의 거룩함과 신자의 거룩함은 유사성과 참여를 말하지만 창조주와 피조물의 구별을 없애지 않습니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Believers reflect God’s holiness without erasing the Creator-creature distinction."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","면류관을 공로로 구원을 구매하는 보상으로 보지 말고, 은혜 안에서 충성한 이들을 의롭게 판단하시는 문맥으로 읽어야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The crown is not a purchase price for salvation but a gracious reward for faithfulness."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","보좌의 기초를 정의만으로 축소하지 말고 같은 절의 인자와 진실도 함께 보아야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not isolate justice from the steadfast love and faithfulness named in the same verse."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","하나님의 신실함을 특정 교회 조직이나 지도자가 항상 옳다는 보증으로 옮겨서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","God’s faithfulness does not guarantee that a particular organization or leader is always right."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","복수형은 중요하지만 이 한 절만으로 삼위일체의 세 위격과 관계를 모두 증명했다고 말해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The plural is significant but does not by itself define the full doctrine of the Trinity."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","침례 공식을 주문처럼 취급하거나 세 이름을 세 신으로 분리해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not treat the formula magically or divide the three into three gods."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“한 하나님”을 근거로 아들을 피조물로 낮추거나, “한 주”를 근거로 아버지가 주가 아니라고 결론내리면 바울의 쉐마적 병행을 깨뜨립니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not use either half to exclude the Father or Son from the divine identity expressed by the whole."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 구절을 성부와 성자의 인격적 구별이 사라진다는 뜻으로 사용해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The Son’s deity does not erase His personal distinction from the Father."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","성령을 단순한 영향력으로만 보는 해석은 베드로가 성령을 속임의 인격적 대상으로 말하는 점을 충분히 설명하지 못합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","A merely impersonal view of the Spirit does not account well for the language of deception."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“영원하신 아버지”라는 왕적 칭호를 성자가 곧 성부라는 양태론적 동일시로 바꾸어서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The royal title does not collapse the Son into the person of the Father."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“같게 되었다”를 “동일 인물이다”로 바꾸면 비교의 방향이 뒤집힙니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Similarity should not be converted into identity."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“영원의 날들”을 메시아의 영원한 신성을 지지하는 정경적 증거로 읽을 수 있지만, 이 구절의 히브리어만으로 모든 선재 교리를 결정해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Canonical use may support preexistence, but the Hebrew phrase alone should not carry every later conclusion."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“영”을 그리스도 자신의 인간 영으로 보는 견해와 성령으로 보는 견해가 있으므로 삼위일체적 구조를 주장할 때 해석 단계를 밝혀야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Interpreters debate whether this refers to the Holy Spirit or Christ’s own spirit; the inference should be stated openly."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 장면을 한 위격이 연속해서 세 역할을 연기한 것으로 설명하면 본문의 동시적 관계를 약화시킵니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Treating the scene as one person successively playing three roles weakens its simultaneous relations."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","상호 내재는 위격의 구별 없는 혼합이 아니라 구별 안의 완전한 연합을 가리킵니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Mutual indwelling is unity with distinction, not an undifferentiated mixture."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","아들의 순종을 신성의 열등함으로 단정하거나, 반대로 아들의 실제 순종을 지워서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not turn the Son’s obedience into ontological inferiority or erase its reality."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 구절은 단일 인격을 말하지 않으며, 동시에 단순한 목적의 일치로만 축소하기에도 문맥상 강한 표현입니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The verse neither teaches one person nor comfortably reduces the unity to mere agreement."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","아들의 순종을 도덕적 모범으로만 축소하면 요한복음의 보내심과 아버지와의 독특한 관계를 놓칩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not reduce the Son’s obedience to a generic moral example."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","성령의 사역을 인간 교사의 권위와 동일시하거나 특정 지도자의 말을 성령의 가르침으로 자동 확정해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Do not identify a human teacher’s authority automatically with the Spirit’s teaching."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","영원한 나오심과 역사 속 보내심을 구분하지 않으면 필리오케 논쟁을 지나치게 단순화하게 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","Distinguish eternal procession from historical mission when discussing the filioque."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","성령의 “받음”을 피조물적 열등함으로 해석하기보다 요한복음의 계시 관계 안에서 읽어야 합니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The Spirit’s receiving should be read as revelatory relation, not creaturely inferiority."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 구절은 아버지만 하나님이고 아들과 성령은 단지 통로라고 낮추는 도식이 아니라 삼위의 구원 사역을 보여 줍니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The order describes Trinitarian access, not a denial of the Son’s or Spirit’s deity."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","세 항목의 병렬은 삼위일체적이지만 이 축복문 하나만으로 삼위일체 교리의 모든 정의를 도출해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","The triadic blessing is strongly Trinitarian but is not by itself a complete doctrinal definition."],["Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","삼중 반복을 정경적으로 삼위일체와 연결할 수 있지만 민수기 본문 자체가 세 위격을 직접 명명한다고 말해서는 안 됩니다.","Compare Darby’s literal wording with the BSB’s contemporary wording in light of the original text and context.","A canonical Trinitarian reading is possible, but Numbers itself does not explicitly name three persons."]];

const ECONOMY_PASSAGES=[["엡 1:9","하나님은 그분의 기쁨을 따라 그분의 뜻의 비밀을 우리에게 알려 주셨습니다.","having made known to us the mystery of his will, according to his good pleasure which he purposed in himself","And He has made known to us the mystery of His will according to His good pleasure, which He purposed in Christ","God graciously revealed the hidden plan He purposed in Christ.","그분의 뜻의 비밀","τὸ μυστήριον τοῦ θελήματος αὐτοῦ","토 뮈스테리온 투 텔레마토스 아우투","to mystērion tou thelēmatos autou","1:3–14의 긴 찬송 안에서 바울은 선택·아들의 구속·성령의 도장을 하나님의 뜻과 연결합니다.","Within the blessing of 1:3–14, Paul joins election, redemption, and sealing to God’s will.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“비밀”은 소수만 아는 암호가 아니라 이제 그리스도 안에서 공개된 하나님의 계획입니다."],["엡 1:1","바울은 하나님의 뜻을 통하여 그리스도 예수님의 사도가 되었습니다.","Paul, apostle of Jesus Christ by God's will, to the saints and faithful in Christ Jesus who are at Ephesus.","Paul, an apostle of Christ Jesus by the will of God, To the saints in Ephesus, the faithful in Christ Jesus:","Paul’s apostleship rests on God’s will, not self-appointment.","하나님의 뜻","θελήματος θεοῦ","텔레마토스 테우","thelēmatos theou","서신의 첫 인사부터 바울의 사역 권위가 개인적 야망이 아니라 하나님의 부르심에서 왔음을 밝힙니다.","The opening greeting grounds Paul’s ministry in divine calling rather than personal ambition.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 구절을 오늘날 특정 사역자의 모든 결정이 곧 하나님의 뜻이라는 보증으로 확대해서는 안 됩니다."],["엡 3:11","이것은 하나님께서 그리스도 예수님 안에서 이루신 영원한 목적에 따른 것입니다.","according to [the] purpose of the ages, which he purposed in Christ Jesus our Lord,","according to the eternal purpose that He accomplished in Christ Jesus our Lord.","God’s eternal purpose is carried out in Christ.","영원한 목적","πρόθεσιν τῶν αἰώνων","프로테신 톤 아이오논","prothesin tōn aiōnōn","교회를 통하여 하나님의 각종 지혜가 알려진다는 3:10의 선언을 그리스도 안의 영원한 목적에 연결합니다.","It grounds the church’s witness to God’s manifold wisdom in His eternal purpose in Christ.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","영원한 목적을 한 단체의 역사나 프로그램과 동일시하지 말고 그리스도와 교회라는 본문 중심을 보아야 합니다."],["엡 1:10","때가 찰 때의 경륜은 하늘과 땅의 모든 것을 그리스도 안에서 머리이신 그분 아래 하나로 모으는 것입니다.","for [the] administration of the fulness of times; to head up all things in the Christ, the things in the heavens and the things upon the earth; in him,","as a plan for the fullness of time, to bring all things in heaven and on earth together in Christ.","God’s plan brings all things together under Christ at the fullness of time.","때가 찰 때의 경륜","οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν","오이코노미안 투 플레로마토스 톤 카이론","oikonomian tou plērōmatos tōn kairōn","1:9에서 알려진 뜻의 비밀이 무엇을 향하는지를 설명합니다. 목표는 만물이 그리스도 안에서 통일되는 것입니다.","It explains the goal of the mystery in 1:9: all things are summed up in Christ.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“경륜”을 단순한 분배 행위 하나로 제한하지 말고, 때의 완성과 그리스도 안의 우주적 통일을 포함해 읽어야 합니다."],["엡 3:9","바울의 사명은 만물을 창조하신 하나님 안에 감추어져 있던 비밀의 경륜이 무엇인지 모든 사람에게 밝히는 것입니다.","and to enlighten all [with the knowledge of] what is the administration of the mystery hidden throughout the ages in God, who has created all things,","and to illuminate for everyone the stewardship of this mystery, which for ages past was kept hidden in God, who created all things.","Paul makes known God’s long-hidden plan now revealed in Christ and the church.","비밀의 경륜","οἰκονομία τοῦ μυστηρίου","오이코노미아 투 뮈스테리우","oikonomia tou mystēriou","3:6은 이방인들이 그리스도 안에서 공동 상속자와 한 몸의 지체가 된 것이 비밀이라고 설명합니다.","Verse 6 identifies the mystery: Gentiles are fellow heirs and members of one body in Christ.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","비밀의 경륜을 어떤 현대 사역의 독점적 계시로 만들면 바울이 모든 사람에게 밝히려는 보편적 복음과 충돌합니다."],["딤전 1:4","끝없는 족보와 신화는 믿음 안에 있는 하나님의 경륜을 이루기보다 논쟁을 일으킵니다.","nor to turn their minds to fables and interminable genealogies, which bring questionings rather than [further] God's dispensation, which [is] in faith.","or devote themselves to myths and endless genealogies, which promote speculation rather than the stewardship of God’s work, which is by faith.","Speculation distracts from God’s faith-centered work and stewardship.","믿음 안에 있는 하나님의 경륜","οἰκονομίαν θεοῦ τὴν ἐν πίστει","오이코노미안 테우 텐 엔 피스테이","oikonomian theou tēn en pistei","바울은 디모데에게 다른 가르침과 끝없는 사변을 막으라고 하며, 그 명령의 목표를 사랑이라고 1:5에서 밝힙니다.","Paul opposes speculative teaching and states in 1:5 that the aim of the charge is love.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","경륜을 강조하면서도 그 결과가 사랑·선한 양심·거짓 없는 믿음이 아니라 논쟁과 배타성이 된다면 1:4–5의 기준에 어긋납니다."],["요일 3:2","우리가 장차 어떻게 될지는 아직 나타나지 않았지만, 그분께서 나타나시면 우리가 그분과 같게 될 것을 압니다.","Beloved, now are we children of God, and what we shall be has not yet been manifested; we know that if it is manifested we shall be like him, for we shall see him as he is.","Beloved, we are now children of God, and what we will be has not yet been revealed. We know that when Christ appears, we will be like Him, for we will see Him as He is.","When Christ appears, believers will be like Him because they will see Him as He is.","그분과 같게","ὅμοιοι αὐτῷ","호모이오이 아우토","homoioi autō","하나님의 자녀라는 현재 신분과 장래의 변화가 연결되며, 3:3은 이 소망이 현재의 정결한 삶을 낳는다고 말합니다.","Present sonship is joined to future transformation, which produces present purification in verse 3.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“그분과 같게”를 신격을 소유하여 예배받는 존재가 된다는 뜻으로 확대하지 말고, 그리스도를 닮는 영화와 정결의 문맥에서 읽어야 합니다."],["창 1:26","하나님은 사람을 우리의 형상대로 우리의 모양에 따라 만들자고 말씀하셨습니다.","And God said, Let us make man in our image, after our likeness; and let them have dominion over the fish of the sea, and over the fowl of the heavens, and over the cattle, and over the whole earth, and over every creeping thing that creepeth on the earth.","Then God said, “Let Us make man in Our image, after Our likeness, to rule over the fish of the sea and the birds of the air, over the livestock, and over all the earth itself and every creature that crawls upon it.”","Human beings are created to reflect God and represent His rule.","우리의 형상대로 우리의 모양에 따라","בְּצַלְמֵנוּ כִּדְמוּתֵנוּ","베찰메누 키드무테누","betsalmenu kidmutenu","형상과 모양은 이어지는 땅의 생물에 대한 통치 사명과 연결됩니다. 인간은 하나님을 대표하는 존재로 창조됩니다.","Image and likeness are joined to humanity’s calling to represent God’s rule over creation.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","복수 “우리”를 삼위일체와 정경적으로 연결할 수 있지만 이 절만으로 삼위의 세 위격을 모두 직접 설명한다고 말해서는 안 됩니다."],["창 2:9","여호와 하나님은 보기에 아름답고 먹기에 좋은 모든 나무와 동산 중앙의 생명나무를 자라게 하셨습니다.","And out of the ground Jehovah Elohim made every tree grow that is pleasant to the sight, and good for food; and the tree of life, in the midst of the garden, and the tree of the knowledge of good and evil.","Out of the ground the LORD God gave growth to every tree that is pleasing to the eye and good for food. And in the middle of the garden were the tree of life and the tree of the knowledge of good and evil.","The tree of life stands at the center of Eden as God’s gift of life.","생명나무","עֵץ הַחַיִּים","에츠 하하임","ets hachayyim","생명나무와 선악을 알게 하는 나무가 함께 소개되며, 3장에서 인간의 선택과 추방의 배경이 됩니다.","The tree of life and the tree of knowledge set the stage for the choice and exile of Genesis 3.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","생명나무를 특정 종교 실천이나 교리 체계와 곧바로 동일시하기보다 창세기와 계시록의 정경적 흐름 안에서 해석해야 합니다."],["요 4:14","예수님께서 주시는 물은 그 사람 안에서 영원한 생명에 이르도록 솟아오르는 샘이 됩니다.","but whosoever drinks of the water which I shall give him shall never thirst for ever, but the water which I shall give him shall become in him a fountain of water, springing up into eternal life.","But whoever drinks the water I give him will never thirst. Indeed, the water I give him will become in him a fount of water springing up to eternal life.”","Jesus gives an inner spring of water that rises into eternal life.","영원한 생명에 이르도록 솟아오르는 샘","πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον","페게 휘다토스 할로메누 에이스 조엔 아이오니온","pēgē hydatos hallomenou eis zōēn aiōnion","사마리아 여인이 다시 목마르게 하는 우물물과 예수님이 주시는 생수를 대조하는 대화 안에 있습니다.","The saying contrasts Jacob’s well with the living water Jesus gives.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 물을 물질적 축복이나 순간적 감정만으로 축소하지 말고 요한복음의 성령과 영생의 흐름에서 읽어야 합니다."],["롬 8:10","그리스도께서 여러분 안에 계시면 몸은 죄 때문에 죽은 것이지만 영은 의 때문에 생명입니다.","but if Christ be in you, the body is dead on account of sin, but the Spirit life on account of righteousness.","But if Christ is in you, your body is dead because of sin, yet your spirit is alive because of righteousness.","Christ’s indwelling brings life in the midst of mortal existence.","영은 의 때문에 생명","τὸ πνεῦμα ζωὴ διὰ δικαιοσύνην","토 프뉴마 조에 디아 디카이오쉬넨","to pneuma zōē dia dikaiosynēn","8:9의 성령·그리스도의 영·그리스도의 내주와 8:11의 몸을 살리심 사이에 위치합니다.","It stands between the indwelling language of verse 9 and the enlivening of mortal bodies in verse 11.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","πνεῦμα가 인간의 영인지 성령인지 단정할 때 8:9–11 전체의 긴밀한 관계와 번역상의 모호성을 밝혀야 합니다."],["롬 8:6","육체에 둔 생각은 죽음이지만 영에 둔 생각은 생명과 평안입니다.","For the mind of the flesh [is] death; but the mind of the Spirit life and peace.","The mind of the flesh is death, but the mind of the Spirit is life and peace,","A mind governed by the Spirit is life and peace.","영에 둔 생각은 생명과 평안","τὸ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη","토 프로네마 투 프뉴마토스 조에 카이 에이레네","to phronēma tou pneumatos zōē kai eirēnē","8:5–8은 육체와 영이라는 두 지향과 그 결과를 대조합니다.","Romans 8:5–8 contrasts two controlling orientations and their outcomes.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 구절을 생각을 억지로 통제하는 심리 기법으로 축소하지 말고 성령의 통치 아래 있는 삶의 방향으로 읽어야 합니다."],["롬 8:11","예수님을 죽은 사람들 가운데서 살리신 분의 영께서 여러분 안에 거하시면 그분은 여러분의 죽을 몸에도 생명을 주실 것입니다.","But if the Spirit of him that has raised up Jesus from among [the] dead dwell in you, he that has raised up Christ from among [the] dead shall quicken your mortal bodies also on account of his Spirit which dwells in you.","And if the Spirit of Him who raised Jesus from the dead is living in you, He who raised Christ Jesus from the dead will also give life to your mortal bodies through His Spirit, who lives in you.","The indwelling Spirit guarantees life even for believers’ mortal bodies.","죽을 몸에도 생명을 주실","ζῳοποιήσει καὶ τὰ θνητὰ σώματα","조오포이에세이 카이 타 트네타 소마타","zōopoiēsei kai ta thnēta sōmata","성령의 내주는 현재의 소속과 장래의 부활을 함께 보증합니다.","The Spirit’s indwelling marks present belonging and guarantees future resurrection.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","이 약속을 현재의 모든 질병이 반드시 치유된다는 보장으로 바꾸기보다 부활 문맥을 중심에 두어야 합니다."],["고전 6:17","주님과 합하는 사람은 주님과 한 영입니다.","But he that [is] joined to the Lord is one Spirit.","But he who unites himself with the Lord is one with Him in spirit.","Union with the Lord creates a profound spiritual oneness.","주님과 한 영","ἓν πνεῦμά ἐστιν","헨 프뉴마 에스틴","hen pneuma estin","창녀와의 육체적 결합을 피하라는 문맥에서 몸이 주님을 위한 것이며 성령의 성전이라는 윤리적 논증의 일부입니다.","The verse belongs to Paul’s ethical argument against sexual union with a prostitute.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“한 영”을 인격의 소멸이나 하나님과 인간의 본질적 혼합으로 해석하면 결합과 구별을 함께 보존하는 문맥을 넘어섭니다."],["요일 4:13","하나님께서 우리에게 그분의 영을 주셨으므로 우리가 하나님 안에 거하고 하나님께서 우리 안에 거하시는 것을 압니다.","Hereby we know that we abide in him and he in us, that he has given to us of his Spirit.","By this we know that we remain in Him, and He in us: He has given us of His Spirit.","The gift of God’s Spirit assures mutual abiding between God and believers.","그분의 영을 주셨으므로","ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν","에크 투 프뉴마토스 아우투 데도켄","ek tou pneumatos autou dedōken","4:12의 서로 사랑함과 4:14–16의 아들을 세상의 구주로 고백함 사이에서 성령이 내주의 확신을 주십니다.","The Spirit’s gift stands between mutual love and confession of the Son as Savior.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","상호 내주를 인간이 신격에 흡수된다는 뜻으로 읽지 말고 성령·사랑·고백이 함께 나타나는 언약적 관계로 이해해야 합니다."],["엡 3:17–19","그리스도께서 믿음을 통하여 마음에 거하시고, 성도들이 그리스도의 사랑을 알아 하나님의 모든 충만에 이르도록 충만하게 되기를 바울은 기도합니다.","that the Christ may dwell, through faith, in your hearts, being rooted and founded in love, in order that ye may be fully able to apprehend with all the saints what [is] the breadth and length and depth and height; and to know the love of the Christ which surpasses knowledge; that ye may be filled [even] to all the fulness of God.","so that Christ may dwell in your hearts through faith. Then you, being rooted and grounded in love, will have power, together with all the saints, to comprehend the length and width and height and depth of the love of Christ, and to know this love that surpasses knowledge, that you may be filled with all the fullness of God.","Paul prays for Christ’s indwelling, rooted love, and fullness in God’s people.","하나님의 모든 충만에 이르도록 충만하게","πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ","플레로테테 에이스 판 토 플레로마 투 테우","plērōthēte eis pan to plērōma tou theou","3:14–21의 기도는 성령을 통한 속사람의 강화, 그리스도의 거처, 사랑의 인식, 하나님의 충만으로 전개됩니다.","The prayer moves from strengthening through the Spirit to Christ’s dwelling, love, and divine fullness.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","하나님의 충만에 참여함을 신격 자체가 되거나 창조주와 피조물의 구별이 사라진다는 뜻으로 표현해서는 안 됩니다."],["골 2:10","여러분은 모든 통치와 권세의 머리이신 그리스도 안에서 충만하게 되었습니다.","and ye are complete in him, who is the head of all principality and authority,","And you have been made complete in Christ, who is the head over every ruler and authority.","Believers share fullness in Christ, the supreme Head over every power.","그리스도 안에서 충만하게","ἐστὲ ἐν αὐτῷ πεπληρωμένοι","에스테 엔 아우토 페플레로메노이","este en autō peplērōmenoi","2:9의 신격의 모든 충만이 그리스도 안에 몸을 입고 거한다는 선언 바로 뒤에 나옵니다.","It follows the declaration that the fullness of deity dwells bodily in Christ.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","그리스도 안에서 충만하다는 말은 신자에게 그리스도와 동일한 신격이 있다는 뜻이 아니라 그분 안에서 부족함이 없다는 뜻입니다."],["엡 3:2","바울은 여러분을 위하여 자신에게 주어진 하나님의 은혜의 청지기 직분을 말합니다.","(if indeed ye have heard of the administration of the grace of God which has been given to me towards you,","Surely you have heard about the stewardship of God’s grace that was given to me for you,","Paul’s ministry is a stewardship of grace for the benefit of others.","하나님의 은혜의 청지기 직분","οἰκονομίαν τῆς χάριτος τοῦ θεοῦ","오이코노미안 테스 카리토스 투 테우","oikonomian tēs charitos tou theou","바울은 이방인을 위한 자신의 사역을 개인 소유가 아니라 받은 은혜를 맡아 섬기는 청지기 직분으로 설명합니다.","Paul describes ministry to the Gentiles as entrusted service, not personal possession.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","청지기 직분을 은혜를 독점하거나 다른 사역자 위에 군림할 권리로 바꾸면 “여러분을 위하여”라는 방향을 거스릅니다."],["엡 3:7–8","바울은 하나님의 은혜의 은사와 능력의 운행에 따라 복음의 사역자가 되어 그리스도의 측량할 수 없는 풍성을 이방인들에게 전했습니다.","of which I am become minister according to the gift of the grace of God given to me, according to the working of his power. To me, less than the least of all saints, has this grace been given, to announce among the nations the glad tidings of the unsearchable riches of the Christ,","I became a servant of this gospel by the gift of God’s grace, given me through the working of His power. Though I am less than the least of all the saints, this grace was given me: to preach to the Gentiles the unsearchable riches of Christ,","Grace made Paul a servant who proclaimed Christ’s inexhaustible riches to the nations.","그리스도의 측량할 수 없는 풍성","ἀνεξιχνίαστον πλοῦτος τοῦ Χριστοῦ","아넥시크니아스톤 플루토스 투 크리스투","anexichniaston ploutos tou Christou","바울의 사역은 자신의 탁월함이 아니라 가장 작은 성도보다 더 작다는 인식과 받은 은혜에 근거합니다.","Paul grounds ministry in received grace and calls himself less than the least of all saints.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","그리스도의 풍성을 한 교사의 용어 체계나 출판물에만 한정하면 “측량할 수 없음”과 모든 이방인을 향한 복음의 넓이를 축소합니다."],["골 1:25","바울은 여러분을 위하여 주어진 하나님의 청지기 직분을 따라 교회의 사역자가 되어 하나님의 말씀을 완성했습니다.","of which *I* became minister, according to the dispensation of God which [is] given me towards you to complete the word of God,","I became its servant by the commission God gave me to fully proclaim to you the word of God,","Paul’s stewardship serves the church by bringing God’s word to its intended fullness.","하나님의 청지기 직분","οἰκονομίαν τοῦ θεοῦ","오이코노미안 투 테우","oikonomian tou theou","1:26–27은 완성되는 말씀의 비밀을 “너희 안에 계신 그리스도, 영광의 소망”으로 설명합니다.","Verses 26–27 identify the revealed mystery as Christ in you, the hope of glory.","Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.","“말씀을 완성했다”를 후대 사역자가 성경과 동등한 새 계시를 추가할 수 있다는 근거로 사용해서는 안 됩니다."]];

function economyMarked(p){
 const [,,,,,target,original,pron,roman]=p;
 const token='___ECONOMY_KEY___';
 const held=p[1].replace(target,token);
 const colored=held.replace(/(하나님|그리스도|예수님|성령|영원한 생명|생명|말씀|교회|경륜|비밀|뜻|충만|풍성|한 영|영)/g,'<span class="blue">$1</span>');
 return colored.replace(token,`<span class="blue">${target}</span><span class="paren">(</span><span class="greek">${original}</span>, <span class="roman">${roman}</span><span class="paren">)</span>`);
}
function economyVerseCard(p,i){

 const versions=PUBLIC_ENGLISH[ref];
