}
const ECONOMY_COMPARE_EN=ECONOMY_PASSAGES.map(()=>"Compare Darby’s literal rendering with the BSB’s contemporary wording while keeping the original-language context in view.");
const ECONOMY_CAUTION_EN=[
'Mystery is not an esoteric code but God’s formerly hidden plan now disclosed in Christ.','This verse does not guarantee that every decision of a present-day minister is God’s will.','Do not identify the eternal purpose with the history or program of one organization.','Economy here includes the fullness of time and the cosmic summing up of all things in Christ.','Making the mystery known to all conflicts with claims that one modern ministry exclusively owns it.','If teaching on economy produces quarrels rather than love, a good conscience, and sincere faith, it violates verses 4–5.','Likeness to Christ is glorification and purification, not entrance into the Godhead.','A canonical Trinitarian reading of “us” is possible, but the verse alone does not define three persons.','Do not identify the tree automatically with one modern practice or doctrinal system.','Read the living water within John’s themes of Spirit and eternal life, not as material prosperity or mere emotion.','The ambiguity of pneuma should be acknowledged when choosing between human spirit and Holy Spirit.','This is a Spirit-governed orientation of life, not a technique of forced mental control.','The promise centers on resurrection and should not be turned into a guarantee of present healing from every illness.','One spirit signifies profound union without personal extinction or ontological mixture.','Mutual abiding is covenantal participation through the Spirit, love, and confession—not absorption into deity.','Participation in God’s fullness does not erase the Creator-creature distinction.','Fullness in Christ does not mean believers possess the Godhead as Christ does.','Stewardship of grace serves others; it does not authorize monopoly or domination.','Christ’s unsearchable riches cannot be confined to one teacher’s vocabulary or publications.','Paul’s completing the word does not authorize later ministers to add revelation equal to Scripture.'

function economyStudyCard(p,i){

없는 자시니 그에게 존귀와 영원한 능력을 돌릴지어다 아멘","딤전 6:17":"네가 이 세대에 부한 자들을 명하여 마음을 높이지 말고 정함이 없는 재물에 소망을 두지 말고 오직 우리에게 모든 것을 후히 주사 누리게 하시는 하나님께 두며","시 90:2":"산이 생기기 전, 땅과 세계도 주께서 조성하시기 전 곧 영원부터 영원까지 주는 하나님이시니이다","창 1:1":"태초에 하나님이 천지를 창조하시니라 !","계 4:11":"`우리 주 하나님이여 영광과 존귀와 능력을 받으시는 것이 합당하오니 주께서 만물을 지으신지라 만물이 주의 뜻대로 있었고 또 지으심을 받았나이다&#x27; 하더라","시 33:9":"저가 말씀하시매 이루었으며 명하시매 견고히 섰도다","롬 4:17":"기록된바 내가 너를 많은 민족의 조상으로 세웠다 하심과 같으니 그의 믿은바 하나님은 죽은 자를 살리시며 없는 것을 있는것 같이 부르시는 이시니라","롬 1:20":"창세로부터 그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성이 그 만드신 만물에 분명히 보여 알게 되나니 그러므로 저희가 핑계치 못할지니라","요 4:24":"하나님은 영이시니 예배하는 자가 신령과 진정으로 예배할지니라&#x27;","요일 4:16":"하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그 안에 거하시느니라","요일 1:5":"우리가 저에게서 듣고 너희에게 전하는 소식이 이것이니 곧 하나님은 빛이시라 그에게는 어두움이 조금도 없으시니라","엡 4:18":"저희 총명이 어두워지고 저희 가운데 있는 무지함과 저희 마음이 굳어짐으로 말미암아 하나님의 생명에서 떠나 있도다","요 17:22":"내게 주신 영광을 내가 저희에게 주었사오니 이는 우리가 하나가 된 것같이 저희도 하나가 되게 하려 함이니이다","벧전 1:16":"기록하였으되 내가 거룩하니 너희도 거룩할지어다 하셨느니라","딤후 4:8":"이제 후로는 나를 위하여 의의 면류관이 예비되었으므로 주 곧 의로우신 재판장이 그 날에 내게 주실 것이니 내게만 아니라 주의 나타나심을 사모하는 모든 자에게니라","시 89:14":"의와 공의가 주의 보좌의 기초라 인자함과 진실함이 주를 앞서 행하나이다","고전 1:9":"너희를 불러 그의 아들 예수 그리스도 우리 주로 더불어 교제케 하시는 하나님은 미쁘시도다","사 6:8":"내가 또 주의 목소리를 들은즉 이르시되 내가 누구를 보내며 누가 우리를 위하여 갈꼬 그 때에 내가 가로되 내가 여기 있나이다 나를 보내소서 !","마 28:19":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고","고전 8:6":"그러나 우리에게는 한 하나님 곧 아버지가 계시니 만물이 그에게서 났고 우리도 그를 위하여 또한 한 주 예수 그리스도께서 계시니 만물이 그로 말미암고 우리도 그로 말미암았느니라","히 1:8":"아들에 관하여는 하나님이여 ! 주의 보좌가 영영하며 주의 나라의 홀은 공평한 홀이니이다","행 5:3–4":"베드로가 가로되 `아나니아야, 어찌하여 사단이 네 마음에 가득하여 네가 성령을 속이고 땅 값 얼마를 감추었느냐 ? 땅이 그대로 있을 때에는 네 땅이 아니며 판 후에도 네 임의로 할 수가 없더냐 어찌하여 이 일을 네 마음에 두었느냐 ? 사람에게 거짓말 한것이 아니요 하나님께로다&#x27;","사 9:6":"이는 한 아기가 우리에게 났고 한 아들을 우리에게 주신바 되었는데 그 어깨에는 정사를 메었고 그 이름은 기묘자라 모사라 전능하신 하나님이라 영존하시는 아버지라 평강의 왕이라 할것임이라","히 7:3":"아비도 없고 어미도 없고 족보도 없고 시작한 날도 없고 생명의 끝도 없어 하나님 아들과 방불하여 항상 제사장으로 있느니라","미 5:2":"베들레헴 에브라다야, 너는 유다 족속 중에 작을지라도 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라 그의 근본은 상고에 태초에니라","히 9:14":"하물며 영원하신 성령으로 말미암아 흠 없는 자기를 하나님께 드린 그리스도의 피가 어찌 너희 양심으로 죽은 행실에서 깨끗하게하고 살아계신 하나님을 섬기게 못하겠느뇨","마 3:16–17":"예수께서 세례를 받으시고 곧 물에서 올라오실새 하늘이 열리고 하나님의 성령이 비둘기같이 내려 자기 위에 임하심을 보시더니 하늘로서 소리가 있어 말씀하시되 `이는 내 사랑하는 아들이요 내 기뻐하는 자라&#x27; 하시니라","요 14:11":"내가 아버지 안에 있고 아버지께서 내 안에 계심을 믿으라 ! 그렇지 못하겠거든 행하는 그 일을 인하여 나를 믿으라","요 14:10":"나는 아버지 안에 있고 아버지는 내 안에 계신 것을 네가 믿지 아니하느냐 ? 내가 너희에게 이르는 말이 스스로 하는 것이 아니라 아버지께서 내 안에 계셔 그의 일을 하시는 것이라","요 10:30":"나와 아버지는 하나이니라&#x27; 하신대","요 8:29":"나를 보내신 이가 나와 함께 하시도다 내가 항상 그의 기뻐하시는 일을 행하므로 나를 혼자 두지 아니하셨느니라&#x27;","요 14:26":"보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치시고 내가 너희에게 말한 모든 것을 생각나게 하시리라","요 15:26":"내가 아버지께로서 너희에게 보낼 보혜사 곧 아버지께로서 나오시는 진리의 성령이 오실때에 그가 나를 증거하실 것이요","요 16:15":"무릇 아버지께 있는 것은 다 내 것이라 그러므로 내가 말하기를 그가 내 것을 가지고 너희에게 알리리라 하였노라","엡 2:18":"이는 저로 말미암아 우리 둘이 한 성령 안에서 아버지께 나아감을 얻게 하려 하심이라","고후 13:14":"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다 !","민 6:24–26":"여호와는 네게 복을 주시고 너를 지키시기를 원하며 여호와는 그 얼굴로 네게 비취사 은혜 베푸시기를 원하며 여호와는 그 얼굴을 네게로 향하여 드사 평강주시기를 원하노라 할지니라 하라","엡 1:9":"그 뜻의 비밀을 우리에게 알리셨으니 곧 그 기쁘심을 따라 그리스도 안에서 때가 찬 경륜(經綸)을 위하여 예정하신 것이니","엡 1:1":"하나님의 뜻으로 말미암아 그리스도 예수의 사도 된 바울은 에베소에 있는 성도들과 그리스도 예수 안에 신실한 자들에게 편지하노니","엡 3:11":"곧 영원부터 우리 주 그리스도 예수 안에서 예정하신 뜻대로 하신 것이라","엡 1:10":"하늘에 있는 것이나 땅에 있는 것이 다 그리스도 안에서 통일되게 하려 하심이라","엡 3:9":"영원부터 만물을 창조하신 하나님 속에 감취었던 비밀의 경륜이 어떠한 것을 드러내게 하려 하심이라","딤전 1:4":"신화와 끝없는 족보에 착념치 말게 하려 함이라 이런 것은 믿음 안에 있는 하나님의 경륜을 이룸보다 도리어 변론을 내는 것이라","요일 3:2":"사랑하는 자들아 ! 우리가 지금은 하나님의 자녀라 장래에 어떻게 될 것은 아직 나타나지 아니하였으나 그가 나타내심이 되면 우리가 그와 같을 줄을 아는 것은 그의 계신 그대로 볼 것을 인함이니","창 1:26":"하나님이 가라사대 우리의 형상을 따라 우리의 모양대로 우리가 사람을 만들고 그로 바다의 고기와, 공중의 새와, 육축과, 온 땅과, 땅에 기는 모든 것을 다스리게 하자 하시고","창 2:9":"여호와 하나님이 그 땅에서 보기에 아름답고 먹기에 좋은 나무가 나게 하시니 동산 가운데에는 생명나무와 선악을 알게하는 나무도 있더라","요 4:14":"내가 주는 물을 먹는 자는 영원히 목마르지 아니하리니 나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라&#x27;","롬 8:10":"또 그리스도께서 너희 안에 계시면 몸은 죄로 인하여 죽은 것이나 영은 의를 인하여 산 것이니라","롬 8:6":"육신의 생각은 사망이요 영의 생각은 생명과 평안이니라","롬 8:11":"예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라","고전 6:17":"주와 합하는 자는 한 영이니라","요일 4:13":"그의 성령을 우리에게 주시므로 우리가 그 안에 거하고 그가 우리 안에 거하시는 줄을 아느니라","엡 3:17–19":"믿음으로 말미암아 그리스도께서 너희 마음에 계시게 하옵시고 너희가 사랑 가운데서 뿌리가 박히고 터가 굳어져서 능히 모든 성도와 함께 지식에 넘치는 그리스도의 사랑을 알아 그 넓이와 길이와 높이와 깊이가 어떠함을 깨달아 하나님의 모든 충만하신 것으로 너희에게 충만하게 하시기를 구하노라","골 2:10":"너희도 그 안에서 충만하여졌으니 그는 모든 정사와 권세의 머리시라","엡 3:2":"너희를 위하여 내게 주신 하나님의 그 은혜의 경륜을 너희가 들었을 터이라","엡 3:7–8":"이 복음을 위하여 그의 능력이 역사하시는 대로 내게 주신 하나님의 은혜의 선물을 따라 내가 일군이 되었노라 모든 성도 중에 지극히 작은 자보다 더 작은 나에게 이 은혜를 주신 것은 측량할 수 없는 그리스도의 풍성을 이방인에게 전하게 하시고","골 1:25":"내가 교회 일군 된 것은 하나님이 너희를 위하여 내게 주신 경륜을 따라 하나님의 말씀을 이루려 함이니라"};

function removeVisibleKoreanPronunciations(){
  document.querySelectorAll('#content .greek').forEach(greek=>{
    const between=greek.nextSibling;
    if(!between||between.nodeType!==Node.TEXT_NODE)return;
    let next=between.nextSibling;
    while(next&&next.nodeType===Node.TEXT_NODE&&!next.textContent.trim())next=next.nextSibling;
    if(next&&next.nodeType===Node.ELEMENT_NODE&&next.classList.contains('roman')&&/[가-힣]/.test(between.textContent)){
      between.textContent=', ';
    }
  });
}

function speakText(text, btn){

function greekToKoreanKoine(text){
  const clean=text.normalize('NFD').replace(/([αεηιουω])\u0314/g,'ϙ$1').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const greekToRoman=word=>{
    word=word
      .replace(/γγ/g,'ng').replace(/γκ/g,'ng').replace(/γχ/g,'nch').replace(/γξ/g,'nx')
      .replace(/ου/g,'u').replace(/ευ/g,'Y').replace(/αυ/g,'au');
    const map={ϙ:'h',α:'a',β:'b',γ:'g',δ:'d',ε:'e',ζ:'z',η:'e',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
    return [...word].map(c=>map[c]??c).join('').replace(/Y/g,'Y');
  };
  const onset={g:'ㄱ',k:'ㅋ',n:'ㄴ',d:'ㄷ',t:'ㅌ',r:'ㄹ',l:'ㄹ',m:'ㅁ',b:'ㅂ',v:'ㅂ',p:'ㅍ',f:'ㅍ',s:'ㅅ',z:'ㅈ',j:'ㅈ',h:'ㅎ',ch:'ㅋ',th:'ㅌ'};
  const vowel={a:'ㅏ',e:'ㅔ',i:'ㅣ',o:'ㅗ',u:'ㅜ',y:'ㅟ',Y:'ㅠ'};
  const choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const jungseong=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const jongseong=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const syllable=(c,v,j='')=>String.fromCharCode(0xAC00+choseong.indexOf(c)*588+jungseong.indexOf(v)*28+jongseong.indexOf(j));
  const addFinal=(out,j)=>{
    if(!out)return out;
    const cp=out.charCodeAt(out.length-1);
    if(cp<0xAC00||cp>0xD7A3||(cp-0xAC00)%28)return out;
    return out.slice(0,-1)+String.fromCharCode(cp+jongseong.indexOf(j));
  };
  const romanToKo=roman=>{
    const units=roman.match(/th|ch|Y|[a-z]/g)||[];
    let out='';
    for(let i=0;i<units.length;i++){
      const x=units[i];
      if(vowel[x]){out+=syllable('ㅇ',vowel[x]);continue;}
      const c=onset[x]||'ㅇ', next=units[i+1];
      if(next&&vowel[next]){
        if(x==='l')out=addFinal(out,'ㄹ');
        out+=syllable(c,vowel[next]);i++;
      }
      else if((x==='n'||x==='m')&&(!next||!vowel[next]))out=addFinal(out,x==='n'?'ㄴ':'ㅁ');
      else if(x==='p'&&next==='l')out+=syllable(c,'ㅡ','ㄹ');
      else out+=syllable(c,'ㅡ');
    }
    return out;
  };
  return clean.split(/(\s+|[^α-ωϲϙ]+)/).map(part=>/^[α-ωϲϙ]+$/.test(part)?romanToKo(greekToRoman(part)):part).join('').replace(/\s+/g,' ').trim();
}
function hebrewToKoreanBiblical(text){
  const consonant={א:'',ב:'b',ג:'g',ד:'d',ה:'h',ו:'v',ז:'z',ח:'h',ט:'t',י:'y',כ:'k',ך:'k',ל:'l',מ:'m',ם:'m',נ:'n',ן:'n',ס:'s',ע:'',פ:'p',ף:'p',צ:'ts',ץ:'ts',ק:'k',ר:'r',ש:'sh',ת:'t'};
  const vowels={'ַ':'a','ָ':'a','ֶ':'e','ֵ':'e','ִ':'i','ֹ':'o','ֻ':'u','ְ':'e','ֲ':'a','ֱ':'e','ֳ':'o'};
  const onset={g:'ㄱ',k:'ㅋ',n:'ㄴ',d:'ㄷ',t:'ㅌ',r:'ㄹ',l:'ㄹ',m:'ㅁ',b:'ㅂ',v:'ㅂ',p:'ㅍ',f:'ㅍ',s:'ㅅ',z:'ㅈ',y:'ㅇ',h:'ㅎ',sh:'ㅅ',ts:'ㅊ'};
  const vowel={a:'ㅏ',e:'ㅔ',i:'ㅣ',o:'ㅗ',u:'ㅜ'};
  const choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const jungseong=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const syllable=(c,v)=>String.fromCharCode(0xAC00+choseong.indexOf(c)*588+jungseong.indexOf(v)*28);
  const wordToKo=word=>{
    const chars=[...word.normalize('NFD')];
    let out='';
    for(let i=0;i<chars.length;i++){
      const letter=chars[i];
      if(!(letter in consonant))continue;
      let c=consonant[letter], v='';
      let j=i+1;
      for(;j<chars.length&&/[\u0591-\u05C7]/.test(chars[j]);j++){
        if(vowels[chars[j]])v=vowels[chars[j]];
        if(letter==='ש'&&chars[j]==='ׂ')c='s';
      }
      if(letter==='ו'&&chars.slice(i+1,j).includes('ֹ'))c='';
      if(letter==='ו'&&chars.slice(i+1,j).includes('ּ')&&!v){c='';v='u';}
      const oc=onset[c]||'ㅇ';
      out+=syllable(oc,vowel[v]||'ㅡ');
      i=j-1;
    }
    return out;
  };
  return text.split(/(\s+|[^\u0590-\u05FF]+)/).map(part=>/[\u05D0-\u05EA]/.test(part)?wordToKo(part):part).join('').replace(/\s+/g,' ').trim();
}
function speakEconomyOriginal(index,btn,lang){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 원문 음성 읽기를 지원하지 않습니다.');return;}
  const temp=document.createElement('div');
  temp.innerHTML=ECONOMY_FULL_ORIGINALS[index]||'';
  const originalText=(temp.textContent||temp.innerText||'').replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
  if(!originalText)return;
  speechSynthesis.cancel();
  const isGreek=lang.toLowerCase().startsWith('el');
  const isHebrew=lang.toLowerCase().startsWith('he');
  const spokenText=isGreek?greekToKoreanKoine(originalText):isHebrew?hebrewToKoreanBiblical(originalText):originalText;
  const spokenLang=(isGreek||isHebrew)?'ko-KR':lang;
  const u=new SpeechSynthesisUtterance(spokenText);
  u.lang=spokenLang;
  const sel=btn.parentElement.querySelector('.speed');
  u.rate=parseFloat(sel?sel.value:.8);
  const prefix=spokenLang.toLowerCase().split('-')[0];
  const voices=speechSynthesis.getVoices();
  const matching=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));
  if(matching)u.voice=matching;
  speechSynthesis.speak(u);
}
function speakOriginalBox(btn){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 원문 음성 읽기를 지원하지 않습니다.');return;}
  const box=btn.closest('.engbox');
  const original=box&&box.querySelector('.greek-full');
  const title=(box&&box.querySelector('.greek-title')?.textContent||'').toUpperCase();
  if(!original)return;
  const originalText=(original.textContent||original.innerText||'').replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
  if(!originalText)return;
  const isHebrew=title.includes('HEBREW');
  const spokenText=isHebrew?hebrewToKoreanBiblical(originalText):greekToKoreanKoine(originalText);
  const spokenLang='ko-KR';
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(spokenText);
  u.lang=spokenLang;
  const sel=btn.parentElement.querySelector('.speed');
  u.rate=parseFloat(sel?sel.value:.8);
  const prefix=spokenLang.toLowerCase().split('-')[0];
  const voices=speechSynthesis.getVoices();
  const matching=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));
  if(matching)u.voice=matching;
  speechSynthesis.speak(u);
}
function speakOriginalWord(el){
  if(!('speechSynthesis' in window))return;
  const word=(el.dataset.word||el.textContent||'').replace(/[\d.,;:·—⸀⸂⸃()[\]]/g,'').trim();
  if(!word)return;
  const isHebrew=/[\u0590-\u05FF]/.test(word);
  const spoken=isHebrew?hebrewToKoreanBiblical(word):greekToKoreanKoine(word);
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(spoken);
  u.lang='ko-KR';u.rate=.72;
  const voices=speechSynthesis.getVoices();
  const ko=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
  if(ko)u.voice=ko;
  speechSynthesis.speak(u);
}

  document.querySelectorAll('#content .engbox').forEach(box=>{

    if(!original||!title||box.querySelector('button[onclick*="speakEconomyOriginal"],button[data-original-audio]'))return;

    const row=document.createElement('div');
    row.className='audio-row';
    row.innerHTML=`<button class="listen koine-listen" data-original-audio type="button">🔊 ${isHebrew?'히브리어 전체 구절 듣기':'코이네 헬라어 전체 구절 듣기'}</button><select class="speed" aria-label="원어 음성 속도"><option value=".65">0.65×</option><option value=".8" selected>0.8×</option><option value="1">1×</option></select>`;

  });
}
