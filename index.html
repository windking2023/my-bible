<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000 KEY BIBLE VERSES</title>
<style>


:root{--bg:#f6f7f9;--card:#fff;--text:#20242b;--muted:#69707d;--line:#e3e6eb;--blue:#1456c0;--red:#b42318;--green:#16803a;--dark:#111827}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.app{max-width:780px;margin:auto;padding:16px 13px 44px}
header{text-align:center;margin:6px 0 16px}
header h1{font-size:21px;margin:0 0 7px}.topic{font-size:25px;font-weight:850;color:var(--dark)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}
.tab{padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-weight:800;cursor:pointer}
.tab.active{background:var(--dark);color:white}.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 2px 9px rgba(0,0,0,.025)}
.numref{font-size:18px;font-weight:850;margin-bottom:12px}.verse{font-size:19px;line-height:1.9;word-break:keep-all}
.blue{color:var(--blue);font-weight:850}.greek{color:var(--red);font-weight:850}.paren{font-weight:900;color:#111}.roman{font-style:italic;font-weight:700}
.korean-easy{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
.korean-easy-title,.greek-title{font-size:13px;font-weight:850;color:var(--muted);margin-bottom:7px}.guide-note,.easy-note{font-size:12px;color:var(--muted);margin-top:7px;font-style:italic}
.english-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}
.engbox{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafafa}.engtitle{font-size:13px;font-weight:850;color:var(--muted);margin-bottom:7px}.engtext{font-size:16px;line-height:1.7}
.noun{color:var(--blue);font-weight:850}.verb{color:var(--red);font-weight:850}.greek-click{cursor:pointer;border-bottom:1px dotted currentColor}
.econ-noun{color:var(--blue);font-weight:850}.life,.life-word{color:var(--green);font-weight:900}
.greek-full{font-family:"Times New Roman","Noto Serif",serif;font-size:20px;line-height:1.75}
.audio-row{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}.listen{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 10px;font-weight:750;cursor:pointer}.speed{border:1px solid var(--line);border-radius:8px;padding:5px;background:white}.koine-listen{background:#5b21b6;color:#fff;border-color:#5b21b6;padding:10px 14px;font-size:14px;box-shadow:0 2px 7px rgba(91,33,182,.22)}
.study h3{font-size:17px;margin:0 0 9px}.study p{font-size:16px;line-height:1.7}
.lex-pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,520px);background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:16px;z-index:9999;display:none}
.lex-pop.show{display:block}.lex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lex-word{font-family:"Times New Roman","Noto Serif",serif;font-size:25px;font-weight:850}.lex-close{border:0;background:#f1f3f5;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}.lex-row{margin-top:8px;font-size:15px;line-height:1.55}.lex-label{font-weight:850;color:var(--muted)}
@media(max-width:580px){.english-grid{grid-template-columns:1fr}.verse{font-size:18px}.topic{font-size:23px}.greek-full{font-size:19px}}


.topic-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}
.topic-btn{padding:14px 12px;border:1px solid var(--line);border-radius:14px;background:white;font-weight:850;font-size:17px;cursor:pointer}
.topic-btn.active{background:var(--dark);color:white}
.topic-section{display:none}.topic-section.active{display:block}
.main-title{text-align:center;font-size:24px;font-weight:900;margin:4px 0 2px}
.main-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.back-top{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);backdrop-filter:blur(6px);padding:6px 0 4px}
@media(max-width:580px){.topic-picker{grid-template-columns:repeat(2,1fr);gap:6px}.topic-btn{font-size:14px;padding:12px 5px}}


.topic-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 10px}
.topic-btn,.subtab{padding:13px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:850;cursor:pointer}
.topic-btn.active,.subtab.active{background:var(--dark);color:#fff}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.main-title{text-align:center;font-size:23px;font-weight:900;margin:8px 0 4px}
.loading-note{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 12px}
</style>
</head>
<body>
<div class="app">
  <div class="main-title">1000 KEY BIBLE VERSES</div>
  <div class="topic-picker">
    <button class="topic-btn active" data-topic="truth">TRUTH</button>
    <button class="topic-btn" data-topic="scripture">THE BIBLE</button>
    <button class="topic-btn" data-topic="god">GOD</button>
    <button class="topic-btn" data-topic="economy">GOD'S ECONOMY</button>
    <button class="topic-btn" data-topic="christ">CHRIST</button>

    <button class="subtab active" data-view="verse">VERSE</button>
    <button class="subtab" data-view="study">STUDY</button>
  </div>
  <div id="content"></div>
</div>

<div id="lexPop" class="lex-pop" aria-live="polite">

    <div><div id="lexWord" class="lex-word"></div><div id="lexMeaning" class="lex-row"></div></div>
    <button class="lex-close" onclick="closeLex()">×</button>
  </div>

  <div class="lex-row"><span class="lex-label">Form:</span> <span id="lexForm"></span></div>
</div>

<script>
const DATA={"truth": {"verse": "<div class=\"card\">\n  <div class=\"numref\">1. 디모데전서 2:4</div>\n  <div class=\"verse\">\n    하나님은 모든 사람이 구원을 받으며\n    <span class=\"blue\">진리</span><span class=\"paren\">(</span><span class=\"greek\">ἀληθείας</span>, 알리시아스, <span class=\"roman\">alētheias</span><span class=\"paren\">)</span>를\n    <span class=\"blue\">온전히 아는 데</span><span class=\"paren\">(</span><span class=\"greek\">ἐπίγνωσιν</span>, 에피그노신, <span class=\"roman\">epignōsin</span><span class=\"paren\">)</span>\n    이르기를 원하십니다.\n  </div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">하나님은 모든 사람이 구원을 받으며 진리를 아는데 이르기를 원하시느니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“who desires that all men should be saved and come to [the] knowledge of [the] truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('who desires that all men should be saved and come to [the] knowledge of [the] truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“who wants everyone to be saved and to come to the knowledge of the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('who wants everyone to be saved and to come to the knowledge of the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God wants everyone to be saved and to fully understand the truth.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God wants everyone to be saved and to fully understand the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ὃς πάντας <span class=\"noun greek-click\" data-word=\"ἀνθρώπους\" data-meaning=\"people, human beings\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Accusative masculine plural\">ἀνθρώπους</span> <span class=\"verb greek-click\" data-word=\"θέλει\" data-meaning=\"desires, wants\" data-lemma=\"θέλω\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">θέλει</span> <span class=\"verb greek-click\" data-word=\"σωθῆναι\" data-meaning=\"to be saved\" data-lemma=\"σῴζω\" data-pos=\"Verb\" data-form=\"Aorist passive infinitive\">σωθῆναι</span> καὶ εἰς <span class=\"noun greek-click\" data-word=\"ἐπίγνωσιν\" data-meaning=\"full knowledge, recognition\" data-lemma=\"ἐπίγνωσις\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἐπίγνωσιν</span> <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span> <span class=\"verb greek-click\" data-word=\"ἐλθεῖν\" data-meaning=\"to come\" data-lemma=\"ἔρχομαι\" data-pos=\"Verb\" data-form=\"Aorist active infinitive\">ἐλθεῖν</span>.</div></div>\n\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">2. 요한복음 17:17</div>\n  <div class=\"verse\">\n    그들을 <span class=\"blue\">진리</span><span class=\"paren\">(</span><span class=\"greek\">ἀληθείᾳ</span>, 알리시아, <span class=\"roman\">alētheia</span><span class=\"paren\">)</span>\n    안에서 <span class=\"blue\">거룩하게 하여 주십시오</span><span class=\"paren\">(</span><span class=\"greek\">ἁγίασον</span>, 하기아손, <span class=\"roman\">hagiason</span><span class=\"paren\">)</span>.\n    아버지의 <span class=\"blue\">말씀</span><span class=\"paren\">(</span><span class=\"greek\">λόγος</span>, 로고스, <span class=\"roman\">logos</span><span class=\"paren\">)</span>은\n    <span class=\"blue\">진리</span><span class=\"paren\">(</span><span class=\"greek\">ἀλήθεια</span>, 알리시아, <span class=\"roman\">alētheia</span><span class=\"paren\">)</span>입니다.\n  </div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">저희를 진리로 거룩하게 하옵소서 ! 아버지의 말씀은 진리니이다 !</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Sanctify them by the truth: thy word is truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Sanctify them by the truth: thy word is truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Sanctify them by the truth; Your word is truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Sanctify them by the truth; Your word is truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Make them holy in the truth. Your word is truth.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Make them holy in the truth. Your word is truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\"><span class=\"verb greek-click\" data-word=\"ἁγίασον\" data-meaning=\"sanctify, make holy\" data-lemma=\"ἁγιάζω\" data-pos=\"Verb\" data-form=\"Aorist active imperative, 2nd singular\">ἁγίασον</span> αὐτοὺς ἐν τῇ <span class=\"noun greek-click\" data-word=\"ἀληθείᾳ\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">ἀληθείᾳ</span>· ὁ <span class=\"noun greek-click\" data-word=\"λόγος\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">λόγος</span> ὁ σὸς <span class=\"noun greek-click\" data-word=\"ἀλήθειά\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">ἀλήθειά</span> <span class=\"verb greek-click\" data-word=\"ἐστιν\" data-meaning=\"is\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστιν</span>.</div></div>\n\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">3. 요한복음 8:32</div>\n  <div class=\"verse\">\n    여러분이 <span class=\"blue\">진리</span><span class=\"paren\">(</span><span class=\"greek\">ἀλήθειαν</span>, 알리시안, <span class=\"roman\">alētheian</span><span class=\"paren\">)</span>를 알게 될 것이며,\n    그 <span class=\"blue\">진리</span><span class=\"paren\">(</span><span class=\"greek\">ἀλήθεια</span>, 알리시아, <span class=\"roman\">alētheia</span><span class=\"paren\">)</span>가\n    여러분을 <span class=\"blue\">자유롭게 할 것입니다</span><span class=\"paren\">(</span><span class=\"greek\">ἐλευθερώσει</span>, 엘레프세로세이, <span class=\"roman\">eleutherōsei</span><span class=\"paren\">)</span>.\n  </div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">진리를 알지니 진리가 너희를 자유케 하리라 !&#x27;</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“and ye shall know the truth, and the truth shall set you free.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('and ye shall know the truth, and the truth shall set you free.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Then you will know the truth, and the truth will set you free.””</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Then you will know the truth, and the truth will set you free.”', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">You will know the truth, and the truth will set you free.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('You will know the truth, and the truth will set you free.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">καὶ <span class=\"verb greek-click\" data-word=\"γνώσεσθε\" data-meaning=\"you will know\" data-lemma=\"γινώσκω\" data-pos=\"Verb\" data-form=\"Future middle indicative, 2nd plural\">γνώσεσθε</span> τὴν <span class=\"noun greek-click\" data-word=\"ἀλήθειαν\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀλήθειαν</span>, καὶ ἡ <span class=\"noun greek-click\" data-word=\"ἀλήθεια\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">ἀλήθεια</span> <span class=\"verb greek-click\" data-word=\"ἐλευθερώσει\" data-meaning=\"will set free, will liberate\" data-lemma=\"ἐλευθερόω\" data-pos=\"Verb\" data-form=\"Future active indicative, 3rd singular\">ἐλευθερώσει</span> ὑμᾶς.</div></div>\n\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">4. 에베소서 1:13</div>\n  <div class=\"verse\">\n    그분 안에서 여러분도 <span class=\"blue\">진리의 말씀</span><span class=\"paren\">(</span><span class=\"greek\">λόγον τῆς ἀληθείας</span>, 로곤 테스 알리시아스, <span class=\"roman\">logon tēs alētheias</span><span class=\"paren\">)</span>,\n    곧 여러분을 구원하는 복음을 듣고 그분 안에서 또한 믿어,\n    <span class=\"blue\">약속의 성령</span><span class=\"paren\">(</span><span class=\"greek\">πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ</span>, 프뉴마티 테스 에팡겔리아스 토 하기오, <span class=\"roman\">pneumati tēs epangelias tō hagiō</span><span class=\"paren\">)</span>으로\n    <span class=\"blue\">도장 찍혔습니다</span><span class=\"paren\">(</span><span class=\"greek\">ἐσφραγίσθητε</span>, 에스프라기스테, <span class=\"roman\">esphragisthēte</span><span class=\"paren\">)</span>.\n  </div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그 안에서 너희도 진리의 말씀 곧 너희의 구원의 복음을 듣고 그 안에서 또한 믿어 약속의 성령으로 인치심을 받았으니</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“in whom *ye* also [have trusted], having heard the word of the truth, the glad tidings of your salvation; in whom also, having believed, ye have been sealed with the Holy Spirit of promise,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('in whom *ye* also [have trusted], having heard the word of the truth, the glad tidings of your salvation; in whom also, having believed, ye have been sealed with the Holy Spirit of promise,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“And in Him, having heard and believed the word of truth—the gospel of your salvation—you were sealed with the promised Holy Spirit,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And in Him, having heard and believed the word of truth—the gospel of your salvation—you were sealed with the promised Holy Spirit,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">You heard the true message—the good news of your salvation. You believed in Christ, and God sealed you with the Holy Spirit He had promised.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('You heard the true message—the good news of your salvation. You believed in Christ, and God sealed you with the Holy Spirit He had promised.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐν ᾧ καὶ ὑμεῖς <span class=\"verb greek-click\" data-word=\"ἀκούσαντες\" data-meaning=\"having heard\" data-lemma=\"ἀκούω\" data-pos=\"Verb\" data-form=\"Aorist active participle, nominative masculine plural\">ἀκούσαντες</span> τὸν <span class=\"noun greek-click\" data-word=\"λόγον\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">λόγον</span> τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span>, τὸ <span class=\"noun greek-click\" data-word=\"εὐαγγέλιον\" data-meaning=\"gospel, good news\" data-lemma=\"εὐαγγέλιον\" data-pos=\"Noun\" data-form=\"Accusative neuter singular\">εὐαγγέλιον</span> τῆς <span class=\"noun greek-click\" data-word=\"σωτηρίας\" data-meaning=\"salvation\" data-lemma=\"σωτηρία\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">σωτηρίας</span> ὑμῶν, ἐν ᾧ καὶ <span class=\"verb greek-click\" data-word=\"πιστεύσαντες\" data-meaning=\"having believed\" data-lemma=\"πιστεύω\" data-pos=\"Verb\" data-form=\"Aorist active participle, nominative masculine plural\">πιστεύσαντες</span> <span class=\"verb greek-click\" data-word=\"ἐσφραγίσθητε\" data-meaning=\"you were sealed\" data-lemma=\"σφραγίζω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 2nd plural\">ἐσφραγίσθητε</span> τῷ <span class=\"noun greek-click\" data-word=\"πνεύματι\" data-meaning=\"spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">πνεύματι</span> τῆς <span class=\"noun greek-click\" data-word=\"ἐπαγγελίας\" data-meaning=\"promise\" data-lemma=\"ἐπαγγελία\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἐπαγγελίας</span> τῷ ἁγίῳ.</div></div>\n\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">5. 골로새서 1:5</div>\n  <div class=\"verse\">\n    여러분을 위하여 하늘에 쌓아 둔 <span class=\"blue\">소망</span><span class=\"paren\">(</span><span class=\"greek\">ἐλπίδα</span>, 엘피다, <span class=\"roman\">elpida</span><span class=\"paren\">)</span> 때문입니다.\n    여러분은 전에 <span class=\"blue\">복음의 진리의 말씀</span><span class=\"paren\">(</span><span class=\"greek\">λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου</span>, 로고 테스 알리시아스 투 유앙겔리우, <span class=\"roman\">logō tēs alētheias tou euangeliou</span><span class=\"paren\">)</span>에서\n    이 소망에 관하여 들었습니다.\n  </div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">너희를 위하여 하늘에 쌓아 둔 소망을 인함이니 곧 너희가 전에 복음 진리의 말씀을 들은 것이라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“on account of the hope which [is] laid up for you in the heavens; of which ye heard before in the word of the truth of the glad tidings,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('on account of the hope which [is] laid up for you in the heavens; of which ye heard before in the word of the truth of the glad tidings,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“the faith and love proceeding from the hope stored up for you in heaven, of which you have already heard in the word of truth, the gospel”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('the faith and love proceeding from the hope stored up for you in heaven, of which you have already heard in the word of truth, the gospel', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Your faith and love grow from the hope God has kept for you in heaven. You first heard about this hope through the true message of the gospel.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Your faith and love grow from the hope God has kept for you in heaven. You first heard about this hope through the true message of the gospel.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">διὰ τὴν <span class=\"noun greek-click\" data-word=\"ἐλπίδα\" data-meaning=\"hope\" data-lemma=\"ἐλπίς\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἐλπίδα</span> τὴν <span class=\"verb greek-click\" data-word=\"ἀποκειμένην\" data-meaning=\"laid up, stored, reserved\" data-lemma=\"ἀπόκειμαι\" data-pos=\"Verb\" data-form=\"Present middle/passive participle, accusative feminine singular\">ἀποκειμένην</span> ὑμῖν ἐν τοῖς <span class=\"noun greek-click\" data-word=\"οὐρανοῖς\" data-meaning=\"heavens\" data-lemma=\"οὐρανός\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">οὐρανοῖς</span>, ἣν <span class=\"verb greek-click\" data-word=\"προηκούσατε\" data-meaning=\"you heard before\" data-lemma=\"προακούω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 2nd plural\">προηκούσατε</span> ἐν τῷ <span class=\"noun greek-click\" data-word=\"λόγῳ\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">λόγῳ</span> τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span> τοῦ <span class=\"noun greek-click\" data-word=\"εὐαγγελίου\" data-meaning=\"gospel, good news\" data-lemma=\"εὐαγγέλιον\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">εὐαγγελίου</span>.</div></div>\n\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">6. 데살로니가후서 2:13</div>\n\n  <div class=\"verse\">\n    그러나 주님께 사랑받는 형제 여러분, 우리는 여러분 때문에 항상 하나님께 감사드려야 합니다.\n    왜냐하면 하나님께서 여러분을 처음부터 선택하시어,\n    <span class=\"blue\">그 영의 거룩하게 하심</span><span class=\"paren\">(</span><span class=\"greek\">ἁγιασμῷ πνεύματος</span>, 하기아스모 프뉴마토스, <span class=\"roman\">hagiasmō pneumatos</span><span class=\"paren\">)</span>과\n    <span class=\"blue\">진리를 믿는 것</span><span class=\"paren\">(</span><span class=\"greek\">πίστει ἀληθείας</span>, 피스테이 알리시아스, <span class=\"roman\">pistei alētheias</span><span class=\"paren\">)</span>을 통하여\n    구원에 이르게 하셨기 때문입니다.\n  </div>\n\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">주의 사랑하시는 형제들아 ! 우리가 항상 너희를 위하여 마땅히 하나님께 감사할 것은 하나님이 처음부터 너희를 택하사 성령의 거룩하게 하심과 진리를 믿음으로 구원을 얻게 하심이니</div></div>\n\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“But we ought to give thanks to God always for you, brethren beloved of [the] Lord, that God has chosen you from [the] beginning to salvation in sanctification of [the] Spirit and belief of [the] truth:”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But we ought to give thanks to God always for you, brethren beloved of [the] Lord, that God has chosen you from [the] beginning to salvation in sanctification of [the] Spirit and belief of [the] truth:', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“But we should always thank God for you, brothers who are loved by the Lord, because God chose you from the beginning to be saved by the sanctification of the Spirit and by faith in the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But we should always thank God for you, brothers who are loved by the Lord, because God chose you from the beginning to be saved by the sanctification of the Spirit and by faith in the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\">\n      <div class=\"engtitle\">EASY ENGLISH — MEANING</div>\n      <div class=\"engtext\">We should always thank God for you, because the Lord loves you. God chose you for salvation: the Spirit makes you holy, and you believe the truth.</div>\n      <div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div>\n      <div class=\"audio-row\">\n        <button class=\"listen\" onclick=\"speakText('We should always thank God for you, because the Lord loves you. God chose you for salvation: the Spirit makes you holy, and you believe the truth.', this)\">🔊 Listen</button>\n        <select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select>\n      </div>\n    </div>\n\n    <div class=\"engbox\">\n      <div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div>\n      <div class=\"greek-full\">\n        Ἡμεῖς δὲ\n        <span class=\"verb greek-click\" data-word=\"ὀφείλομεν\" data-meaning=\"we ought, we are obligated\" data-lemma=\"ὀφείλω\" data-pos=\"Verb\" data-form=\"Present active indicative, 1st plural\">ὀφείλομεν</span>\n        <span class=\"verb greek-click\" data-word=\"εὐχαριστεῖν\" data-meaning=\"to give thanks\" data-lemma=\"εὐχαριστέω\" data-pos=\"Verb\" data-form=\"Present active infinitive\">εὐχαριστεῖν</span>\n        τῷ <span class=\"noun greek-click\" data-word=\"θεῷ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">θεῷ</span>\n        πάντοτε περὶ ὑμῶν,\n        <span class=\"noun greek-click\" data-word=\"ἀδελφοὶ\" data-meaning=\"brothers, brothers and sisters\" data-lemma=\"ἀδελφός\" data-pos=\"Noun\" data-form=\"Vocative masculine plural\">ἀδελφοὶ</span>\n        <span class=\"verb greek-click\" data-word=\"ἠγαπημένοι\" data-meaning=\"beloved, having been loved\" data-lemma=\"ἀγαπάω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, vocative masculine plural\">ἠγαπημένοι</span>\n        ὑπὸ <span class=\"noun greek-click\" data-word=\"κυρίου\" data-meaning=\"Lord\" data-lemma=\"κύριος\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">κυρίου</span>,\n        ὅτι <span class=\"verb greek-click\" data-word=\"εἵλατο\" data-meaning=\"chose, selected\" data-lemma=\"αἱρέομαι\" data-pos=\"Verb\" data-form=\"Aorist middle indicative, 3rd singular\">εἵλατο</span>\n        ὑμᾶς ὁ <span class=\"noun greek-click\" data-word=\"θεὸς\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">θεὸς</span>\n        <span class=\"noun greek-click\" data-word=\"ἀπαρχὴν\" data-meaning=\"firstfruits, first portion\" data-lemma=\"ἀπαρχή\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀπαρχὴν</span>\n        εἰς <span class=\"noun greek-click\" data-word=\"σωτηρίαν\" data-meaning=\"salvation\" data-lemma=\"σωτηρία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">σωτηρίαν</span>\n        ἐν <span class=\"noun greek-click\" data-word=\"ἁγιασμῷ\" data-meaning=\"sanctification, holiness\" data-lemma=\"ἁγιασμός\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">ἁγιασμῷ</span>\n        <span class=\"noun greek-click\" data-word=\"πνεύματος\" data-meaning=\"Spirit, spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">πνεύματος</span>\n        καὶ <span class=\"noun greek-click\" data-word=\"πίστει\" data-meaning=\"faith, belief\" data-lemma=\"πίστις\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">πίστει</span>\n        <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span>.\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <div class=\"numref\">7. 야고보서 1:18</div>\n  <div class=\"verse\">\n    아버지는 자신의 뜻에 따라\n    <span class=\"blue\">진리의 말씀</span><span class=\"paren\">(</span><span class=\"greek\">λόγῳ ἀληθείας</span>, 로고 알리시아스, <span class=\"roman\">logō alētheias</span><span class=\"paren\">)</span>으로\n    우리를 <span class=\"blue\">낳으셨습니다</span><span class=\"paren\">(</span><span class=\"greek\">ἀπεκύησεν</span>, 아페퀴에센, <span class=\"roman\">apekyēsen</span><span class=\"paren\">)</span>.\n    그것은 우리가 그분께서 창조하신 것들 가운데\n    <span class=\"blue\">첫 열매</span><span class=\"paren\">(</span><span class=\"greek\">ἀπαρχήν</span>, 아파르켄, <span class=\"roman\">aparchēn</span><span class=\"paren\">)</span>이\n    되도록 하시려는 것이었습니다.\n  </div>\n\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그가 그 조물 중에 우리로 한 첫 열매가 되게 하시려고 자기의 뜻을 좇아 진리의 말씀으로 우리를 낳으셨느니라</div></div>\n\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“According to his own will begat he us by the word of truth, that we should be a certain first-fruits of *his* creatures.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('According to his own will begat he us by the word of truth, that we should be a certain first-fruits of *his* creatures.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“He chose to give us birth through the word of truth, that we would be a kind of firstfruits of His creation.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('He chose to give us birth through the word of truth, that we would be a kind of firstfruits of His creation.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\">\n      <div class=\"engtitle\">EASY ENGLISH — MEANING</div>\n      <div class=\"engtext\">God chose to give us new life through the <strong>word of truth</strong>, so that we would be like the <strong>firstfruits of His creation</strong>.</div>\n      <div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div>\n      <div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God chose to give us new life through the word of truth, so that we would be like the firstfruits of His creation.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n    </div>\n\n    <div class=\"engbox\">\n      <div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div>\n      <div class=\"greek-full\">\n        <span class=\"verb greek-click\" data-word=\"βουληθεὶς\" data-meaning=\"having willed, having chosen\" data-lemma=\"βούλομαι\" data-pos=\"Verb (participle)\" data-form=\"Aorist passive-form (deponent) participle, nominative masculine singular\">βουληθεὶς</span>\n        <span class=\"verb greek-click\" data-word=\"ἀπεκύησεν\" data-meaning=\"he brought forth, gave birth to\" data-lemma=\"ἀποκυέω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">ἀπεκύησεν</span>\n        ἡμᾶς <span class=\"noun greek-click\" data-word=\"λόγῳ\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">λόγῳ</span>\n        <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span>,\n        εἰς τὸ <span class=\"verb greek-click\" data-word=\"εἶναι\" data-meaning=\"to be\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active infinitive\">εἶναι</span>\n        ἡμᾶς <span class=\"noun greek-click\" data-word=\"ἀπαρχήν\" data-meaning=\"firstfruits, first portion\" data-lemma=\"ἀπαρχή\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀπαρχήν</span>\n        τινα τῶν αὐτοῦ <span class=\"noun greek-click\" data-word=\"κτισμάτων\" data-meaning=\"creatures, created things\" data-lemma=\"κτίσμα\" data-pos=\"Noun\" data-form=\"Genitive neuter plural\">κτισμάτων</span>.\n      </div>\n    </div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <div class=\"numref\">8. 디모데후서 2:15</div>\n  <div class=\"verse\">\n    그대는 <span class=\"blue\">진리의 말씀</span><span class=\"paren\">(</span><span class=\"greek\">τὸν λόγον τῆς ἀληθείας</span>, 톤 로곤 테스 알리시아스, <span class=\"roman\">ton logon tēs alētheias</span><span class=\"paren\">)</span>을\n    <span class=\"blue\">올바르게 해석하여</span><span class=\"paren\">(</span><span class=\"greek\">ὀρθοτομοῦντα</span>, 오르토토문타, <span class=\"roman\">orthotomounta</span><span class=\"paren\">)</span>,\n    부끄러울 것이 없는 일꾼으로 하나님께 인정받는 사람이 되도록 힘쓰십시오.\n  </div>\n\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">네가 진리의 말씀을 옳게 분변하여 부끄러울 것이 없는 일군으로 인정된 자로 자신을 하나님 앞에 드리기를 힘쓰라</div></div>\n\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Strive diligently to present thyself approved to God, a workman that has not to be ashamed, cutting in a straight line the word of truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Strive diligently to present thyself approved to God, a workman that has not to be ashamed, cutting in a straight line the word of truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Make every effort to present yourself approved to God, an unashamed workman who accurately handles the word of truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Make every effort to present yourself approved to God, an unashamed workman who accurately handles the word of truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n\n    <div class=\"engbox\">\n      <div class=\"engtitle\">EASY ENGLISH — MEANING</div>\n      <div class=\"engtext\">Work hard to be approved by God. Be a worker with nothing to be ashamed of, <strong>handling the word of truth accurately and correctly</strong>.</div>\n      <div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div>\n      <div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Work hard to be approved by God. Be a worker with nothing to be ashamed of, handling the word of truth accurately and correctly.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div>\n    </div>\n\n    <div class=\"engbox\">\n      <div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div>\n      <div class=\"greek-full\">\n        <span class=\"verb greek-click\" data-word=\"σπούδασον\" data-meaning=\"be diligent, make every effort\" data-lemma=\"σπουδάζω\" data-pos=\"Verb\" data-form=\"Aorist active imperative, 2nd singular\">σπούδασον</span>\n        σεαυτὸν <span class=\"verb greek-click\" data-word=\"παραστῆσαι\" data-meaning=\"to present, to show\" data-lemma=\"παρίστημι\" data-pos=\"Verb\" data-form=\"Aorist active infinitive\">παραστῆσαι</span>\n        δόκιμον τῷ <span class=\"noun greek-click\" data-word=\"θεῷ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">θεῷ</span>,\n        <span class=\"noun greek-click\" data-word=\"ἐργάτην\" data-meaning=\"worker, workman\" data-lemma=\"ἐργάτης\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">ἐργάτην</span>\n        ἀνεπαίσχυντον,\n        <span class=\"verb greek-click\" data-word=\"ὀρθοτομοῦντα\" data-meaning=\"cutting straight; handling correctly\" data-lemma=\"ὀρθοτομέω\" data-pos=\"Verb (participle)\" data-form=\"Present active participle, accusative masculine singular\">ὀρθοτομοῦντα</span>\n        τὸν <span class=\"noun greek-click\" data-word=\"λόγον\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">λόγον</span>\n        τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span>.\n      </div>\n    </div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n<div class=\"numref\">9. 데살로니가후서 2:10</div>\n<div class=\"verse\">불의의 온갖 속임수로 멸망하는 사람들을 속일 것입니다. 그들이 멸망하는 것은 구원받기 위하여 <span class='blue'>진리를 사랑하는 것</span><span class='paren'>(</span><span class='greek'>τὴν ἀγάπην τῆς ἀληθείας</span>, 텐 아가펜 테스 알리시아스, <span class='roman'>tēn agapēn tēs alētheias</span><span class='paren'>)</span>을 받아들이지 않았기 때문입니다.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">불의의 모든 속임으로 멸망하는 자들에게 임하리니 이는 저희가 진리의 사랑을 받지 아니하여 구원함을 얻지 못함이니라</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“and in all deceit of unrighteousness to them that perish, because they have not received the love of the truth that they might be saved.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('and in all deceit of unrighteousness to them that perish, because they have not received the love of the truth that they might be saved.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“and with every wicked deception directed against those who are perishing, because they refused the love of the truth that would have saved them.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('and with every wicked deception directed against those who are perishing, because they refused the love of the truth that would have saved them.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Those who are perishing refused to welcome and love the truth that could lead them to salvation.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Those who are perishing refused to welcome and love the truth that could lead them to salvation.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐν πάσῃ <span class=\"noun greek-click\" data-word=\"ἀπάτῃ\" data-meaning=\"deceit, deception\" data-lemma=\"ἀπάτη\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">ἀπάτῃ</span> <span class=\"noun greek-click\" data-word=\"ἀδικίας\" data-meaning=\"unrighteousness, wrongdoing\" data-lemma=\"ἀδικία\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀδικίας</span> τοῖς <span class=\"verb greek-click\" data-word=\"ἀπολλυμένοις\" data-meaning=\"those who are perishing\" data-lemma=\"ἀπόλλυμι\" data-pos=\"Verb (participle)\" data-form=\"Present middle participle, dative masculine plural\">ἀπολλυμένοις</span>, ἀνθ’ ὧν τὴν <span class=\"noun greek-click\" data-word=\"ἀγάπην\" data-meaning=\"love\" data-lemma=\"ἀγάπη\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀγάπην</span> τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span> οὐκ <span class=\"verb greek-click\" data-word=\"ἐδέξαντο\" data-meaning=\"they received, welcomed\" data-lemma=\"δέχομαι\" data-pos=\"Verb\" data-form=\"Aorist middle indicative, 3rd plural\">ἐδέξαντο</span> εἰς τὸ <span class=\"verb greek-click\" data-word=\"σωθῆναι\" data-meaning=\"to be saved\" data-lemma=\"σῴζω\" data-pos=\"Verb\" data-form=\"Aorist passive infinitive\">σωθῆναι</span> αὐτούς.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">10. 잠언 23:23</div>\n<div class=\"verse\"><span class='blue'>진리</span>를 사고서 팔지 마십시오. 지혜와 훈계와 명철도 그렇게 하십시오.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">진리를 사고서 팔지 말며 지혜와 훈계와 명철도 그리할지니라</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Buy the truth, and sell it not; wisdom, and instruction, and intelligence.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Buy the truth, and sell it not; wisdom, and instruction, and intelligence.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Invest in truth and never sell it—in wisdom and instruction and understanding.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Invest in truth and never sell it—in wisdom and instruction and understanding.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Value truth so highly that you are willing to pay for it, and never trade it away. Treasure wisdom, instruction, and understanding too.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Value truth so highly that you are willing to pay for it, and never trade it away. Treasure wisdom, instruction, and understanding too.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div>\n        <div class=\"greek-full\" style=\"direction:rtl;text-align:right\">אֱמֶת קְנֵה וְאַל־תִּמְכֹּר חָכְמָה וּמוּסָר וּבִינָה</div>\n        <div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Proverbs is Old Testament, so the original-language text is Hebrew rather than Greek.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">11. 베드로전서 1:22</div>\n<div class=\"verse\">여러분이 <span class='blue'>진리에 순종하여</span><span class='paren'>(</span><span class='greek'>ἐν τῇ ὑπακοῇ τῆς ἀληθείας</span>, 엔 테 휘파코에 테스 알리시아스, <span class='roman'>en tē hypakoē tēs alētheias</span><span class='paren'>)</span> 여러분의 혼을 정결하게 하여 거짓 없는 형제 사랑에 이르렀으니, 순수한 마음으로 서로 뜨겁게 사랑하십시오.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">너희가 진리를 순종함으로 너희 영혼을 깨끗하게 하여 거짓이 없이 형제를 사랑하기에 이르렀으니 마음으로 뜨겁게 피차 사랑하라 !</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Having purified your souls by obedience to the truth to unfeigned brotherly love, love one another out of a pure heart fervently;”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Having purified your souls by obedience to the truth to unfeigned brotherly love, love one another out of a pure heart fervently;', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Since you have purified your souls by obedience to the truth so that you have a genuine love for your brothers, love one another deeply, from a pure heart.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Since you have purified your souls by obedience to the truth so that you have a genuine love for your brothers, love one another deeply, from a pure heart.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Obeying the truth purifies your life and leads to sincere love. So love one another deeply and genuinely.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Obeying the truth purifies your life and leads to sincere love. So love one another deeply and genuinely.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">Τὰς <span class=\"noun greek-click\" data-word=\"ψυχὰς\" data-meaning=\"souls, lives\" data-lemma=\"ψυχή\" data-pos=\"Noun\" data-form=\"Accusative feminine plural\">ψυχὰς</span> ὑμῶν <span class=\"verb greek-click\" data-word=\"ἡγνικότες\" data-meaning=\"having purified\" data-lemma=\"ἁγνίζω\" data-pos=\"Verb (participle)\" data-form=\"Perfect active participle, nominative masculine plural\">ἡγνικότες</span> ἐν τῇ <span class=\"noun greek-click\" data-word=\"ὑπακοῇ\" data-meaning=\"obedience\" data-lemma=\"ὑπακοή\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">ὑπακοῇ</span> τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span> εἰς <span class=\"noun greek-click\" data-word=\"φιλαδελφίαν\" data-meaning=\"brotherly love\" data-lemma=\"φιλαδελφία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">φιλαδελφίαν</span> ἀνυπόκριτον, ἐκ καθαρᾶς <span class=\"noun greek-click\" data-word=\"καρδίας\" data-meaning=\"heart\" data-lemma=\"καρδία\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">καρδίας</span> ἀλλήλους <span class=\"verb greek-click\" data-word=\"ἀγαπήσατε\" data-meaning=\"love!\" data-lemma=\"ἀγαπάω\" data-pos=\"Verb\" data-form=\"Aorist active imperative, 2nd plural\">ἀγαπήσατε</span> ἐκτενῶς.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">12. 요한삼서 4</div>\n<div class=\"verse\">나는 나의 자녀들이 <span class='blue'>진리 안에서 행하고 있다</span><span class='paren'>(</span><span class='greek'>ἐν ἀληθείᾳ περιπατοῦντα</span>, 엔 알리시아 페리파툰타, <span class='roman'>en alētheia peripatounta</span><span class='paren'>)</span>는 말을 듣는 것보다 더 큰 기쁨이 없습니다.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">내가 내 자녀들이 진리 안에서 행한다 함을 듣는 것보다 더 즐거움이 없도다</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“I have no greater joy than these things that I hear of my children walking in the truth.”</div><div class=\"audio-row\ te, fully equipped for every good work.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Scripture prepares God's people to be mature and fully ready to do every kind of good work.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Scripture prepares God\\'s people to be mature and fully ready to do every kind of good work.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἵνα ἄρτιος <span class=\"verb greek-click\" data-word=\"ᾖ\" data-meaning=\"may be\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active subjunctive, 3rd singular\">ᾖ</span> ὁ τοῦ <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> <span class=\"noun greek-click\" data-word=\"ἄνθρωπος\" data-meaning=\"man, person\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">ἄνθρωπος</span>, πρὸς πᾶν <span class=\"noun greek-click\" data-word=\"ἔργον\" data-meaning=\"work, deed\" data-lemma=\"ἔργον\" data-pos=\"Noun\" data-form=\"Accusative neuter singular\">ἔργον</span> ἀγαθὸν <span class=\"verb greek-click\" data-word=\"ἐξηρτισμένος\" data-meaning=\"fully equipped, thoroughly prepared\" data-lemma=\"ἐξαρτίζω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, nominative masculine singular\">ἐξηρτισμένος</span>.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">14. 요한일서 1:6</div>\n<div class=\"verse\">우리가 하나님과 교통을 갖는다고 말하면서 어둠 가운데 행한다면, 우리는 <span class='blue'>거짓말을 하는 것</span>이며 <span class='blue'>진리를 행하지 않는 것</span><span class='paren'>(</span><span class='greek'>οὐ ποιοῦμεν τὴν ἀλήθειαν</span>, 우 포이우멘 텐 알리시안, <span class='roman'>ou poioumen tēn alētheian</span><span class='paren'>)</span>입니다.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">만일 우리가 하나님과 사귐이 있다 하고 어두운 가운데 행하면 거짓말을 하고 진리를 행치 아니함이거니와</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“If we say that we have fellowship with him, and walk in darkness, we lie, and do not practise the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('If we say that we have fellowship with him, and walk in darkness, we lie, and do not practise the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“If we say we have fellowship with Him yet walk in the darkness, we lie and do not practice the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('If we say we have fellowship with Him yet walk in the darkness, we lie and do not practice the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">If we claim to share life with God but keep living in darkness, our words are false. We are not living out the truth.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('If we claim to share life with God but keep living in darkness, our words are false. We are not living out the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐὰν <span class=\"verb greek-click\" data-word=\"εἴπωμεν\" data-meaning=\"we say\" data-lemma=\"λέγω\" data-pos=\"Verb\" data-form=\"Aorist active subjunctive, 1st plural\">εἴπωμεν</span> ὅτι <span class=\"noun greek-click\" data-word=\"κοινωνίαν\" data-meaning=\"fellowship, sharing\" data-lemma=\"κοινωνία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">κοινωνίαν</span> <span class=\"verb greek-click\" data-word=\"ἔχομεν\" data-meaning=\"we have\" data-lemma=\"ἔχω\" data-pos=\"Verb\" data-form=\"Present active indicative, 1st plural\">ἔχομεν</span> μετ’ αὐτοῦ καὶ ἐν τῷ <span class=\"noun greek-click\" data-word=\"σκότει\" data-meaning=\"darkness\" data-lemma=\"σκότος\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">σκότει</span> <span class=\"verb greek-click\" data-word=\"περιπατῶμεν\" data-meaning=\"we walk, live\" data-lemma=\"περιπατέω\" data-pos=\"Verb\" data-form=\"Present active subjunctive, 1st plural\">περιπατῶμεν</span>, <span class=\"verb greek-click\" data-word=\"ψευδόμεθα\" data-meaning=\"we lie\" data-lemma=\"ψεύδομαι\" data-pos=\"Verb\" data-form=\"Present middle indicative, 1st plural\">ψευδόμεθα</span> καὶ οὐ <span class=\"verb greek-click\" data-word=\"ποιοῦμεν\" data-meaning=\"we do, practice\" data-lemma=\"ποιέω\" data-pos=\"Verb\" data-form=\"Present active indicative, 1st plural\">ποιοῦμεν</span> τὴν <span class=\"noun greek-click\" data-word=\"ἀλήθειαν\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀλήθειαν</span>.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">15. 베드로후서 1:12</div>\n<div class=\"verse\">그러므로 여러분이 이러한 것들을 알고 있고 또 여러분이 가진 <span class='blue'>현재의 진리</span><span class='paren'>(</span><span class='greek'>τῇ παρούσῃ ἀληθείᾳ</span>, 테 파루세 알리시아, <span class='roman'>tē parousē alētheia</span><span class='paren'>)</span> 안에서 견고하게 되었지만, 나는 항상 여러분에게 이러한 것들을 일깨워 주려고 합니다.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">이러므로 너희가 이것을 알고 이미 있는 진리에 섰으나 내가 항상 너희로 생각하게 하려 하노라</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Wherefore I will be careful to put you always in mind of these things, although knowing [them] and established in the present truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Wherefore I will be careful to put you always in mind of these things, although knowing [them] and established in the present truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Therefore I will always remind you of these things, even though you know them and are established in the truth you now have.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Therefore I will always remind you of these things, even though you know them and are established in the truth you now have.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">You already know these truths and stand firmly in them, but I will keep reminding you so that you do not forget.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('You already know these truths and stand firmly in them, but I will keep reminding you so that you do not forget.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">Διὸ <span class=\"verb greek-click\" data-word=\"μελλήσω\" data-meaning=\"I will be ready, I intend\" data-lemma=\"μέλλω\" data-pos=\"Verb\" data-form=\"Future active indicative, 1st singular\">μελλήσω</span> ἀεὶ ὑμᾶς <span class=\"verb greek-click\" data-word=\"ὑπομιμνῄσκειν\" data-meaning=\"to remind\" data-lemma=\"ὑπομιμνῄσκω\" data-pos=\"Verb\" data-form=\"Present active infinitive\">ὑπομιμνῄσκειν</span> περὶ τούτων, καίπερ <span class=\"verb greek-click\" data-word=\"εἰδότας\" data-meaning=\"knowing\" data-lemma=\"οἶδα\" data-pos=\"Verb (participle)\" data-form=\"Perfect active participle, accusative masculine plural\">εἰδότας</span> καὶ <span class=\"verb greek-click\" data-word=\"ἐστηριγμένους\" data-meaning=\"having been established, strengthened\" data-lemma=\"στηρίζω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, accusative masculine plural\">ἐστηριγμένους</span> ἐν τῇ παρούσῃ <span class=\"noun greek-click\" data-word=\"ἀληθείᾳ\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">ἀληθείᾳ</span>.</div></div>\n</div></div>\n<div class=\"card\">\n<div class=\"numref\">16. 디모데전서 3:15</div>\n<div class=\"verse\">혹시 내가 늦어지더라도, 그대가 <span class='blue'>하나님의 집</span>에서 어떻게 처신해야 하는지를 알도록 하려는 것입니다. 이 집은 살아 계신 하나님의 교회요, <span class='blue'>진리의 기둥과 기반</span><span class='paren'>(</span><span class='greek'>στῦλος καὶ ἑδραίωμα τῆς ἀληθείας</span>, 스튈로스 카이 헤드라이오마 테스 알리시아스, <span class='roman'>stylos kai hedraiōma tēs alētheias</span><span class='paren'>)</span>입니다.</div>\n<div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">만일 내가 지체하면 너로 하나님의 집에서 어떻게 행하여야 할 것을 알게 하려 함이니 이 집은 살아계신 하나님의 교회요 진리의 기둥과 터이니라</div></div>\n<div class=\"english-grid\">\n<div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“but if I delay, in order that thou mayest know how one ought to conduct oneself in God's house, which is [the] assembly of [the] living God, [the] pillar and base of the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('but if I delay, in order that thou mayest know how one ought to conduct oneself in God&apos;s house, which is [the] assembly of [the] living God, [the] pillar and base of the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“in case I am delayed, so that you will know how each one must conduct himself in God’s household, which is the church of the living God, the pillar and foundation of the truth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('in case I am delayed, so that you will know how each one must conduct himself in God’s household, which is the church of the living God, the pillar and foundation of the truth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">The church is God's household. It is meant to hold up, support, and display the truth in the world.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('The church is God\\'s household. It is meant to hold up, support, and display the truth in the world.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐὰν δὲ <span class=\"verb greek-click\" data-word=\"βραδύνω\" data-meaning=\"I delay\" data-lemma=\"βραδύνω\" data-pos=\"Verb\" data-form=\"Present active subjunctive, 1st singular\">βραδύνω</span>, ἵνα <span class=\"verb greek-click\" data-word=\"εἰδῇς\" data-meaning=\"you may know\" data-lemma=\"οἶδα\" data-pos=\"Verb\" data-form=\"Perfect active subjunctive, 2nd singular\">εἰδῇς</span> πῶς <span class=\"verb greek-click\" data-word=\"δεῖ\" data-meaning=\"it is necessary, one ought\" data-lemma=\"δεῖ\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular (impersonal)\">δεῖ</span> ἐν <span class=\"noun greek-click\" data-word=\"οἴκῳ\" data-meaning=\"house, household\" data-lemma=\"οἶκος\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">οἴκῳ</span> <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> <span class=\"verb greek-click\" data-word=\"ἀναστρέφεσθαι\" data-meaning=\"to conduct oneself, behave\" data-lemma=\"ἀναστρέφω\" data-pos=\"Verb\" data-form=\"Present middle infinitive\">ἀναστρέφεσθαι</span>, ἥτις <span class=\"verb greek-click\" data-word=\"ἐστὶν\" data-meaning=\"is\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστὶν</span> <span class=\"noun greek-click\" data-word=\"ἐκκλησία\" data-meaning=\"church, assembly\" data-lemma=\"ἐκκλησία\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">ἐκκλησία</span> <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> ζῶντος, <span class=\"noun greek-click\" data-word=\"στῦλος\" data-meaning=\"pillar\" data-lemma=\"στῦλος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">στῦλος</span> καὶ <span class=\"noun greek-click\" data-word=\"ἑδραίωμα\" data-meaning=\"support, foundation, buttress\" data-lemma=\"ἑδραίωμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">ἑδραίωμα</span> τῆς <span class=\"noun greek-click\" data-word=\"ἀληθείας\" data-meaning=\"truth\" data-lemma=\"ἀλήθεια\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀληθείας</span>.</div></div>\n</div></div>", "study": "<div class=\"card study\">\n<h3>STUDY — TRUTH 1–16</h3>\n<p>각 성구를 <strong>원어 → DARBY/BSB 비교 → 문맥 → 본문이 분명히 말하는 것 → 해석적 주의</strong> 순서로 살펴봅니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>1. 딤전 2:4</h3>\n<p><strong>① 핵심 원어</strong><br>ἐπίγνωσις는 단순한 정보 이상의 ‘충분한/온전한 앎’을 뜻할 수 있고, ἀλήθεια는 ‘진리’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>바울은 모든 사람을 위한 기도와 하나님의 구원 의지를 말합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님은 모든 사람이 구원받고 진리를 아는 데 이르기를 원하십니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절은 하나님의 구원 의지를 분명히 말하지만 예정론·보편구원론의 모든 세부를 이 한 절만으로 해결하지는 않습니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>2. 요 17:17</h3>\n<p><strong>① 핵심 원어</strong><br>ἁγίασον은 ‘거룩하게 하소서’, ἀλήθεια는 ‘진리’, λόγος는 ‘말씀’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>예수님의 대제사장적 기도에서 제자들을 세상 가운데 보내시며 보호와 거룩함을 구하는 부분입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>아버지의 말씀은 진리이며, 제자들의 거룩하게 됨이 그 진리와 연결됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘말씀=진리’라는 선언은 강력하지만, 특정 주석이나 한 사역자의 해석까지 동일하게 진리라고 만드는 근거는 아닙니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>3. 요 8:32</h3>\n<p><strong>① 핵심 원어</strong><br>γνώσεσθε는 ‘너희가 알게 될 것이다’, ἐλευθερώσει는 ‘자유롭게 할 것이다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>8:31의 ‘내 말에 거하면 참으로 내 제자’라는 조건과 직접 연결됩니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>예수님의 말씀에 거하는 제자는 진리를 알고, 그 진리가 자유롭게 합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>일반적 지식이나 모든 종류의 ‘진실’이 자동으로 자유를 준다는 격언으로 문맥을 분리해서는 안 됩니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>4. 엡 1:13</h3>\n<p><strong>① 핵심 원어</strong><br>λόγος τῆς ἀληθείας는 ‘진리의 말씀’, σφραγίζω는 ‘인치다/도장 찍다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>그리스도 안에서 받은 영적 복을 찬양하는 긴 문장 속에서 복음을 듣고 믿은 이들의 성령의 인침을 말합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>진리의 말씀은 구원의 복음과 연결되며, 믿는 이들은 약속의 성령으로 인침을 받습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘인침’의 모든 체험적 단계나 특정 교회적 표지를 이 구절에 추가하는 것은 본문 밖의 해석입니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>5. 골 1:5</h3>\n<p><strong>① 핵심 원어</strong><br>λόγος τῆς ἀληθείας τοῦ εὐαγγελίου는 문자적으로 ‘복음의 진리의 말씀’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>바울은 골로새 성도들의 믿음과 사랑이 하늘에 쌓인 소망과 연결됨을 감사하고 있습니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>그들이 들은 복음은 ‘진리의 말씀’으로 묘사됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>문법적 구조 차이에서 서로 다른 복음 내용을 만들어내기보다 두 번역이 같은 복음을 가리킨다는 점을 먼저 보아야 합니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>6. 살후 2:13</h3>\n<p><strong>① 핵심 원어</strong><br>ἁγιασμός는 ‘거룩하게 함’, πίστις ἀληθείας는 ‘진리에 대한 믿음/진리를 믿음’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>불법의 사람과 미혹을 말한 뒤, 바울은 사랑받는 성도들의 구원에 대해 감사로 전환합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>구원은 성령의 거룩하게 하심과 진리를 믿는 것과 연결됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘처음부터’와 ‘첫 열매로’의 차이는 중요한 본문비평 문제이므로 한 번역만 보고 원문이 확정적이라고 말하지 않는 것이 좋습니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>7. 약 1:18</h3>\n<p><strong>① 핵심 원어</strong><br>λόγος ἀληθείας는 ‘진리의 말씀’, ἀπεκύησεν은 ‘낳으셨다/생명을 주셨다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>하나님께서는 시험의 근원이 아니라 좋은 선물을 주시는 분이라는 문맥입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님은 자신의 뜻에 따라 진리의 말씀으로 우리를 낳으셨고 첫 열매가 되게 하셨습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘낳으심’을 한 특정 체험 용어 체계에만 제한하기보다 야고보의 새 생명과 첫 열매 이미지를 그대로 보아야 합니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>8. 딤후 2:15</h3>\n<p><strong>① 핵심 원어</strong><br>ὀρθοτομέω는 문자적으로 ‘곧게 자르다’에서 ‘바르게 다루다’라는 뜻으로 발전합니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>말다툼과 헛된 말을 피하고 하나님께 인정받는 일꾼이 되라는 권면입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>진리의 말씀은 부끄럽지 않은 일꾼에 의해 정확하고 바르게 다루어져야 합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘cutting straight’를 임의의 성경 구분 체계나 특정 시대 구분법의 직접 명령으로 만드는 것은 과도할 수 있습니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>9. 살후 2:10</h3>\n<p><strong>① 핵심 원어</strong><br>ἀγάπη τῆς ἀληθείας는 ‘진리에 대한 사랑/진리의 사랑’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>불법의 사람의 미혹과 멸망하는 자들의 반응을 설명합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>멸망하는 자들의 문제는 구원에 이르게 하는 진리의 사랑을 받아들이지 않았다는 것입니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>단순히 교리 지식이 부족하다는 의미보다 진리에 대한 도덕적·영적 거부가 강조됩니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>10. 잠 23:23</h3>\n<p><strong>① 핵심 원어</strong><br>히브리어 אֱמֶת (’emet)는 ‘진리, 신실함’, קְנֵה는 ‘사라/얻으라’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>지혜의 교훈 모음에서 진리·지혜·훈계·명철의 가치를 강조합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>진리는 값을 치르고서라도 얻고 결코 팔아버리지 말아야 할 귀한 것입니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘사라’는 실제 돈으로 진리를 구매하라는 뜻이 아니라 지혜문학적 가치 표현입니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>11. 벧전 1:22</h3>\n<p><strong>① 핵심 원어</strong><br>ὑπακοή τῆς ἀληθείας는 ‘진리에 대한 순종’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>거듭남과 말씀, 형제 사랑이 함께 연결되는 문맥입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>진리에 순종함은 혼의 정결과 거짓 없는 형제 사랑으로 이어집니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>진리를 단순한 지적 정답 목록으로 축소하면 베드로가 말하는 순종과 사랑의 열매를 놓칩니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>12. 요삼 4</h3>\n<p><strong>① 핵심 원어</strong><br>περιπατεῖν ἐν ἀληθείᾳ는 ‘진리 안에서 걷다/살다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>요한은 가이오와 성도들의 신실한 삶을 기뻐합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>진리는 단지 믿는 내용이 아니라 실제로 그 안에서 걸어가는 삶과 연결됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘진리 안에서 행함’을 특정 단체에 속하거나 특정 용어를 사용하는 것으로 좁혀서는 안 됩니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>13. 딤후 3:17</h3>\n<p><strong>① 핵심 원어</strong><br>ἄρτιος는 ‘온전한/적합한’, ἐξηρτισμένος는 ‘충분히 갖추어진’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>16절의 성경의 유익이 어떤 목적을 이루는지 설명하는 결과절입니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>성경은 하나님의 사람을 모든 선한 일을 위해 충분히 갖추게 합니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>성경의 충분성을 말할 때도 교사·교회·지혜의 역할을 부정하는 방식으로 과도하게 확대할 필요는 없습니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>14. 요일 1:6</h3>\n<p><strong>① 핵심 원어</strong><br>ποιεῖν τὴν ἀλήθειαν은 문자적으로 ‘진리를 행하다’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>빛이신 하나님과의 교통을 말하며 말과 실제 삶의 불일치를 경고합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>하나님과 교통한다고 말하면서 어둠 가운데 살면 거짓말이며 진리를 행하는 것이 아닙니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>진리는 여기서 교리적 정확성뿐 아니라 빛 가운데 사는 윤리적 실제를 포함합니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>15. 벧후 1:12</h3>\n<p><strong>① 핵심 원어</strong><br>παροῦσα ἀλήθεια는 ‘현재 있는/너희와 함께 있는 진리’라는 뜻입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>베드로는 이미 알고 확립된 성도들에게 계속 기억나게 하겠다고 합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>성도들은 이미 받은 진리 안에 굳게 서 있었지만 반복적인 상기가 필요했습니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>‘present truth’를 시대마다 새로 갱신되는 독점적 교리나 한 사역자의 최신 가르침이라는 기술 용어로 만드는 것은 본문보다 훨씬 나아간 해석입니다.</p>\n</div>\n\n<div class=\"card study-item\">\n<h3>16. 딤전 3:15</h3>\n<p><strong>① 핵심 원어</strong><br>στῦλος는 ‘기둥’, ἑδραίωμα는 ‘지지대/기반’, ἀλήθεια는 ‘진리’입니다.</p>\n<p><strong>② DARBY ↔ BSB</strong><br>Darby의 직역적 표현과 BSB의 현대적 표현을 원문과 문맥에 비추어 비교합니다.</p>\n<p><strong>③ 문맥</strong><br>바울은 디모데가 하나님의 집, 곧 살아 계신 하나님의 교회 안에서 어떻게 처신해야 하는지 말합니다.</p>\n<p><strong>④ 본문이 분명히 말하는 것</strong><br>교회는 진리를 떠받치고 지지하는 기둥과 기반으로 묘사됩니다.</p>\n<p><strong>⑤ 해석할 때 주의할 점</strong><br>이 구절은 교회가 진리를 만들어낸다거나 특정 교회 조직의 모든 주장이 무오하다는 뜻이 아닙니다. 교회의 역할은 주어진 진리를 지지하고 나타내는 것입니다.</p>\n</div>"}, "scripture": {"verse": "<div class=\"card\">\n  <div class=\"numref\">1. 디모데후서 3:16–17</div>\n  <div class=\"verse\">모든 <span class='blue'>성경</span><span class='paren'>(</span><span class='greek'>γραφὴ</span>, 그라페, <span class='roman'>graphē</span><span class='paren'>)</span>은 <span class='blue'>하나님께서 숨을 내쉬신 것</span><span class='paren'>(</span><span class='greek'>θεόπνευστος</span>, 테오프뉴스토스, <span class='roman'>theopneustos</span><span class='paren'>)</span>으로서, 가르치고 책망하고 바로잡고 의로 교육하는 데에 유익합니다. 성경은 하나님의 사람을 온전하게 하며, 모든 선한 일을 위하여 충분히 준비되게 합니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니 이는 하나님의 사람으로 온전케 하며 모든 선한 일을 행하기에 온전케 하려 함이니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Every scripture [is] divinely inspired, and profitable for teaching, for conviction, for correction, for instruction in righteousness; that the man of God may be complete, fully fitted to every good work.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Every scripture [is] divinely inspired, and profitable for teaching, for conviction, for correction, for instruction in righteousness; that the man of God may be complete, fully fitted to every good work.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“All Scripture is God-breathed and is useful for instruction, for conviction, for correction, and for training in righteousness, so that the man of God may be complete, fully equipped for every good work.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('All Scripture is God-breathed and is useful for instruction, for conviction, for correction, and for training in righteousness, so that the man of God may be complete, fully equipped for every good work.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">All Scripture comes from God and prepares God's people to know what is right and to do every good work.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('All Scripture comes from God and prepares God\\'s people to know what is right and to do every good work.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">πᾶσα <span class=\"noun greek-click\" data-word=\"γραφὴ\" data-meaning=\"Scripture, writing\" data-lemma=\"γραφή\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">γραφὴ</span> θεόπνευστος καὶ ὠφέλιμος πρὸς <span class=\"noun greek-click\" data-word=\"διδασκαλίαν\" data-meaning=\"teaching, instruction\" data-lemma=\"διδασκαλία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">διδασκαλίαν</span>, πρὸς <span class=\"noun greek-click\" data-word=\"ἐλεγμόν\" data-meaning=\"reproof, rebuke\" data-lemma=\"ἐλεγμός\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">ἐλεγμόν</span>, πρὸς <span class=\"noun greek-click\" data-word=\"ἐπανόρθωσιν\" data-meaning=\"correction, restoration\" data-lemma=\"ἐπανόρθωσις\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἐπανόρθωσιν</span>, πρὸς <span class=\"noun greek-click\" data-word=\"παιδείαν\" data-meaning=\"training, discipline\" data-lemma=\"παιδεία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">παιδείαν</span> τὴν ἐν <span class=\"noun greek-click\" data-word=\"δικαιοσύνῃ\" data-meaning=\"righteousness\" data-lemma=\"δικαιοσύνη\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">δικαιοσύνῃ</span>, ἵνα ἄρτιος <span class=\"verb greek-click\" data-word=\"ᾖ\" data-meaning=\"may be\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active subjunctive, 3rd singular\">ᾖ</span> ὁ τοῦ <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> <span class=\"noun greek-click\" data-word=\"ἄνθρωπος\" data-meaning=\"man, person\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">ἄνθρωπος</span>, πρὸς πᾶν <span class=\"noun greek-click\" data-word=\"ἔργον\" data-meaning=\"work, deed\" data-lemma=\"ἔργον\" data-pos=\"Noun\" data-form=\"Accusative ne
