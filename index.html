uter singular\">ἔργον</span> ἀγαθὸν <span class=\"verb greek-click\" data-word=\"ἐξηρτισμένος\" data-meaning=\"fully equipped, thoroughly prepared\" data-lemma=\"ἐξαρτίζω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, nominative masculine singular\">ἐξηρτισμένος</span>.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">2. 베드로후서 1:21</div>\n  <div class=\"verse\">왜냐하면 <span class='blue'>예언</span>은 결코 사람의 뜻에서 나온 것이 아니라, 사람들이 <span class='blue'>성령께 이끌려</span><span class='paren'>(</span><span class='greek'>ὑπὸ πνεύματος ἁγίου φερόμενοι</span>, 휘포 프뉴마토스 하기우 페로메노이, <span class='roman'>hypo pneumatos hagiou pheromenoi</span><span class='paren'>)</span> 하나님께 받아 말한 것이기 때문입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">예언은 언제든지 사람의 뜻으로 낸 것이 아니요 오직 성령의 감동하심을 입은 사람들이 하나님께 받아 말한 것임이니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“for prophecy was not ever uttered by [the] will of man, but holy men of God spake under the power of [the] Holy Spirit.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('for prophecy was not ever uttered by [the] will of man, but holy men of God spake under the power of [the] Holy Spirit.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“For no such prophecy was ever brought forth by the will of man, but men spoke from God as they were carried along by the Holy Spirit.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For no such prophecy was ever brought forth by the will of man, but men spoke from God as they were carried along by the Holy Spirit.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Biblical prophecy did not begin with human ideas. God spoke through people as the Holy Spirit carried them along.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Biblical prophecy did not begin with human ideas. God spoke through people as the Holy Spirit carried them along.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">οὐ γὰρ <span class=\"noun greek-click\" data-word=\"θελήματι\" data-meaning=\"will, desire\" data-lemma=\"θέλημα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">θελήματι</span> <span class=\"noun greek-click\" data-word=\"ἀνθρώπου\" data-meaning=\"man, human being\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">ἀνθρώπου</span> <span class=\"verb greek-click\" data-word=\"ἠνέχθη\" data-meaning=\"was brought, was carried\" data-lemma=\"φέρω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 3rd singular\">ἠνέχθη</span> <span class=\"noun greek-click\" data-word=\"προφητεία\" data-meaning=\"prophecy\" data-lemma=\"προφητεία\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">προφητεία</span> ποτέ, ἀλλὰ ὑπὸ <span class=\"noun greek-click\" data-word=\"πνεύματος\" data-meaning=\"Spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">πνεύματος</span> ἁγίου <span class=\"verb greek-click\" data-word=\"φερόμενοι\" data-meaning=\"being carried along\" data-lemma=\"φέρω\" data-pos=\"Verb (participle)\" data-form=\"Present passive participle, nominative masculine plural\">φερόμενοι</span> <span class=\"verb greek-click\" data-word=\"ἐλάλησαν\" data-meaning=\"they spoke\" data-lemma=\"λαλέω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd plural\">ἐλάλησαν</span> ἀπὸ <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> <span class=\"noun greek-click\" data-word=\"ἄνθρωποι\" data-meaning=\"people, men\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Nominative masculine plural\">ἄνθρωποι</span>.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">3. 마태복음 4:4</div>\n  <div class=\"verse\">예수님께서 대답하셨습니다. “성경에 ‘사람이 떡으로만 살 것이 아니라, <span class='blue'>하나님의 입에서 나오는 모든 말씀</span><span class='paren'>(</span><span class='greek'>παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ</span>, 판티 레마티 엑포류오메노 디아 스토마토스 테우, <span class='roman'>panti rhēmati ekporeuomenō dia stomatos theou</span><span class='paren'>)</span>으로 살아야 한다.’라고 기록되어 있다.”</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">예수께서 대답하여 가라사대 기록되었으되 사람이 떡으로만 살것이 아니요 하나님의 입으로 나오는 모든 말씀으로 살 것이라 하였느니라 하시니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“But he answering said, It is written, Man shall not live by bread alone, but by every word which goes out through God's mouth.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But he answering said, It is written, Man shall not live by bread alone, but by every word which goes out through God&apos;s mouth.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“But Jesus answered, “It is written: ‘Man shall not live on bread alone, but on every word that comes from the mouth of God.’””</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But Jesus answered, “It is written: ‘Man shall not live on bread alone, but on every word that comes from the mouth of God.’”', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Food keeps the body alive, but true life also depends on every word that comes from God.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Food keeps the body alive, but true life also depends on every word that comes from God.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ὁ δὲ <span class=\"verb greek-click\" data-word=\"ἀποκριθεὶς\" data-meaning=\"answering, having answered\" data-lemma=\"ἀποκρίνομαι\" data-pos=\"Verb (participle)\" data-form=\"Aorist passive-form (deponent) participle, nominative masculine singular\">ἀποκριθεὶς</span> <span class=\"verb greek-click\" data-word=\"εἶπεν\" data-meaning=\"he said\" data-lemma=\"λέγω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">εἶπεν</span>· <span class=\"verb greek-click\" data-word=\"γέγραπται\" data-meaning=\"it is written\" data-lemma=\"γράφω\" data-pos=\"Verb\" data-form=\"Perfect passive indicative, 3rd singular\">γέγραπται</span>· οὐκ ἐπ’ ἄρτῳ μόνῳ <span class=\"verb greek-click\" data-word=\"ζήσεται\" data-meaning=\"will live\" data-lemma=\"ζάω\" data-pos=\"Verb\" data-form=\"Future middle indicative, 3rd singular\">ζήσεται</span> ὁ <span class=\"noun greek-click\" data-word=\"ἄνθρωπος\" data-meaning=\"man, person\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">ἄνθρωπος</span>, ἀλλ’ ἐπὶ παντὶ <span class=\"noun greek-click\" data-word=\"ῥήματι\" data-meaning=\"word, utterance\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">ῥήματι</span> <span class=\"verb greek-click\" data-word=\"ἐκπορευομένῳ\" data-meaning=\"coming out, proceeding\" data-lemma=\"ἐκπορεύομαι\" data-pos=\"Verb (participle)\" data-form=\"Present middle participle, dative neuter singular\">ἐκπορευομένῳ</span> διὰ <span class=\"noun greek-click\" data-word=\"στόματος\" data-meaning=\"mouth\" data-lemma=\"στόμα\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">στόματος</span> <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span>.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">4. 시편 119:105</div>\n  <div class=\"verse\">주의 <span class='blue'>말씀</span>은 나의 발에 등이요, 나의 길에 빛입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">나의 영혼이 눌림을 인하여 녹사오니 주의 말씀대로 나를 세우소서</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“NUN. Thy word is a lamp unto my feet, and a light unto my path.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('NUN. Thy word is a lamp unto my feet, and a light unto my path.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Your word is a lamp to my feet and a light to my path.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Your word is a lamp to my feet and a light to my path.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's word shows me where to step and which way to go.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s word shows me where to step and which way to go.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">נֵר־לְרַגְלִי דְבָרֶךָ וְאוֹר לִנְתִיבָתִי</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">5. 에베소서 3:3, 5</div>\n  <div class=\"verse\">곧 계시로 그 <span class='blue'>비밀</span>이 나에게 알려졌다는 것입니다. … 이 비밀은 다른 세대에서는 사람의 아들들에게 알려지지 않았으나, 이제는 <span class='blue'>그분의 거룩한 사도들과 신언자들에게 영 안에서 계시되었습니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">곧 계시로 내게 비밀을 알게 하신 것은 내가 이미 대강 기록함과 같으니 이제 그의 거룩한 사도들과 선지자들에게 성령으로 나타내신 것같이 다른 세대에서는 사람의 아들들에게 알게 하지 아니하셨으니</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“that by revelation the mystery has been made known to me, (according as I have written before briefly,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('that by revelation the mystery has been made known to me, (according as I have written before briefly,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“that is, the mystery made known to me by revelation, as I have already written briefly.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('that is, the mystery made known to me by revelation, as I have already written briefly.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God revealed a mystery that had been hidden before. He made it known to Paul and then to His apostles and prophets by the Spirit.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God revealed a mystery that had been hidden before. He made it known to Paul and then to His apostles and prophets by the Spirit.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ὅτι κατὰ <span class=\"noun greek-click\" data-word=\"ἀποκάλυψιν\" data-meaning=\"revelation\" data-lemma=\"ἀποκάλυψις\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">ἀποκάλυψιν</span> <span class=\"verb greek-click\" data-word=\"ἐγνωρίσθη\" data-meaning=\"was made known\" data-lemma=\"γνωρίζω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 3rd singular\">ἐγνωρίσθη</span> μοι τὸ <span class=\"noun greek-click\" data-word=\"μυστήριον\" data-meaning=\"mystery\" data-lemma=\"μυστήριον\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">μυστήριον</span>... ὃ ἑτέραις <span class=\"noun greek-click\" data-word=\"γενεαῖς\" data-meaning=\"generations\" data-lemma=\"γενεά\" data-pos=\"Noun\" data-form=\"Dative feminine plural\">γενεαῖς</span> οὐκ <span class=\"verb greek-click\" data-word=\"ἐγνωρίσθη\" data-meaning=\"was made known\" data-lemma=\"γνωρίζω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 3rd singular\">ἐγνωρίσθη</span> τοῖς <span class=\"noun greek-click\" data-word=\"υἱοῖς\" data-meaning=\"sons\" data-lemma=\"υἱός\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">υἱοῖς</span> τῶν <span class=\"noun greek-click\" data-word=\"ἀνθρώπων\" data-meaning=\"people, human beings\" data-lemma=\"ἄνθρωπος\" data-pos=\"Noun\" data-form=\"Genitive masculine plural\">ἀνθρώπων</span> ὡς νῦν <span class=\"verb greek-click\" data-word=\"ἀπεκαλύφθη\" data-meaning=\"was revealed\" data-lemma=\"ἀποκαλύπτω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 3rd singular\">ἀπεκαλύφθη</span> τοῖς ἁγίοις <span class=\"noun greek-click\" data-word=\"ἀποστόλοις\" data-meaning=\"apostles\" data-lemma=\"ἀπόστολος\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">ἀποστόλοις</span> αὐτοῦ καὶ <span class=\"noun greek-click\" data-word=\"προφήταις\" data-meaning=\"prophets\" data-lemma=\"προφήτης\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">προφήταις</span> ἐν <span class=\"noun greek-click\" data-word=\"πνεύματι\" data-meaning=\"Spirit, spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">πνεύματι</span>.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">6. 히브리서 1:1–2</div>\n  <div class=\"verse\">하나님께서 옛날에는 신언자들을 통하여 여러 부분과 여러 방식으로 조상들에게 말씀하셨으나, 이 마지막 날들에는 <span class='blue'>아들 안에서 우리에게 말씀하셨습니다</span><span class='paren'>(</span><span class='greek'>ἐλάλησεν ἡμῖν ἐν υἱῷ</span>, 엘랄레센 헤민 엔 휘오, <span class='roman'>elalēsen hēmin en huiō</span><span class='paren'>)</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">옛적에 선지자들로 여러 부분과 여러 모양으로 우리 조상들에게 말씀하신 하나님이 이 모든 날 마지막에 아들로 우리에게 말씀하셨으니 이 아들을 만유의 후사로 세우시고 또 저로 말미암아 모든 세계를 지으셨느니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“God having spoken in many parts and in many ways formerly to the fathers in the prophets, at the end of these days has spoken to us in [the person of the] Son, whom he has established heir of all things, by whom also he made the worlds;”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God having spoken in many parts and in many ways formerly to the fathers in the prophets, at the end of these days has spoken to us in [the person of the] Son, whom he has established heir of all things, by whom also he made the worlds;', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“On many past occasions and in many different ways, God spoke to our fathers through the prophets. But in these last days He has spoken to us by His Son, whom He appointed heir of all things, and through whom He made the universe.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('On many past occasions and in many different ways, God spoke to our fathers through the prophets. But in these last days He has spoken to us by His Son, whom He appointed heir of all things, and through whom He made the universe.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God spoke through the prophets in the past, but now He has spoken to us through His Son.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God spoke through the prophets in the past, but now He has spoken to us through His Son.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ <span class=\"noun greek-click\" data-word=\"θεὸς\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">θεὸς</span> <span class=\"verb greek-click\" data-word=\"λαλήσας\" data-meaning=\"having spoken\" data-lemma=\"λαλέω\" data-pos=\"Verb (participle)\" data-form=\"Aorist active participle, nominative masculine singular\">λαλήσας</span> τοῖς <span class=\"noun greek-click\" data-word=\"πατράσιν\" data-meaning=\"fathers, ancestors\" data-lemma=\"πατήρ\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">πατράσιν</span> ἐν τοῖς <span class=\"noun greek-click\" data-word=\"προφήταις\" data-meaning=\"prophets\" data-lemma=\"προφήτης\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">προφήταις</span>, ἐπ’ ἐσχάτου τῶν <span class=\"noun greek-click\" data-word=\"ἡμερῶν\" data-meaning=\"days\" data-lemma=\"ἡμέρα\" data-pos=\"Noun\" data-form=\"Genitive feminine plural\">ἡμερῶν</span> τούτων <span class=\"verb greek-click\" data-word=\"ἐλάλησεν\" data-meaning=\"he spoke\" data-lemma=\"λαλέω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">ἐλάλησεν</span> ἡμῖν ἐν <span class=\"noun greek-click\" data-word=\"υἱῷ\" data-meaning=\"Son\" data-lemma=\"υἱός\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">υἱῷ</span>.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">7. 시편 119:140</div>\n  <div class=\"verse\">주의 <span class='blue'>말씀은 지극히 순수하므로</span>, 주의 종이 그것을 사랑합니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">나는 주를 경외하는 모든 자와 주의 법도를 지키는 자의 동무라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Thy word is exceeding pure, and thy servant loveth it.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Thy word is exceeding pure, and thy servant loveth it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Your promise is completely pure; therefore Your servant loves it.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Your promise is completely pure; therefore Your servant loves it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's word has been tested and proved pure, so His servant loves it.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s word has been tested and proved pure, so His servant loves it.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">צְרוּפָה אִמְרָתְךָ מְאֹד וְעַבְדְּךָ אֲהֵבָהּ</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div></div></div>\n<div class=\"card\">\n  <div class=\"numref\">8. 베드로전서 1:24–25</div>\n  <div class=\"verse\">“모든 육체는 풀과 같고, 그 모든 영광은 풀의 꽃과 같습니다. 풀은 마르고 꽃은 떨어지지만, <span class='blue'>주님의 말씀은 영원히 거합니다</span><span class='paren'>(</span><span class='greek'>τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα</span>, 토 데 레마 퀴리우 메네이 에이스 톤 아이오나, <span class='roman'>to de rhēma kyriou menei eis ton aiōna</span><span class='paren'>)</span>.” 이것이 여러분에게 복음으로 전해진 말씀입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그러므로 모든 육체는 풀과 같고 그 모든 영광이 풀의 꽃과 같으니 풀은 마르고 꽃은 떨어지되 오직 주의 말씀은 세세토록 있도다 하였으니 너희에게 전한 복음이 곧 이 말씀이니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Because all flesh [is] as grass, and all its glory as [the] flower of grass. The grass has withered and [its] flower has fallen; but the word of [the] Lord abides for eternity. But this is the word which in the glad tidings [is] preached to you.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Because all flesh [is] as grass, and all its glory as [the] flower of grass. The grass has withered and [its] flower has fallen; but the word of [the] Lord abides for eternity. But this is the word which in the glad tidings [is] preached to you.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“For, “All flesh is like grass, and all its glory like the flowers of the field; the grass withers and the flowers fall, but the word of the Lord stands forever.” And this is the word that was proclaimed to you.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For, “All flesh is like grass, and all its glory like the flowers of the field; the grass withers and the flowers fall, but the word of the Lord stands forever.” And this is the word that was proclaimed to you.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Human life fades like grass, but the Lord's word lasts forever. This lasting word is the good news that was preached to you.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Human life fades like grass, but the Lord\\'s word lasts forever. This lasting word is the good news that was preached to you.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n<div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">διότι πᾶσα <span class=\"noun greek-click\" data-word=\"σὰρξ\" data-meaning=\"flesh, humanity\" data-lemma=\"σάρξ\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">σὰρξ</span> ὡς <span class=\"noun greek-click\" data-word=\"χόρτος\" data-meaning=\"grass\" data-lemma=\"χόρτος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">χόρτος</span>, καὶ πᾶσα <span class=\"noun greek-click\" data-word=\"δόξα\" data-meaning=\"glory\" data-lemma=\"δόξα\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">δόξα</span> αὐτῆς ὡς <span class=\"noun greek-click\" data-word=\"ἄνθος\" data-meaning=\"flower\" data-lemma=\"ἄνθος\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">ἄνθος</span> χόρτου· <span class=\"verb greek-click\" data-word=\"ἐξηράνθη\" data-meaning=\"withered, dried up\" data-lemma=\"ξηραίνω\" data-pos=\"Verb\" data-form=\"Aorist passive indicative, 3rd singular\">ἐξηράνθη</span> ὁ χόρτος, καὶ τὸ ἄνθος <span class=\"verb greek-click\" data-word=\"ἐξέπεσεν\" data-meaning=\"fell off\" data-lemma=\"ἐκπίπτω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">ἐξέπεσεν</span>· τὸ δὲ <span class=\"noun greek-click\" data-word=\"ῥῆμα\" data-meaning=\"word, utterance\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">ῥῆμα</span> <span class=\"noun greek-click\" data-word=\"κυρίου\" data-meaning=\"Lord\" data-lemma=\"κύριος\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">κυρίου</span> <span class=\"verb greek-click\" data-word=\"μένει\" data-meaning=\"remains, abides\" data-lemma=\"μένω\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">μένει</span> εἰς τὸν <span class=\"noun greek-click\" data-word=\"αἰῶνα\" data-meaning=\"age, eternity\" data-lemma=\"αἰών\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">αἰῶνα</span>.</div></div></div></div>\n\n<div class=\"card\">\n  <div class=\"numref\">9. 마태복음 24:35</div>\n  <div class=\"verse\">하늘과 땅은 지나가겠지만, <span class='blue'>나의 말은 결코 지나가지 않을 것입니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">천지는 없어지겠으나 내 말은 없어지지 아니하리라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“The heaven and the earth shall pass away, but my words shall in no wise pass away.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('The heaven and the earth shall pass away, but my words shall in no wise pass away.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Heaven and earth will pass away, but My words will never pass away.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Heaven and earth will pass away, but My words will never pass away.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Everything in creation can pass away, but Jesus' words will never disappear.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Everything in creation can pass away, but Jesus\\' words will never disappear.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ὁ <span class=\"noun greek-click\" data-word=\"οὐρανὸς\" data-meaning=\"heaven, sky\" data-lemma=\"οὐρανός\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">οὐρανὸς</span> καὶ ἡ <span class=\"noun greek-click\" data-word=\"γῆ\" data-meaning=\"earth, land\" data-lemma=\"γῆ\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">γῆ</span> <span class=\"verb greek-click\" data-word=\"παρελεύσονται\" data-meaning=\"will pass away\" data-lemma=\"παρέρχομαι\" data-pos=\"Verb\" data-form=\"Future middle indicative, 3rd plural\">παρελεύσονται</span>, οἱ δὲ <span class=\"noun greek-click\" data-word=\"λόγοι\" data-meaning=\"words, sayings\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Nominative masculine plural\">λόγοι</span> μου οὐ μὴ <span class=\"verb greek-click\" data-word=\"παρέλθωσιν\" data-meaning=\"pass away\" data-lemma=\"παρέρχομαι\" data-pos=\"Verb\" data-form=\"Aorist active subjunctive, 3rd plural\">παρέλθωσιν</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">10. 마태복음 5:18</div>\n  <div class=\"verse\">진실로 내가 여러분에게 말합니다. 하늘과 땅이 없어지기 전에는 <span class='blue'>율법에서 가장 작은 한 글자나 한 획도 결코 없어지지 않을 것</span>입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">진실로 너희에게 이르노니 천지가 없어지기 전에는 율법의 일점 일획이라도 반드시 없어지지 아니하고 다 이루리라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“For verily I say unto you, Until the heaven and the earth pass away, one iota or one tittle shall in no wise pass from the law till all come to pass.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For verily I say unto you, Until the heaven and the earth pass away, one iota or one tittle shall in no wise pass from the law till all come to pass.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“For I tell you truly, until heaven and earth pass away, not a single jot, not a stroke of a pen, will disappear from the Law until everything is accomplished.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For I tell you truly, until heaven and earth pass away, not a single jot, not a stroke of a pen, will disappear from the Law until everything is accomplished.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Not even the smallest part of God's written word will fail before its purpose is fulfilled.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Not even the smallest part of God\\'s written word will fail before its purpose is fulfilled.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἀμὴν γὰρ <span class=\"verb greek-click\" data-word=\"λέγω\" data-meaning=\"I say\" data-lemma=\"λέγω\" data-pos=\"Verb\" data-form=\"Present active indicative, 1st singular\">λέγω</span> ὑμῖν· ἕως ἂν <span class=\"verb greek-click\" data-word=\"παρέλθῃ\" data-meaning=\"passes away\" data-lemma=\"παρέρχομαι\" data-pos=\"Verb\" data-form=\"Aorist active subjunctive, 3rd singular\">παρέλθῃ</span> ὁ <span class=\"noun greek-click\" data-word=\"οὐρανὸς\" data-meaning=\"heaven\" data-lemma=\"οὐρανός\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">οὐρανὸς</span> καὶ ἡ <span class=\"noun greek-click\" data-word=\"γῆ\" data-meaning=\"earth\" data-lemma=\"γῆ\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">γῆ</span>, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ <span class=\"verb greek-click\" data-word=\"παρέλθῃ\" data-meaning=\"passes away\" data-lemma=\"παρέρχομαι\" data-pos=\"Verb\" data-form=\"Aorist active subjunctive, 3rd singular\">παρέλθῃ</span> ἀπὸ τοῦ <span class=\"noun greek-click\" data-word=\"νόμου\" data-meaning=\"law\" data-lemma=\"νόμος\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">νόμου</span>, ἕως ἂν πάντα <span class=\"verb greek-click\" data-word=\"γένηται\" data-meaning=\"happen, come to pass\" data-lemma=\"γίνομαι\" data-pos=\"Verb\" data-form=\"Aorist middle subjunctive, 3rd singular\">γένηται</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">11. 이사야 40:22</div>\n  <div class=\"verse\">그분은 <span class='blue'>땅의 원 위에 앉아 계시며</span>, 땅의 주민들은 메뚜기와 같습니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그는 땅 위 궁창에 앉으시나니 땅의 거민들은 메뚜기 같으니라 그가 하늘을 차일 같이 펴셨으며 거할 천막 같이 베푸셨고</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“[It is] he that sitteth upon the circle of the earth, and the inhabitants thereof are as grasshoppers; that stretcheth out the heavens as a gauze curtain, and spreadeth them out as a tent to dwell in;”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('[It is] he that sitteth upon the circle of the earth, and the inhabitants thereof are as grasshoppers; that stretcheth out the heavens as a gauze curtain, and spreadeth them out as a tent to dwell in;', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“He sits enthroned above the circle of the earth; its dwellers are like grasshoppers. He stretches out the heavens like a curtain, and spreads them out like a tent to dwell in.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('He sits enthroned above the circle of the earth; its dwellers are like grasshoppers. He stretches out the heavens like a curtain, and spreads them out like a tent to dwell in.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God sits above the whole earth and rules over His creation.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God sits above the whole earth and rules over His creation.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">הַיֹּשֵׁב עַל־חוּג הָאָרֶץ וְיֹשְׁבֶיהָ כַּחֲגָבִים</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">12. 누가복음 24:27</div>\n  <div class=\"verse\">예수님은 모세와 모든 신언서에서부터 시작하여, <span class='blue'>성경 전체에서 자신에 관한 것들을 그들에게 설명해 주셨습니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">이에 모세와 및 모든 선지자의 글로 시작하여 모든 성경에 쓴바 자기에 관한 것을 자세히 설명하시니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“And having begun from Moses and from all the prophets, he interpreted to them in all the scriptures the things concerning himself.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And having begun from Moses and from all the prophets, he interpreted to them in all the scriptures the things concerning himself.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“And beginning with Moses and all the Prophets, He explained to them what was written in all the Scriptures about Himself.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And beginning with Moses and all the Prophets, He explained to them what was written in all the Scriptures about Himself.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Jesus showed the disciples how the whole Scripture points to Him.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Jesus showed the disciples how the whole Scripture points to Him.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">καὶ <span class=\"verb greek-click\" data-word=\"ἀρξάμενος\" data-meaning=\"beginning\" data-lemma=\"ἄρχομαι\" data-pos=\"Verb (participle)\" data-form=\"Aorist middle participle, nominative masculine singular\">ἀρξάμενος</span> ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν <span class=\"noun greek-click\" data-word=\"προφητῶν\" data-meaning=\"prophets\" data-lemma=\"προφήτης\" data-pos=\"Noun\" data-form=\"Genitive masculine plural\">προφητῶν</span> <span class=\"verb greek-click\" data-word=\"διερμήνευσεν\" data-meaning=\"he explained, interpreted\" data-lemma=\"διερμηνεύω\" data-pos=\"Verb\" data-form=\"Aorist active indicative, 3rd singular\">διερμήνευσεν</span> αὐτοῖς ἐν πάσαις ταῖς <span class=\"noun greek-click\" data-word=\"γραφαῖς\" data-meaning=\"Scriptures, writings\" data-lemma=\"γραφή\" data-pos=\"Noun\" data-form=\"Dative feminine plural\">γραφαῖς</span> τὰ περὶ ἑαυτοῦ.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">13. 누가복음 24:44</div>\n  <div class=\"verse\">모세의 율법과 신언서와 시편에 <span class='blue'>나에 관하여 기록된 모든 것이 이루어져야 합니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">또 이르시되 `내가 너희와 함께 있을 때에 너희에게 말한 바 곧 모세의 율법과 선지자의 글과 시편에 나를 가리켜 기록된 모든 것이 이루어져야 하리라 한 말이 이것이라&#x27; 하시고</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“And he said to them, These [are] the words which I spoke to you while I was yet with you, that all that is written concerning me in the law of Moses and prophets and psalms must be fulfilled.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And he said to them, These [are] the words which I spoke to you while I was yet with you, that all that is written concerning me in the law of Moses and prophets and psalms must be fulfilled.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Jesus said to them, “These are the words I spoke to you while I was still with you: Everything must be fulfilled that is written about Me in the Law of Moses, the Prophets, and the Psalms.””</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Jesus said to them, “These are the words I spoke to you while I was still with you: Everything must be fulfilled that is written about Me in the Law of Moses, the Prophets, and the Psalms.”', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Everything written about Jesus in the Old Testament had to be fulfilled.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Everything written about Jesus in the Old Testament had to be fulfilled.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\"><span class=\"verb greek-click\" data-word=\"δεῖ\" data-meaning=\"it is necessary, must\" data-lemma=\"δεῖ\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular impersonal\">δεῖ</span> <span class=\"verb greek-click\" data-word=\"πληρωθῆναι\" data-meaning=\"to be fulfilled\" data-lemma=\"πληρόω\" data-pos=\"Verb\" data-form=\"Aorist passive infinitive\">πληρωθῆναι</span> πάντα τὰ <span class=\"verb greek-click\" data-word=\"γεγραμμένα\" data-meaning=\"things written\" data-lemma=\"γράφω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, nominative neuter plural\">γεγραμμένα</span> ἐν τῷ <span class=\"noun greek-click\" data-word=\"νόμῳ\" data-meaning=\"law\" data-lemma=\"νόμος\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">νόμῳ</span> Μωϋσέως καὶ τοῖς <span class=\"noun greek-click\" data-word=\"προφήταις\" data-meaning=\"prophets\" data-lemma=\"προφήτης\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">προφήταις</span> καὶ <span class=\"noun greek-click\" data-word=\"ψαλμοῖς\" data-meaning=\"psalms\" data-lemma=\"ψαλμός\" data-pos=\"Noun\" data-form=\"Dative masculine plural\">ψαλμοῖς</span> περὶ ἐμοῦ.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">14. 로마서 10:8</div>\n  <div class=\"verse\">“그 <span class='blue'>말씀은 너에게 가까이 있어 네 입에 있고 네 마음에 있다</span>.”라고 하였습니다. 이것은 우리가 선포하는 믿음의 말씀입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그러면 무엇을 말하느뇨 말씀이 네게 가까와 네 입에 있으며 네 마음에 있다 하였으니 곧 우리가 전파하는 믿음의 말씀이라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“But what says it? The word is near thee, in thy mouth and in thy heart: that is, the word of faith, which we preach:”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But what says it? The word is near thee, in thy mouth and in thy heart: that is, the word of faith, which we preach:', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“But what does it say? “The word is near you; it is in your mouth and in your heart,” that is, the word of faith we are proclaiming:”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('But what does it say? “The word is near you; it is in your mouth and in your heart,” that is, the word of faith we are proclaiming:', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's message is not far away; it is near enough to be in your mouth and heart.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s message is not far away; it is near enough to be in your mouth and heart.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐγγύς σου τὸ <span class=\"noun greek-click\" data-word=\"ῥῆμά\" data-meaning=\"word, utterance\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">ῥῆμά</span> <span class=\"verb greek-click\" data-word=\"ἐστιν\" data-meaning=\"is\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστιν</span>, ἐν τῷ <span class=\"noun greek-click\" data-word=\"στόματί\" data-meaning=\"mouth\" data-lemma=\"στόμα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">στόματί</span> σου καὶ ἐν τῇ <span class=\"noun greek-click\" data-word=\"καρδίᾳ\" data-meaning=\"heart\" data-lemma=\"καρδία\" data-pos=\"Noun\" data-form=\"Dative feminine singular\">καρδίᾳ</span> σου· τοῦτ’ <span class=\"verb greek-click\" data-word=\"ἔστιν\" data-meaning=\"is\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἔστιν</span> τὸ <span class=\"noun greek-click\" data-word=\"ῥῆμα\" data-meaning=\"word\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">ῥῆμα</span> τῆς <span class=\"noun greek-click\" data-word=\"πίστεως\" data-meaning=\"faith\" data-lemma=\"πίστις\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">πίστεως</span> ὃ <span class=\"verb greek-click\" data-word=\"κηρύσσομεν\" data-meaning=\"we proclaim, preach\" data-lemma=\"κηρύσσω\" data-pos=\"Verb\" data-form=\"Present active indicative, 1st plural\">κηρύσσομεν</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">15. 로마서 10:17</div>\n  <div class=\"verse\">그러므로 믿음은 듣는 데서 생기고, 듣는 것은 <span class='blue'>그리스도의 말씀</span><span class='paren'>(</span><span class='greek'>ῥήματος Χριστοῦ</span>, 레마토스 크리스투, <span class='roman'>rhēmatos Christou</span><span class='paren'>)</span>을 통해 생깁니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“So faith then [is] by a report, but the report by God's word.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('So faith then [is] by a report, but the report by God&apos;s word.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Consequently, faith comes by hearing, and hearing by the word of Christ.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Consequently, faith comes by hearing, and hearing by the word of Christ.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Faith grows when we hear the message about Christ.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Faith grows when we hear the message about Christ.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἄρα ἡ <span class=\"noun greek-click\" data-word=\"πίστις\" data-meaning=\"faith\" data-lemma=\"πίστις\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">πίστις</span> ἐξ <span class=\"noun greek-click\" data-word=\"ἀκοῆς\" data-meaning=\"hearing, report\" data-lemma=\"ἀκοή\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">ἀκοῆς</span>, ἡ δὲ ἀκοὴ διὰ <span class=\"noun greek-click\" data-word=\"ῥήματος\" data-meaning=\"word, utterance\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">ῥήματος</span> <span class=\"noun greek-click\" data-word=\"Χριστοῦ\" data-meaning=\"Christ\" data-lemma=\"Χριστός\" data-pos=\"Noun/Title\" data-form=\"Genitive masculine singular\">Χριστοῦ</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">16. 베드로전서 1:23</div>\n  <div class=\"verse\">여러분이 거듭난 것은 썩을 씨로 된 것이 아니라 썩지 않을 씨로 된 것이며, <span class='blue'>살아 있고 항상 있는 하나님의 말씀</span>을 통하여 된 것입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">너희가 거듭난 것이 썩어질 씨로 된 것이 아니요 썩지 아니할 씨로 된 것이니 하나님의 살아 있고 항상 있는 말씀으로 되었느니라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“being born again, not of corruptible seed, but of incorruptible, by [the] living and abiding word of God.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('being born again, not of corruptible seed, but of incorruptible, by [the] living and abiding word of God.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“For you have been born again, not of perishable seed, but of imperishable, through the living and enduring word of God.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For you have been born again, not of perishable seed, but of imperishable, through the living and enduring word of God.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">You received new life through God's living and lasting word.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('You received new life through God\\'s living and lasting word.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\"><span class=\"verb greek-click\" data-word=\"ἀναγεγεννημένοι\" data-meaning=\"having been born again\" data-lemma=\"ἀναγεννάω\" data-pos=\"Verb (participle)\" data-form=\"Perfect passive participle, nominative masculine plural\">ἀναγεγεννημένοι</span> οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ <span class=\"noun greek-click\" data-word=\"λόγου\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">λόγου</span> <span class=\"verb greek-click\" data-word=\"ζῶντος\" data-meaning=\"living\" data-lemma=\"ζάω\" data-pos=\"Verb (participle)\" data-form=\"Present active participle, genitive masculine singular\">ζῶντος</span> <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> καὶ <span class=\"verb greek-click\" data-word=\"μένοντος\" data-meaning=\"remaining, abiding\" data-lemma=\"μένω\" data-pos=\"Verb (participle)\" data-form=\"Present active participle, genitive masculine singular\">μένοντος</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">17. 요한복음 6:63</div>\n  <div class=\"verse\"><span class='blue'>생명을 주시는 분은 그 영이십니다</span>. 육체는 무익합니다. 내가 여러분에게 한 말이 <span class='blue'>영이요 생명입니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">살리는 것은 영이니 육은 무익하니라 내가 너희에게 이른 말이 영이요 생명이라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“It is the Spirit which quickens, the flesh profits nothing: the words which I have spoken unto you are spirit and are life.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('It is the Spirit which quickens, the flesh profits nothing: the words which I have spoken unto you are spirit and are life.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“The Spirit gives life; the flesh profits nothing. The words I have spoken to you are spirit and they are life.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('The Spirit gives life; the flesh profits nothing. The words I have spoken to you are spirit and they are life.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">The Spirit gives real life. Jesus' words bring spirit and life to us.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('The Spirit gives real life. Jesus\\' words bring spirit and life to us.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">τὸ <span class=\"noun greek-click\" data-word=\"πνεῦμά\" data-meaning=\"Spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">πνεῦμά</span> <span class=\"verb greek-click\" data-word=\"ἐστιν\" data-meaning=\"is\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστιν</span> τὸ <span class=\"verb greek-click\" data-word=\"ζῳοποιοῦν\" data-meaning=\"giving life\" data-lemma=\"ζῳοποιέω\" data-pos=\"Verb (participle)\" data-form=\"Present active participle, nominative neuter singular\">ζῳοποιοῦν</span>, ἡ <span class=\"noun greek-click\" data-word=\"σὰρξ\" data-meaning=\"flesh\" data-lemma=\"σάρξ\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">σὰρξ</span> οὐκ <span class=\"verb greek-click\" data-word=\"ὠφελεῖ\" data-meaning=\"profits, helps\" data-lemma=\"ὠφελέω\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ὠφελεῖ</span> οὐδέν· τὰ <span class=\"noun greek-click\" data-word=\"ῥήματα\" data-meaning=\"words, utterances\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Nominative neuter plural\">ῥήματα</span> ἃ ἐγὼ <span class=\"verb greek-click\" data-word=\"λελάληκα\" data-meaning=\"I have spoken\" data-lemma=\"λαλέω\" data-pos=\"Verb\" data-form=\"Perfect active indicative, 1st singular\">λελάληκα</span> ὑμῖν <span class=\"noun greek-click\" data-word=\"πνεῦμά\" data-meaning=\"spirit\" data-lemma=\"πνεῦμα\" data-pos=\"Noun\" data-form=\"Nominative neuter singular\">πνεῦμά</span> <span class=\"verb greek-click\" data-word=\"ἐστιν\" data-meaning=\"are\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστιν</span> καὶ <span class=\"noun greek-click\" data-word=\"ζωή\" data-meaning=\"life\" data-lemma=\"ζωή\" data-pos=\"Noun\" data-form=\"Nominative feminine singular\">ζωή</span> <span class=\"verb greek-click\" data-word=\"ἐστιν\" data-meaning=\"are\" data-lemma=\"εἰμί\" data-pos=\"Verb\" data-form=\"Present active indicative, 3rd singular\">ἐστιν</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">18. 히브리서 4:12</div>\n  <div class=\"verse\"><span class='blue'>하나님의 말씀은 살아 있고 효력이 있으며</span>, 양날이 선 어떤 칼보다 더 날카로워 혼과 영, 관절과 골수를 찔러 쪼개기까지 하며 마음의 생각과 의도를 분별해 냅니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“For the word of God [is] living and operative, and sharper than any two-edged sword, and penetrating to [the] division of soul and spirit, both of joints and marrow, and a discerner of the thoughts and intents of [the] heart.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For the word of God [is] living and operative, and sharper than any two-edged sword, and penetrating to [the] division of soul and spirit, both of joints and marrow, and a discerner of the thoughts and intents of [the] heart.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“For the word of God is living and active. Sharper than any double-edged sword, it pierces even to dividing soul and spirit, joints and marrow. It judges the thoughts and intentions of the heart.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('For the word of God is living and active. Sharper than any double-edged sword, it pierces even to dividing soul and spirit, joints and marrow. It judges the thoughts and intentions of the heart.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's word is alive and powerful. It reaches deeply into us and exposes what is really in our hearts.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s word is alive and powerful. It reaches deeply into us and exposes what is really in our hearts.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">Ζῶν γὰρ ὁ <span class=\"noun greek-click\" data-word=\"λόγος\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Nominative masculine singular\">λόγος</span> τοῦ <span class=\"noun greek-click\" data-word=\"θεοῦ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Genitive masculine singular\">θεοῦ</span> καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν <span class=\"noun greek-click\" data-word=\"μάχαιραν\" data-meaning=\"sword\" data-lemma=\"μάχαιρα\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">μάχαιραν</span> δίστομον... καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν <span class=\"noun greek-click\" data-word=\"καρδίας\" data-meaning=\"heart\" data-lemma=\"καρδία\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">καρδίας</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">19. 야고보서 1:21</div>\n  <div class=\"verse\">그러므로 모든 더러움과 넘치는 악의를 버리고, 여러분의 혼을 구원할 수 있는 <span class='blue'>심어진 말씀</span>을 온유하게 받아들이십시오.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">그러므로 모든 더러운 것과 넘치는 악을 내어 버리고 능히 너희 영혼을 구원할바 마음에 심긴 도를 온유함으로 받으라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“Wherefore, laying aside all filthiness and abounding of wickedness, accept with meekness the implanted word, which is able to save your souls.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Wherefore, laying aside all filthiness and abounding of wickedness, accept with meekness the implanted word, which is able to save your souls.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Therefore, get rid of all moral filth and every expression of evil, and humbly accept the word planted in you, which can save your souls.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Therefore, get rid of all moral filth and every expression of evil, and humbly accept the word planted in you, which can save your souls.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Welcome God's word humbly as something planted inside you; it has power to save your life.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Welcome God\\'s word humbly as something planted inside you; it has power to save your life.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἐν πραΰτητι <span class=\"verb greek-click\" data-word=\"δέξασθε\" data-meaning=\"receive, welcome\" data-lemma=\"δέχομαι\" data-pos=\"Verb\" data-form=\"Aorist middle imperative, 2nd plural\">δέξασθε</span> τὸν ἔμφυτον <span class=\"noun greek-click\" data-word=\"λόγον\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Accusative masculine singular\">λόγον</span> τὸν <span class=\"verb greek-click\" data-word=\"δυνάμενον\" data-meaning=\"being able\" data-lemma=\"δύναμαι\" data-pos=\"Verb (participle)\" data-form=\"Present middle participle, accusative masculine singular\">δυνάμενον</span> <span class=\"verb greek-click\" data-word=\"σῶσαι\" data-meaning=\"to save\" data-lemma=\"σῴζω\" data-pos=\"Verb\" data-form=\"Aorist active infinitive\">σῶσαι</span> τὰς <span class=\"noun greek-click\" data-word=\"ψυχὰς\" data-meaning=\"souls, lives\" data-lemma=\"ψυχή\" data-pos=\"Noun\" data-form=\"Accusative feminine plural\">ψυχὰς</span> ὑμῶν.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">20. 시편 119:103</div>\n  <div class=\"verse\">주의 말씀은 내 입에 <span class='blue'>얼마나 달콤한지요! 꿀보다 더 달콤합니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">내가 나의 행위를 고하매 주께서 내게 응답하셨으니 주의 율례를 내게 가르치소서</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“How sweet are thy words unto my taste! more than honey to my mouth!”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('How sweet are thy words unto my taste! more than honey to my mouth!', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“How sweet are Your words to my taste—sweeter than honey in my mouth!”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('How sweet are Your words to my taste—sweeter than honey in my mouth!', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's words are deeply satisfying and sweeter to me than honey.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s words are deeply satisfying and sweeter to me than honey.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">HEBREW — 구약 원문</div><div class=\"greek-full\" style=\"direction:rtl;text-align:right\">מַה־נִּמְלְצוּ לְחִכִּי אִמְרָתֶךָ מִדְּבַשׁ לְפִי</div><div class=\"guide-note\" style=\"direction:ltr;text-align:left\">Old Testament original-language text: Hebrew.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">21. 베드로전서 2:2</div>\n  <div class=\"verse\">갓난아기들처럼 <span class='blue'>말씀의 순전한 젖</span>을 사모하십시오. 그러면 여러분은 그것으로 자라서 구원에 이를 것입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">갓난 아이들 같이 순전하고 신령한 젖을 사모하라 이는 이로 말미암아 너희로 구원에 이르도록 자라게 하려 함이라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“as newborn babes desire earnestly the pure mental milk of the word, that by it ye may grow up to salvation,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('as newborn babes desire earnestly the pure mental milk of the word, that by it ye may grow up to salvation,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“Like newborn babies, crave pure spiritual milk, so that by it you may grow up in your salvation,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Like newborn babies, crave pure spiritual milk, so that by it you may grow up in your salvation,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Long for God's pure word the way a newborn baby longs for milk, so that you can grow.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Long for God\\'s pure word the way a newborn baby longs for milk, so that you can grow.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ὡς ἀρτιγέννητα <span class=\"noun greek-click\" data-word=\"βρέφη\" data-meaning=\"babies, infants\" data-lemma=\"βρέφος\" data-pos=\"Noun\" data-form=\"Nominative neuter plural\">βρέφη</span> τὸ λογικὸν ἄδολον <span class=\"noun greek-click\" data-word=\"γάλα\" data-meaning=\"milk\" data-lemma=\"γάλα\" data-pos=\"Noun\" data-form=\"Accusative neuter singular\">γάλα</span> <span class=\"verb greek-click\" data-word=\"ἐπιποθήσατε\" data-meaning=\"long for, desire earnestly\" data-lemma=\"ἐπιποθέω\" data-pos=\"Verb\" data-form=\"Aorist active imperative, 2nd plural\">ἐπιποθήσατε</span>, ἵνα ἐν αὐτῷ <span class=\"verb greek-click\" data-word=\"αὐξηθῆτε\" data-meaning=\"you may grow\" data-lemma=\"αὐξάνω\" data-pos=\"Verb\" data-form=\"Aorist passive subjunctive, 2nd plural\">αὐξηθῆτε</span> εἰς <span class=\"noun greek-click\" data-word=\"σωτηρίαν\" data-meaning=\"salvation\" data-lemma=\"σωτηρία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">σωτηρίαν</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">22. 사도행전 20:32</div>\n  <div class=\"verse\">이제 나는 여러분을 하나님과 <span class='blue'>그분의 은혜의 말씀</span>께 맡깁니다. 그 말씀은 여러분을 건축하고 거룩하게 된 모든 사람 가운데 유업을 줄 수 있습니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">지금 내가 너희를 주와 및 그 은혜의 말씀께 부탁하노니 그 말씀이 너희를 능히 든든히 세우사 거룩케 하심을 입은 모든 자 가운데 기업이 있게 하시리라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“And now I commit you to God, and to the word of his grace, which is able to build [you] up and give [to you] an inheritance among all the sanctified.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And now I commit you to God, and to the word of his grace, which is able to build [you] up and give [to you] an inheritance among all the sanctified.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“And now I commit you to God and to the word of His grace, which can build you up and give you an inheritance among all who are sanctified.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('And now I commit you to God and to the word of His grace, which can build you up and give you an inheritance among all who are sanctified.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">God's gracious word can build believers up and bring them into the inheritance He gives.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('God\\'s gracious word can build believers up and bring them into the inheritance He gives.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">καὶ τὰ νῦν <span class=\"verb greek-click\" data-word=\"παρατίθεμαι\" data-meaning=\"I entrust, commend\" data-lemma=\"παρατίθημι\" data-pos=\"Verb\" data-form=\"Present middle indicative, 1st singular\">παρατίθεμαι</span> ὑμᾶς τῷ <span class=\"noun greek-click\" data-word=\"θεῷ\" data-meaning=\"God\" data-lemma=\"θεός\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">θεῷ</span> καὶ τῷ <span class=\"noun greek-click\" data-word=\"λόγῳ\" data-meaning=\"word, message\" data-lemma=\"λόγος\" data-pos=\"Noun\" data-form=\"Dative masculine singular\">λόγῳ</span> τῆς <span class=\"noun greek-click\" data-word=\"χάριτος\" data-meaning=\"grace\" data-lemma=\"χάρις\" data-pos=\"Noun\" data-form=\"Genitive feminine singular\">χάριτος</span> αὐτοῦ, τῷ <span class=\"verb greek-click\" data-word=\"δυναμένῳ\" data-meaning=\"being able\" data-lemma=\"δύναμαι\" data-pos=\"Verb (participle)\" data-form=\"Present middle participle, dative masculine singular\">δυναμένῳ</span> <span class=\"verb greek-click\" data-word=\"οἰκοδομῆσαι\" data-meaning=\"to build up\" data-lemma=\"οἰκοδομέω\" data-pos=\"Verb\" data-form=\"Aorist active infinitive\">οἰκοδομῆσαι</span> καὶ <span class=\"verb greek-click\" data-word=\"δοῦναι\" data-meaning=\"to give\" data-lemma=\"δίδωμι\" data-pos=\"Verb\" data-form=\"Aorist active infinitive\">δοῦναι</span> τὴν <span class=\"noun greek-click\" data-word=\"κληρονομίαν\" data-meaning=\"inheritance\" data-lemma=\"κληρονομία\" data-pos=\"Noun\" data-form=\"Accusative feminine singular\">κληρονομίαν</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">23. 에베소서 5:26</div>\n  <div class=\"verse\">이것은 그리스도께서 교회를 <span class='blue'>말씀 안에 있는 씻는 물로 깨끗하게 하여 거룩하게 하시려는 것</span>입니다.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">이는 곧 물로 씻어 말씀으로 깨끗하게 하사 거룩하게 하시고</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“in order that he might sanctify it, purifying [it] by the washing of water by [the] word,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('in order that he might sanctify it, purifying [it] by the washing of water by [the] word,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“to sanctify her, cleansing her by the washing with water through the word,”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('to sanctify her, cleansing her by the washing with water through the word,', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">Christ uses His word like cleansing water to make the church holy and clean.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('Christ uses His word like cleansing water to make the church holy and clean.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\">GREEK — 동사 🔴 · 명사 🟢</div><div class=\"greek-full\">ἵνα αὐτὴν <span class=\"verb greek-click\" data-word=\"ἁγιάσῃ\" data-meaning=\"he might sanctify\" data-lemma=\"ἁγιάζω\" data-pos=\"Verb\" data-form=\"Aorist active subjunctive, 3rd singular\">ἁγιάσῃ</span> <span class=\"verb greek-click\" data-word=\"καθαρίσας\" data-meaning=\"having cleansed\" data-lemma=\"καθαρίζω\" data-pos=\"Verb (participle)\" data-form=\"Aorist active participle, nominative masculine singular\">καθαρίσας</span> τῷ <span class=\"noun greek-click\" data-word=\"λουτρῷ\" data-meaning=\"washing, bath\" data-lemma=\"λουτρόν\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">λουτρῷ</span> τοῦ <span class=\"noun greek-click\" data-word=\"ὕδατος\" data-meaning=\"water\" data-lemma=\"ὕδωρ\" data-pos=\"Noun\" data-form=\"Genitive neuter singular\">ὕδατος</span> ἐν <span class=\"noun greek-click\" data-word=\"ῥήματι\" data-meaning=\"word, utterance\" data-lemma=\"ῥῆμα\" data-pos=\"Noun\" data-form=\"Dative neuter singular\">ῥήματι</span>.</div></div>\n  </div>\n</div>\n<div class=\"card\">\n  <div class=\"numref\">24. 요한복음 1:1, 14</div>\n  <div class=\"verse\">태초에 <span class='blue'>말씀</span>이 계셨고, 말씀은 하나님과 함께 계셨으며, 말씀은 하나님이셨습니다. … <span class='blue'>말씀께서 육체가 되시어 우리 가운데 장막을 치셨습니다</span>.</div>\n  <div class=\"korean-easy\"><div class=\"korean-easy-title\">개역한글</div><div class=\"engtext\">태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라</div></div>\n  <div class=\"english-grid\">\n    <div class=\"engbox\"><div class=\"engtitle\">DARBY</div><div class=\"engtext\">“In [the] beginning was the Word, and the Word was with God, and the Word was God.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('In [the] beginning was the Word, and the Word was with God, and the Word was God.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">BSB</div><div class=\"engtext\">“In the beginning was the Word, and the Word was with God, and the Word was God.”</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('In the beginning was the Word, and the Word was with God, and the Word was God.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"engtitle\">EASY ENGLISH — MEANING</div><div class=\"engtext\">The eternal Word was God, and that Word became a human being and lived among us.</div><div class=\"easy-note\">Plain-English meaning guide — not a Bible translation.</div><div class=\"audio-row\"><button class=\"listen\" onclick=\"speakText('The eternal Word was God, and that Word became a human being and lived among us.', this)\">🔊 Listen</button><select class=\"speed\"><option value=\".75\">0.75×</option><option value=\"1\" selected>1×</option><option value=\"1.25\">1.25×</option></select></div></div>\n    <div class=\"engbox\"><div class=\"greek-title\
